        /* CSS: TEMA GLASSMORPHISM & TRANSLUCENT     */
        /* ========================================= */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Nunito', 'Segoe UI', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: url('latarskin.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff; 
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            position: relative;
        }

        /* ========================================= */
        /* SIDEBAR / TASKBAR KIRI                    */
        /* ========================================= */
        .sidebar-overlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(4px);
            z-index: 90; 
            opacity: 0; 
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { 
            display: block; 
            opacity: 1; 
        }

        .left-sidebar {
            width: 260px; 
            background: rgba(20, 20, 30, 0.45);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 15px; 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
            z-index: 100;
            overflow-y: auto; 
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .left-sidebar::-webkit-scrollbar { display: none; }

        .sidebar-title { 
            text-align: center; 
            font-size: 18px; 
            color: #00a8ff; 
            margin-bottom: 5px; 
            font-weight: 800; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.2s;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.25); }

        .tier-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .tier-item {
            padding: 10px 15px; 
            background: rgba(255, 255, 255, 0.15); 
            color: #fff;
            font-weight: 700; 
            font-size: 13px; 
            border-radius: 25px; 
            cursor: pointer;
            text-align: center; 
            transition: all 0.3s ease; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tier-item:hover { background: rgba(255, 255, 255, 0.3); }
        .tier-item.active { 
            background: #00a8ff; 
            color: white; 
            border-color: #00a8ff; 
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.4); 
        }

        /* ========================================= */
        /* MAIN CONTENT & TOP BAR                    */
        /* ========================================= */
        .main-content {
            flex-grow: 1; 
            display: flex; 
            flex-direction: column;
            position: relative; 
            height: 100%; 
            overflow: hidden; 
            z-index: 10;
        }

        .top-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 15px 20px; 
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            gap: 10px;
        }

        .top-left-group { display: flex; align-items: center; gap: 12px; }

        .sidebar-toggle-btn {
            display: none; 
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; 
            font-size: 18px; 
            padding: 6px 12px;
            border-radius: 12px; 
            cursor: pointer;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.02); }

        .page-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        /* ========================================= */
        /* GRID AREA & KARTU                         */
        /* ========================================= */
        .card-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
        }
        .card-area::-webkit-scrollbar { width: 6px; }
        .card-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .card-area::-webkit-scrollbar-thumb { background: rgba(0, 168, 255, 0.5); border-radius: 10px; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px; 
            padding-bottom: 50px;
            align-items: start;
        }

        .card {
            position: relative; 
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.25); }

        .media-wrapper { width: 100%; position: relative; }
        .media-portrait { aspect-ratio: 3/4; }
        .media-landscape { aspect-ratio: 16/9; }

        .card-media { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.3s ease; }
        
        .card.locked .card-media { filter: grayscale(90%) brightness(0.6); }

        .lock-icon {
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); 
            font-size: 32px; 
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
        .card.locked .lock-icon { display: block; }

        .card-info {
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(6px);
            padding: 10px; 
            text-align: center; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        .card-name { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .card-jiko {

            padding-top: 5px; 
            border-top: 1px solid rgba(255,255,255,0.15);
            font-size: 10.5px; 
            font-style: italic; 
            color: rgba(255, 255, 255, 0.85); 
            line-height: 1.3;
        }

        .rarity-badge {
            position: absolute; 
            top: 8px; 
            left: 8px; 
            font-size: 9px; 
            font-weight: 800;
            padding: 3px 8px; 
            border-radius: 10px; 
            z-index: 4; 
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .bg-myth { background: #e91e63; }
        .bg-legend { background: #ff9800; }
        .bg-rare { background: #00bcd4; }
        .bg-uncommon { background: #4caf50; }

        @media screen and (max-width: 768px) {

        let ownedSkins = [];

        // ==========================================
        // 2. HELPER UTILS (COOKIE & NAVIGATION)
        // ==========================================
        function getCookie(name) {
            let nameEQ = name + "="; 
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i]; 
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            } 
            return null;
        }

        function toggleSidebar() {
            document.getElementById("leftSidebar").classList.toggle("open");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }

        function goBack() {
            if (window.history.length > 1 && document.referrer !== "") {
                window.history.back();
            } else {
                window.location.href = "../";
            }
        }

        // ==========================================
        // 3. FETCH DATA STATUS SKIN (PERSIS STATUSCHAT)
        // ==========================================
        async function fetchStatusSkin() {
            try {
                // Mengambil cookie sesi persis cara statuschat
                const sessionKey = getCookie("user_session") || "default_user";

                // Mengirim via POST dengan payload JSON tanpa credentials: 'include' untuk menghindari CORS Error
                const response = await fetch(`${BACKEND_URL}/statusskin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_cookie: sessionKey, 
                        sessionCookie: sessionKey 
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Mendukung fleksibilitas struktur JSON dari backend HuggingFace
                    ownedSkins = data.owned_skins || data.skins || data.ownedSkins || data.data || (Array.isArray(data) ? data : []);
                } else {
                    console.warn("Gagal terhubung ke backend, memuat status default...");
                }
            } catch (error) {
                console.error("Gagal load status skin:", error);
            } finally {
                renderCards("ALL"); 
            }
        }

        // Helper Ekstrak Rarity & Format Nama Reguler
        function getRarity(fileName) {
            if (fileName.includes("MYTH")) return { name: "MYTH", class: "bg-myth" };
            if (fileName.includes("LEGEND")) return { name: "LEGEND", class: "bg-legend" };
            if (fileName.includes("RARE")) return { name: "RARE", class: "bg-rare" };
            if (fileName.includes("UNCOMMON")) return { name: "UNCOMMON", class: "bg-uncommon" };
            return { name: "OMEGA", class: "bg-omega" };
        }

        function formatName(fileName) {
            let parts = fileName.split('_');
            parts.pop(); 
            return parts.map(word => word.charAt(0) + word.slice(1).toLowerCase()).join(' ');
        }

        // ==========================================
        // 4. RENDER KARTU SESUAI LOGIKA
        // ==========================================
        const cardContainer = document.getElementById('cardContainer');

        function renderCards(filterTier) {
            cardContainer.innerHTML = ""; 
            let htmlString = "";

            // A. SKIN REGULER (MYTH - UNCOMMON)
            REGULER_SKINS.forEach(fileName => {
                const rarityData = getRarity(fileName);
                if (filterTier !== "ALL" && filterTier !== rarityData.name) return;

                const isOwned = ownedSkins.includes(fileName);
                const displayName = formatName(fileName);
                
                const mediaSource = isOwned ? `../skin/${fileName}.jpg` : `../skin/${fileName}_grey.jpg`;
                const lockClass = isOwned ? "" : "locked";

                htmlString += `
                    <div class="card ${lockClass}">
                        <div class="rarity-badge ${rarityData.class}">${rarityData.name}</div>
                        <div class="lock-icon">🔒</div>
                        <div class="media-wrapper media-portrait">
                            <img class="card-media" src="${mediaSource}" loading="lazy" alt="${displayName}" onerror="this.onerror=null; this.src='../skin/${fileName}.jpg';">
                        </div>
                        <div class="card-info">
                            <div class="card-name">${displayName}</div>
                        </div>
                    </div>
                `;
            });

            // B. SKIN OMEGA & SPESIAL
            if (filterTier === "ALL" || filterTier === "OMEGA") {
                Object.entries(OMEGA_DATA).forEach(([code, data]) => {
                    const isOwned = ownedSkins.includes(code);
                    const lockClass = isOwned ? "" : "locked";

                    if (isOwned) {
                        const videoSource = `../gacha-skin/preview_${code}.webm`;
                        htmlString += `
                            <div class="card ${lockClass}">
                                <div class="rarity-badge bg-omega">OMEGA</div>
                                <div class="media-wrapper media-landscape">
                                    <video class="card-media" autoplay loop muted playsinline src="${videoSource}"></video>
                                </div>
                                <div class="card-info">
                                    <div class="card-name">${data.name}</div>
                                    <div class="card-jiko">"${data.jiko}"</div>
                                </div>
                            </div>
                        `;
                    } else {
                        const imageSource = `../skin_jpg/${code}.jpg`;
                        htmlString += `
                            <div class="card ${lockClass}">
                                <div class="rarity-badge bg-omega">OMEGA</div>
                                <div class="lock-icon">🔒</div>
                                <div class="media-wrapper media-landscape">
                                    <img class="card-media" src="${imageSource}" loading="lazy" alt="${data.name}">
                                </div>
                                <div class="card-info">
                                    <div class="card-name">${data.name}</div>
                                    <div class="card-jiko">"${data.jiko}"</div>
                                </div>
                            </div>
                        `;
                    }
                });
            }

            cardContainer.innerHTML = htmlString;
        }

        // ==========================================
        // 5. EVENT LISTENER MENU FILTER SIDEBAR
        // ==========================================
        document.querySelectorAll('.tier-item').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('.tier-item').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                renderCards(e.target.getAttribute('data-tier'));

                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });

        // Jalankan fetch status saat halaman pertama kali dibuka
        window.onload = fetchStatusSkin;
    </script>
