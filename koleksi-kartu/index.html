    <meta charset="UTF-8">

    <title>Koleksi Kartu Skin</title>
    <style>
        /* ========================================= */
        /* CSS: TAMPILAN DAN LAYOUT                  */
        /* ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden; /* Mencegah body scroll, scroll hanya di area kartu */
            background-color: #050505;
            color: #fff;
        }

        /* Latar Belakang Video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5;
        }

        /* Container Utama */
        .inventory-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            gap: 25px;
        }

        /* Sidebar Kiri (Taskbar) */
        .sidebar {
            width: 260px;
            background: rgba(15, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            border-right: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 15px;
            padding: 25px 0;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        .sidebar-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .tier-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tier-item {
            padding: 15px 30px;
            color: #8899aa;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .tier-item:hover {
            background: rgba(0, 255, 255, 0.1);
            color: #e0ffff;
        }

        .tier-item.active {
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.25) 0%, transparent 100%);
            color: #00ffff;
            border-left: 4px solid #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }

        /* Area Scroll Koleksi Kartu */
        .card-area {
            flex: 1;
            overflow-y: auto; /* Bisa discroll ke bawah jika banyak */
            padding-right: 15px;
        }

        /* Kustomisasi Scrollbar */
        .card-area::-webkit-scrollbar { width: 8px; }
        .card-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 10px; }
        .card-area::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 10px; }

        /* Grid Kartu */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding-bottom: 60px;
            align-items: start;
        }

        /* Desain Kartu (Potrait Default) */
        .card {
            position: relative;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 3/4;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 255, 255, 0.3);
        }

        /* Kartu Tipe Landscape (Omega / Spesial) */
        .card.landscape {
            grid-column: span 2;
            aspect-ratio: 16/9;
        }

        /* Media Pembungkus (Video / Gambar) */
        .card-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Info Overlay di Bawah Kartu */
        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95) 70%);
            padding: 15px 10px 10px 10px;
            text-align: center;
            z-index: 2;
        }

        .card-name {
            font-size: 14px;
            font-weight: 700;
            text-shadow: 1px 1px 3px #000;
        }

        /* Logo Kelompok Myth */
        .myth-logo {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 26px;
            z-index: 2;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Kotak Jiko untuk Omega */
        .jiko-box {
            background: rgba(10, 10, 10, 0.95);
            color: #f1c40f;
            font-size: 12px;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #f1c40f;
            font-style: italic;
            z-index: 3;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
    </style>

        /* ========================================= */
        /* LOGIKA FETCH DATA DARI BACKEND            */
        /* ========================================= */
        
        // Simpan array kode skin yang dimiliki user
        let ownedSkinCodes = []; 

        async function fetchInventoryStatus() {
            try {
                // Endpoint untuk mendapatkan array [kode] yang dimiliki user
                // const response = await fetch('/statusskin');
                // const data = await response.json();
                // ownedSkinCodes = data.owned_codes; 

                // --- DATA SIMULASI UJI COBA (Hapus di tahap produksi) ---
                ownedSkinCodes = [
                    "SCHR", "FCHR", "FIONY_ALVERIA_MYTH", "CGRC" 
                ];
                
                renderCards("ALL"); 
            } catch (error) {
                console.error("Gagal meload /statusskin", error);
            }
        }

        // Fungsi Menentukan Logo Kelompok Myth
        function getMythLogo(name) {
            if (name.includes("Passion")) return "🔥";
            if (name.includes("Dream")) return "🌙";
            if (name.includes("Love War")) return "💖";
            return "✨"; // Default logo jika tidak masuk kelompok di atas
        }

        const cardContainer = document.getElementById('cardContainer');

        /* ========================================= */
        /* LOGIKA MERENDER KARTU KE LAYAR            */
        /* ========================================= */
        function renderCards(filterTier) {
            cardContainer.innerHTML = ""; // Bersihkan kontainer

            // 1. RENDER KELAS OMEGA SPESIAL & OMEGA (VIDEO/LANDSCAPE)
            if (filterTier === "ALL" || filterTier === "OMEGA_SPESIAL" || filterTier === "OMEGA") {
                let targetList = [];
                if (filterTier === "ALL" || filterTier === "OMEGA_SPESIAL") {
                    targetList = targetList.concat(OMEGA_SPESIAL_LIST.map(item => ({...item, tier: "OMEGA_SPESIAL"})));
                }
                if (filterTier === "ALL" || filterTier === "OMEGA") {
                    targetList = targetList.concat(OMEGA_LIST.map(item => ({...item, tier: "OMEGA"})));
                }

                targetList.forEach(item => {
                    // Cek apakah kode ada di database kepemilikan user
                    const isOwned = ownedSkinCodes.includes(item.kode);
                    const jikoText = item.jiko || JIKO_DATA[item.nama] || "Tidak ada Jiko.";
                    
                    // URL LOGIKA DIREKTORI BARU
                    // Punya -> video .webm di /gacha-skin/
                    // Belum -> gambar abu statis .jpg di /skin_jpg/
                    const mediaSource = isOwned 
                        ? `gacha-skin/preview_${item.kode}.webm` 
                        : `skin_jpg/${item.kode}.jpg`;

                    const mediaElement = isOwned 
                        ? `<video class="card-media" autoplay loop muted src="${mediaSource}"></video>`
                        : `<img class="card-media" src="${mediaSource}" alt="${item.nama}">`;

                    const cardHTML = `
                        <div class="card landscape">
                            ${mediaElement}
                            <div class="card-info">
                                <div class="card-name">${item.nama}</div>
                            </div>
                            <div class="jiko-box">"${jikoText}"</div>
                        </div>
                    `;
                    cardContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            // 2. RENDER KELAS MYTH s.d UNCOMMON (FOTO/PORTRAIT)
            POOL_REGULER.forEach(item => {
                if (item.type !== undefined && item.type !== "skin") return; // Abaikan koin
                if (filterTier !== "ALL" && filterTier !== item.rarity) return;

                // Cek apakah item_code ada di database kepemilikan user
                const isOwned = ownedSkinCodes.includes(item.item_code);
                
                // URL LOGIKA DIREKTORI BARU
                // Punya -> gambar aslu .jpg di /skin/
                // Belum -> gambar abu _grey.jpg di /skin/
                const mediaSource = isOwned 
                    ? `skin/${item.item_code}.jpg` 
                    : `skin/${item.item_code}_grey.jpg`;

                let mythLogoHtml = (item.rarity === "MYTH") 
                    ? `<div class="myth-logo">${getMythLogo(item.name)}</div>` 
                    : "";

                const cardHTML = `
                    <div class="card">
                        ${mythLogoHtml}
                        <img class="card-media" src="${mediaSource}" alt="${item.name}">
                        <div class="card-info">
                            <div class="card-name">${item.name}</div>
                        </div>
                    </div>
                `;
                cardContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Listener klik Sidebar untuk Filtering
        document.querySelectorAll('.tier-item').forEach(item => {
            item.addEventListener('click', (e) => {
                // Ubah status aktif sidebar
                document.querySelectorAll('.tier-item').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                
                // Render ulang berdasarkan tier yang dipilih
                renderCards(e.target.getAttribute('data-tier'));
            });
        });

        // Panggil fetchInventoryStatus secara otomatis pertama kali dibuka
        window.onload = fetchInventoryStatus;
