            let nameEQ = name + "="; 
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i]; 
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);

        let ownedSkins = [];
        let currentTier = "ALL";
        let searchQuery = "";

        function getRarity(fileName) {
            if (fileName.includes("MYTH")) return { name: "MYTH", class: "badge-myth" };
            if (fileName.includes("LEGEND")) return { name: "LEGEND", class: "badge-legend" };
            if (fileName.includes("RARE")) return { name: "RARE", class: "badge-rare" };
            if (fileName.includes("UNCOMMON")) return { name: "UNCOMMON", class: "badge-uncommon" };
            return { name: "OMEGA", class: "badge-omega" };
        }

        function formatName(fileName) {
            let parts = fileName.split('_');
            parts.pop(); 
            return parts.map(word => word.charAt(0) + word.slice(1).toLowerCase()).join(' ');
        }

        async function fetchStatusSkin() {
            try {
                const sessionKey = getCookie("user_session") || "default_user";
                const backendUrl = typeof getApiUrl === "function" ? getApiUrl("core") : "https://shinezzzz-gokgokgogkgokgok.hf.space";
                
                const response = await fetch(`${backendUrl}/statusskin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_cookie: sessionKey, 
                        sessionCookie: sessionKey 
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    ownedSkins = data.owned_skins || data.skins || data.ownedSkins || data.data || (Array.isArray(data) ? data : []);
                }
            } catch (error) {
                console.warn("Memuat kartu dalam mode default / offline...");
            } finally {
                renderCards();
            }
        }

        function setTierFilter(tier, btnEl) {
            currentTier = tier;
            document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderCards();
        }

        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
            renderCards();
        }

        function setStandeeOshi(name, img) {
            localStorage.setItem("user_standee_hero", img);
            localStorage.setItem("user_custom_oshi", name);
            alert(`🎉 ${name} berhasil dipajang di Standee Profil utama kamu!`);
        }

        function renderCards() {
            const container = document.getElementById("cardContainer");
            container.innerHTML = "";
            let html = "";
            let countTotal = 0;
            let countOwned = 0;

            // 1. RENDER OMEGA & SPECIAL SKINS
            if (currentTier === "ALL" || currentTier === "OMEGA") {
                Object.entries(OMEGA_DATA).forEach(([code, data]) => {
                    const name = data.name;
                    if (searchQuery && !name.toLowerCase().includes(searchQuery) && !code.toLowerCase().includes(searchQuery)) return;

                    countTotal++;
                    const isOwned = ownedSkins.includes(code);
                    if (isOwned) countOwned++;

                    const lockClass = isOwned ? "" : "locked";
                    const lockIcon = isOwned ? "✨" : "🔒";
                    const mediaSrc = `../skin_jpg/${code}.jpg`;

                    html += `
                        <div class="card-item ${lockClass}" onclick="setStandeeOshi('${name}', '${mediaSrc}')">
                            <span class="card-badge badge-omega">OMEGA</span>
                            <div class="lock-indicator">${lockIcon}</div>
                            <div class="media-container">
                                <img src="${mediaSrc}" class="card-media" loading="lazy" alt="${name}" onerror="this.onerror=null; this.src='../grup/icon.png';">
                            </div>
                            <div class="card-meta">
                                <div class="card-name">${name}</div>
                                <div class="card-subtext">"${data.jiko}"</div>
                                <div class="card-actions">
                                    <button class="set-oshi-btn">Pajang di Standee</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            // 2. RENDER REGULAR SKINS (MYTH, LEGEND, RARE, UNCOMMON)
            REGULER_SKINS.forEach(fileName => {
                const rarity = getRarity(fileName);
                if (currentTier !== "ALL" && currentTier !== rarity.name) return;

                const displayName = formatName(fileName);
                if (searchQuery && !displayName.toLowerCase().includes(searchQuery) && !fileName.toLowerCase().includes(searchQuery)) return;

                countTotal++;
                const isOwned = ownedSkins.includes(fileName);
                if (isOwned) countOwned++;

                const lockClass = isOwned ? "" : "locked";
                const lockIcon = isOwned ? "✨" : "🔒";
                const mediaSource = isOwned ? `../skin/${fileName}.jpg` : `../skin/${fileName}_grey.jpg`;
                const fallbackSource = `../skin/${fileName}.jpg`;

                html += `
                    <div class="card-item ${lockClass}" onclick="setStandeeOshi('${displayName}', '${fallbackSource}')">
                        <span class="card-badge ${rarity.class}">${rarity.name}</span>
                        <div class="lock-indicator">${lockIcon}</div>
                        <div class="media-container">
                            <img src="${mediaSource}" class="card-media" loading="lazy" alt="${displayName}" onerror="this.onerror=null; this.src='${fallbackSource}';">
                        </div>
                        <div class="card-meta">
                            <div class="card-name">${displayName}</div>
                            <div class="card-subtext">${rarity.name} Photocard</div>
                            <div class="card-actions">
                                <button class="set-oshi-btn">Pajang di Standee</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById("totalCardsCount").innerText = countTotal;
            document.getElementById("ownedCardsCount").innerText = `Dimiliki: ${countOwned} / ${countTotal} Photocard`;
        }

            fetchStatusSkin();
