<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Skin - The Beyonce 48</title>
    <style>
        /* ========================================= */
        /* CSS: TEMA TERANG & KACA (Sesuai Screenshot) */
        /* ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Asumsi ini ditiban di atas background anime pemandangan lu */
            background-color: transparent;
            color: #333;
            overflow-x: hidden;
        }

        .inventory-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            gap: 20px;
        }

        /* SIDEBAR / FILTER (Glassmorphism) */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.5); /* Putih transparan */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .sidebar h2 {
            text-align: center;
            font-size: 20px;
            color: #1e88e5; /* Biru terang mirip tombol di web lu */
            margin-bottom: 25px;
            font-weight: 800;
        }

        .tier-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tier-item {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.6);
            color: #555;
            font-weight: 700;
            font-size: 14px;
            border-radius: 50px; /* Bentuk pill/kapsul mirip tombol gacha */
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .tier-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .tier-item.active {
            background: #00a8ff; /* Warna tombol spin web lu */
            color: white;
            border-color: #00a8ff;
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.4);
        }

        /* AREA GRID KARTU */
        .card-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
        }

        /* Scrollbar custom tipis */
        .card-area::-webkit-scrollbar { width: 8px; }
        .card-area::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .card-area::-webkit-scrollbar-thumb { background: rgba(0, 168, 255, 0.5); border-radius: 10px; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        /* KARTU (Glassmorphism) */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 3/4;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 168, 255, 0.2);
        }

        .card-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Gembok untuk yang belum punya */
        .lock-icon {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .card.locked .lock-icon {
            display: block;
        }

        /* Label Info Nama Kartu */
        .card-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 12px 8px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card-name {
            font-size: 12px;
            font-weight: 800;
            color: #333;
            word-wrap: break-word;
        }

        /* Label Rarity di pojok atas */
        .rarity-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 12px;
            z-index: 5;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .bg-myth { background: linear-gradient(45deg, #ff007f, #7928ca); }
        .bg-legend { background: linear-gradient(45deg, #f5af19, #f12711); }
        .bg-rare { background: linear-gradient(45deg, #00b4db, #0083b0); }
        .bg-uncommon { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .bg-omega { background: linear-gradient(45deg, #1f1c2c, #928dab); }

    </style>
</head>
<body>

    <div class="inventory-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>Koleksi Skin</h2>
            <ul class="tier-list">
                <li class="tier-item active" data-tier="ALL">Semua Skin</li>
                <li class="tier-item" data-tier="OMEGA">Omega & Spesial</li>
                <li class="tier-item" data-tier="MYTH">Myth</li>
                <li class="tier-item" data-tier="LEGEND">Legend</li>
                <li class="tier-item" data-tier="RARE">Rare</li>
                <li class="tier-item" data-tier="UNCOMMON">Uncommon</li>
            </ul>
        </aside>

        <!-- KARTU AREA -->
        <main class="card-area">
            <div class="card-grid" id="cardContainer">
                <!-- Kartu bakal dirender Javascript di sini -->
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // 1. DATA DARI USER (Gua rangkum biar rapi)
        // ==========================================

        // Data Member Reguler (Tanpa '_grey.jpg' biar gampang dikelola)
        const REGULER_SKINS = [
            "ABIGAIL_RACHEL_LEGEND", "ABIGAIL_RACHEL_MYTH", "ABIGAIL_RACHEL_RARE", "ABIGAIL_RACHEL_UNCOMMON",
            "ADELINE_WIJAYA_LEGEND", "ADELINE_WIJAYA_MYTH", "ADELINE_WIJAYA_RARE", "ADELINE_WIJAYA_UNCOMMON",
            "ADHISTY_ZARA_LEGEND", "ADHISTY_ZARA_MYTH", "ADHISTY_ZARA_RARE", "ADHISTY_ZARA_UNCOMMON",
            "ADZANA_ASHEL_LEGEND", "ADZANA_ASHEL_MYTH", "ADZANA_ASHEL_RARE", "ADZANA_ASHEL_UNCOMMON",
            "AFERA_THALIA_UNCOMMON",
            "ALYA_AMANDA_LEGEND", "ALYA_AMANDA_MYTH", "ALYA_AMANDA_RARE", "ALYA_AMANDA_UNCOMMON",
            "AMANDA_SUKMA_LEGEND", "AMANDA_SUKMA_MYTH", "AMANDA_SUKMA_RARE", "AMANDA_SUKMA_UNCOMMON",
            "ANGELINA_CHRISTY_LEGEND", "ANGELINA_CHRISTY_MYTH", "ANGELINA_CHRISTY_RARE", "ANGELINA_CHRISTY_UNCOMMON",
            "ANINDYA_RAMADHANI_LEGEND", "ANINDYA_RAMADHANI_MYTH", "ANINDYA_RAMADHANI_RARE", "ANINDYA_RAMADHANI_UNCOMMON",
            "ARA_LEGEND", "ARA_MYTH", "ARA_RARE", "ARA_UNCOMMON",
            "ASTRELLA_VIRGIANANDA_UNCOMMON", "AULIA_RIZA_UNCOMMON",
            "AURELLIA_LIA_LEGEND", "AURELLIA_LIA_MYTH", "AURELLIA_LIA_RARE", "AURELLIA_LIA_UNCOMMON",
            "AUREL_MAYORI_LEGEND", "AUREL_MAYORI_MYTH", "AUREL_MAYORI_RARE", "AUREL_MAYORI_UNCOMMON",
            "AURHEL_ALANA_LEGEND", "AURHEL_ALANA_MYTH", "AURHEL_ALANA_RARE", "AURHEL_ALANA_UNCOMMON",
            "AYANA_SHAHAB_LEGEND", "AYANA_SHAHAB_MYTH", "AYANA_SHAHAB_RARE", "AYANA_SHAHAB_UNCOMMON",
            "AZIZI_ASSADEL_LEGEND", "AZIZI_ASSADEL_MYTH", "AZIZI_ASSADEL_RARE", "AZIZI_ASSADEL_UNCOMMON",
            "BONG_APRILLI_UNCOMMON", "CARISSA_DINI_UNCOMMON",
            "CATHERINA_VALLENCIA_LEGEND", "CATHERINA_VALLENCIA_MYTH", "CATHERINA_VALLENCIA_RARE", "CATHERINA_VALLENCIA_UNCOMMON",
            "CATHLEEN_NIXIE_LEGEND", "CATHLEEN_NIXIE_MYTH", "CATHLEEN_NIXIE_RARE", "CATHLEEN_NIXIE_UNCOMMON",
            "CELLINE_THEFANI_LEGEND", "CELLINE_THEFANI_MYTH", "CELLINE_THEFANI_RARE", "CELLINE_THEFANI_UNCOMMON",
            "CHELSEA_DEVINA_LEGEND", "CHELSEA_DEVINA_MYTH", "CHELSEA_DEVINA_RARE", "CHELSEA_DEVINA_UNCOMMON",
            "CHRISTABELLA_BONITA_UNCOMMON",
            "CINDY_YUVIA_LEGEND", "CINDY_YUVIA_MYTH", "CINDY_YUVIA_RARE", "CINDY_YUVIA_UNCOMMON",
            "CORNELIA_VANISA_LEGEND", "CORNELIA_VANISA_MYTH", "CORNELIA_VANISA_RARE", "CORNELIA_VANISA_UNCOMMON",
            "CYNTHIA_YAPUTERA_LEGEND", "CYNTHIA_YAPUTERA_MYTH", "CYNTHIA_YAPUTERA_RARE", "CYNTHIA_YAPUTERA_UNCOMMON",
            "DENA_NATALIA_LEGEND", "DENA_NATALIA_MYTH", "DENA_NATALIA_RARE", "DENA_NATALIA_UNCOMMON",
            "DESY_NATALIA_LEGEND", "DESY_NATALIA_MYTH", "DESY_NATALIA_RARE", "DESY_NATALIA_UNCOMMON",
            "FAHIRA_PUTRI_UNCOMMON", "FATIMAH_AZZAHRA_UNCOMMON",
            "FEBRIOLA_SINAMBELLA_LEGEND", "FEBRIOLA_SINAMBELLA_MYTH", "FEBRIOLA_SINAMBELLA_RARE", "FEBRIOLA_SINAMBELLA_UNCOMMON",
            "FENI_FITRIYANTI_LEGEND", "FENI_FITRIYANTI_MYTH", "FENI_FITRIYANTI_RARE", "FENI_FITRIYANTI_UNCOMMON",
            "FIONY_ALVERIA_LEGEND", "FIONY_ALVERIA_MYTH", "FIONY_ALVERIA_RARE", "FIONY_ALVERIA_UNCOMMON",
            "FLORA_SHAFIQ_LEGEND", "FLORA_SHAFIQ_MYTH", "FLORA_SHAFIQ_RARE", "FLORA_SHAFIQ_UNCOMMON",
            "FREYA_JAYAWARDANA_LEGEND", "FREYA_JAYAWARDANA_MYTH", "FREYA_JAYAWARDANA_RARE", "FREYA_JAYAWARDANA_UNCOMMON",
            "FRIESKA_LEGEND", "FRIESKA_MYTH", "FRIESKA_RARE", "FRIESKA_UNCOMMON",
            "FRITZY_ROSMERIAN_LEGEND", "FRITZY_ROSMERIAN_MYTH", "FRITZY_ROSMERIAN_RARE", "FRITZY_ROSMERIAN_UNCOMMON",
            // Catatan: Lu bisa tambahin daftar sisa gen & member ke dalam array ini persis format di atas
        ];

        // Data Omega & Kode Pendek
        const OMEGA_SKINS = [
            "CELI", "CFNI", "CGRC", "CSHN", "DKTY", "FCHK", "FCHR", "FFIO", "FFNI", "FGRC",
            "FJIN", "FMAR", "FSHN", "PCHR", "PFNI", "PFNY", "PFYR", "PGRC", "PGTS", "PJCC",
            "PLAI", "PLLU", "PMSH", "PMUT", "PONL", "SALY", "SAMA", "SANI", "SARA", "SCAL",
            "SCAT", "SCHE", "SCHR", "SCYN", "SDAI", "SDAN", "SDEL", "SELI", "SELL", "SELN",
            "SERI", "SFEN", "SFIO", "SFLO", "SFRE", "SFRI", "SGEN", "SGIT", "SGRA", "SGRC",
            "SGRE", "SIDH", "SIND", "SJES", "SKAT", "SKIM", "SLAN", "SLEV", "SLIA", "SLIL",
            "SLUL", "SLYN", "SMAR", "SMIC", "SMOR", "SMUT", "SNAC", "SNAL", "SNAY", "SOLI",
            "SOLL", "SONI", "SRAI", "SREG", "SRIB", "STRI"
        ];

        // INI PENTING: Simulasi kepemilikan. Kalau di web asli, ambil dari Database/API.
        // Gua kasih contoh user ini cuma punya 3 skin.
        const ownedSkins = ["ABIGAIL_RACHEL_MYTH", "FIONY_ALVERIA_UNCOMMON", "CELI", "SCHR"]; 

        const cardContainer = document.getElementById('cardContainer');

        // Fungsi ekstrak nama untuk display dari format (ABIGAIL_RACHEL_LEGEND -> Abigail Rachel)
        function formatName(fileName) {
            let parts = fileName.split('_');
            parts.pop(); // Buang rarity (LEGEND/MYTH) di belakang
            return parts.map(word => word.charAt(0) + word.slice(1).toLowerCase()).join(' ');
        }

        // Fungsi ekstrak Rarity
        function getRarity(fileName) {
            if (fileName.includes("MYTH")) return { name: "MYTH", class: "bg-myth" };
            if (fileName.includes("LEGEND")) return { name: "LEGEND", class: "bg-legend" };
            if (fileName.includes("RARE")) return { name: "RARE", class: "bg-rare" };
            if (fileName.includes("UNCOMMON")) return { name: "UNCOMMON", class: "bg-uncommon" };
            return { name: "OMEGA", class: "bg-omega" };
        }

        // ==========================================
        // 2. LOGIKA RENDER (Tarik File Gambar Asli)
        // ==========================================
        function renderCards(filterTier) {
            cardContainer.innerHTML = ""; 

            let htmlString = "";

            // A. Proses Skin Reguler (Ada di /skin_jpg/)
            REGULER_SKINS.forEach(fileName => {
                const rarityData = getRarity(fileName);
                
                // Cek filter kategori
                if (filterTier !== "ALL" && filterTier !== rarityData.name) return;

                const isOwned = ownedSkins.includes(fileName);
                const displayName = formatName(fileName);
                
                // LOGIKA FILE: Ini yang ngebuat 404 ilang. Sesuai request lu!
                // Kalo punya = .jpg biasa. Kalo ga punya = _grey.jpg
                const mediaSource = isOwned 
                    ? `/skin_jpg/${fileName}.jpg` 
                    : `/skin_jpg/${fileName}_grey.jpg`;

                const lockClass = isOwned ? "" : "locked";

                htmlString += `
                    <div class="card ${lockClass}">
                        <div class="rarity-badge ${rarityData.class}">${rarityData.name}</div>
                        <div class="lock-icon">🔒</div>
                        <img class="card-media" src="${mediaSource}" loading="lazy" alt="${displayName}">
                        <div class="card-info">
                            <div class="card-name">${displayName}</div>
                        </div>
                    </div>
                `;
            });

            // B. Proses Skin Omega (Ada di /skin/)
            if (filterTier === "ALL" || filterTier === "OMEGA") {
                OMEGA_SKINS.forEach(code => {
                    const isOwned = ownedSkins.includes(code);
                    
                    // Asumsi: OMEGA juga lu siapin _grey.jpg nya karena lu bilang "semua keload versi grey"
                    // Kalau Omega di server lu GA ADA _grey.jpg, lu bisa hapus "_grey" di baris bawah ini khusus yg else.
                    const mediaSource = isOwned 
                        ? `/skin/${code}.jpg` 
                        : `/skin/${code}_grey.jpg`; 

                    const lockClass = isOwned ? "" : "locked";

                    htmlString += `
                        <div class="card ${lockClass}">
                            <div class="rarity-badge bg-omega">OMEGA</div>
                            <div class="lock-icon">🔒</div>
                            <img class="card-media" src="${mediaSource}" loading="lazy" alt="${code}">
                            <div class="card-info">
                                <div class="card-name">Skin ${code}</div>
                            </div>
                        </div>
                    `;
                });
            }

            cardContainer.innerHTML = htmlString;
        }

        // Event Listener untuk Filter Sidebar
        document.querySelectorAll('.tier-item').forEach(item => {
            item.addEventListener('click', (e) => {
                // Hapus warna aktif dari semua tombol
                document.querySelectorAll('.tier-item').forEach(el => el.classList.remove('active'));
                // Tambah warna aktif ke tombol yg diklik
                e.target.classList.add('active');
                
                // Jalankan fungsi render sesuai kategori
                renderCards(e.target.getAttribute('data-tier'));
            });
        });

        // Render semua kartu saat web pertama kali dibuka
        window.onload = () => renderCards("ALL");

    </script>
</body>
</html>
