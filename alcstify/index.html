<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Alcstify 48 &mdash; JKT48 Master Music &amp; Cinema</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800;900&display=swap');

:root {
  --primary: #ffd700;
  --accent: #ff007f;
  --cyan: #00f2fe;
  --bg-dark: #070a13;
  --card-dark: #0f1422;
  --border: rgba(255, 255, 255, 0.1);
  --text-main: #ffffff;
  --text-dim: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-dark); color: var(--text-main); display: flex; position: relative; }

/* AMBIENT BACKGROUND GLOW */
#dynamicBackdrop {
  position: fixed;
  inset: -60px;
  background-size: cover;
  background-position: center;
  filter: blur(90px) brightness(0.2) saturate(1.8);
  z-index: -3;
  transition: background-image 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
  transform: scale(1.2);
}
.glow-orb-1 { position: fixed; top: -15%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(255, 215, 0, 0.12), transparent 70%); z-index: -2; pointer-events: none; }
.glow-orb-2 { position: fixed; bottom: -15%; right: -10%; width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(255, 0, 127, 0.1), transparent 70%); z-index: -2; pointer-events: none; }

/* SIDEBAR */
.sb { width: 84px; background: rgba(10, 15, 29, 0.92); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 6px; gap: 8px; z-index: 100; overflow-y: auto; flex-shrink: 0; backdrop-filter: blur(30px); }
.sb::-webkit-scrollbar { display: none; }
.na { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-dim); font-weight: 700; font-size: 9.5px; background: rgba(255,255,255,0.03); width: 68px; height: 54px; border-radius: 12px; border: 1px solid transparent; text-align: center; gap: 4px; flex-shrink: 0; transition: all .2s; }
.na:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
.na.on { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.2); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
.ni { font-size: 17px; }

/* MAIN CONTAINER */
.mn { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; z-index: 10; min-width: 0; }

/* TOPBAR */
.tb { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--border); background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(25px); flex-shrink: 0; }
.brand-wrap { display: flex; align-items: center; gap: 12px; }
.brand-wrap img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary); }
.brand-title { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; color: #fff; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.badge-status { font-size: 11.5px; color: var(--primary); font-weight: 800; background: rgba(255, 215, 0, 0.12); padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.3); }

/* SCROLLABLE VIEWPORT */
.viewport { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 24px 120px; -webkit-overflow-scrolling: touch; }
.viewport::-webkit-scrollbar { width: 6px; }
.viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }

/* ====== SPLIT-CARD MUSIC PLAYER (MATCHING USER REFERENCE DESIGN) ====== */
.player-hero-card {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 32px;
  background: var(--card-dark);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 48% 52%;
  box-shadow: 0 24px 70px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.2);
  transition: all .3s ease;
}

/* LEFT: FULL-BLEED ARTWORK / VIDEO FRAME */
.card-left-art {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 380px;
  background: #000;
  overflow: hidden;
}
.hero-artwork {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s ease;
}
.player-hero-card:hover .hero-artwork {
  transform: scale(1.03);
}
.artwork-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 100%);
}

/* RIGHT: CLEAN CONTROL CARD */
.card-right-ctrl {
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #0f1422;
  position: relative;
}

/* TOP NAV ROW */
.ctrl-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 700;
}
.nav-pill { text-transform: uppercase; letter-spacing: 1px; font-size: 11px; color: rgba(255,255,255,0.7); }
.btn-icon-nav { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; transition: all .2s; }
.btn-icon-nav:hover { color: #fff; transform: scale(1.15); }

/* TRACK INFO & LIKE BUTTON */
.track-meta-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin: 20px 0 10px;
}
.meta-info { flex: 1; min-width: 0; }
.meta-category { font-size: 12px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.meta-title { font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px; line-height: 1.2; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-subtitle { font-size: 13px; color: var(--text-dim); font-weight: 600; margin-top: 4px; }
.btn-heart { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-dim); padding: 4px; transition: all .2s; }
.btn-heart:hover { color: #ff007f; transform: scale(1.15); }
.btn-heart.liked { color: #ff007f; }

/* AUDIO SPECTRUM VISUALIZER (RETRO WAVE BARS) */
.visualizer-strip {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 24px;
  margin: 6px 0 14px;
}
.vbar { flex: 1; background: rgba(255, 215, 0, 0.4); border-radius: 2px; height: 4px; transition: height .15s ease; }
.visualizer-strip.playing .vbar:nth-child(1) { animation: wave 0.5s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(2) { animation: wave 0.4s 0.1s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(3) { animation: wave 0.6s 0.2s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(4) { animation: wave 0.35s 0.05s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(5) { animation: wave 0.55s 0.15s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(6) { animation: wave 0.45s 0.25s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(7) { animation: wave 0.65s 0.1s infinite alternate; }
.visualizer-strip.playing .vbar:nth-child(8) { animation: wave 0.4s 0.2s infinite alternate; }
@keyframes wave { 0% { height: 4px; background: rgba(255, 215, 0, 0.3); } 100% { height: 22px; background: var(--primary); } }

/* PROGRESS SCRUBBER */
.progress-block { margin-bottom: 20px; }
.scrubber-track { width: 100%; height: 5px; background: rgba(255,255,255,0.12); border-radius: 6px; cursor: pointer; position: relative; }
.scrubber-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 6px; transition: width .1s linear; }
.timestamps-row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--text-dim); font-weight: 700; }

/* MEDIA CONTROLS ROW */
.controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.btn-media { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; transition: all .18s; display: flex; align-items: center; justify-content: center; }
.btn-media:hover { color: #fff; transform: scale(1.15); }
.btn-media.active { color: var(--primary); }

.btn-main-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #ffffff;
  color: #000000;
  font-size: 18px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,255,255,0.25);
  transition: all .2s;
}
.btn-main-circle:hover { transform: scale(1.08); background: var(--primary); }

/* BOTTOM NEXT-UP MINI CARD */
.next-up-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all .2s;
}
.next-up-pill:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }
.next-meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
.next-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
.next-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.next-title { font-size: 12.5px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ====== DISCOGRAPHY / 358 SONGS CATALOG ====== */
.catalog-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.sinput { flex: 1; min-width: 240px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; color: #fff; font-size: 13.5px; outline: none; }
.sinput:focus { border-color: var(--primary); box-shadow: 0 0 16px rgba(255, 215, 0, 0.2); }
.sinput::placeholder { color: rgba(255,255,255,0.35); }

.fpill-group { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.fpill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all .2s; white-space: nowrap; }
.fpill:hover { background: rgba(255,255,255,0.1); color: #fff; }
.fpill.on { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 900; }

.sec-group { margin-bottom: 32px; }
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sec-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: -0.3px; }
.card-carousel { overflow-x: auto; display: flex; gap: 14px; padding-bottom: 8px; scrollbar-width: none; }
.card-carousel::-webkit-scrollbar { display: none; }

.song-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 16px; padding: 12px; width: 164px; flex-shrink: 0; cursor: pointer; transition: all .25s ease; position: relative; }
.song-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(15, 23, 42, 0.9); box-shadow: 0 12px 28px rgba(0,0,0,0.6); }
.song-card.active { border-color: var(--primary); background: rgba(255, 215, 0, 0.08); }
.card-thumb-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; background: #111; margin-bottom: 10px; }
.card-thumb { width: 100%; height: 100%; object-fit: cover; }
.card-play-float { position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; opacity: 0; transform: translateY(8px); transition: all .2s; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
.song-card:hover .card-play-float { opacity: 1; transform: translateY(0); }
.song-card.active .card-play-float { opacity: 1; transform: translateY(0); background: #fff; }
.card-name { font-size: 13.5px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

/* ====== FULLSCREEN LYRICS VIEW ====== */
.lyrics-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(5, 8, 17, 0.94); backdrop-filter: blur(45px); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .4s cubic-bezier(0.25, 0.8, 0.25, 1); }
.lyrics-overlay.open { transform: translateY(0); }
.lyrics-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.lyrics-close { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lyrics-close:hover { background: #ef4444; }

.lyrics-scroll { flex: 1; overflow-y: auto; padding: 40px 24px 160px; text-align: center; scroll-behavior: smooth; }
.lyric-line { font-size: 24px; font-weight: 800; line-height: 1.8; color: rgba(255,255,255,0.3); margin-bottom: 24px; cursor: pointer; transition: all .3s ease; }
.lyric-line.active { color: #fff; font-size: 28px; text-shadow: 0 0 24px rgba(255, 215, 0, 0.6); transform: scale(1.04); }
.lyric-word { display: inline; transition: all .15s; margin-right: 6px; }
.lyric-word.sung { color: var(--primary); text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); }
.lyric-word.active-word { color: #fff; text-shadow: 0 0 16px #fff, 0 0 30px var(--primary); font-size: 30px; }

/* ====== CINEMA POP-UP MODAL ====== */
.cinema-modal { position: fixed; inset: 0; z-index: 220; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.cinema-modal.open { opacity: 1; pointer-events: auto; }
.cinema-box { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
.cinema-close { position: absolute; top: -14px; right: -14px; z-index: 10; background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cinema-close:hover { background: #ef4444; }

@media(max-width: 868px) {
  .sb { display: none; }
  .player-hero-card { grid-template-columns: 1fr; }
  .card-left-art { min-height: 240px; }
  .card-right-ctrl { padding: 20px; }
  .meta-title { font-size: 21px; }
  .lyric-line { font-size: 18px; }
  .lyric-line.active { font-size: 21px; }
}
</style>
</head>

<!-- CINEMA POP-UP MODAL (16:9 HD DRIVE VIDEO) -->
<div class="cinema-modal" id="cinemaModal" onclick="closeCinemaOnBackdrop(event)">
  <div class="cinema-box">
    <button class="cinema-close" onclick="closeCinema()">&#10005;</button>
    <video id="cinemaVideo" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;display:none;"></video>
    <iframe id="cinemaFrame" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<script>
// ===== STATE & DATA =====
let TRACKS = [];
let ALBUM_MAP = new Map();
let currentTrackIndex = 0;
let isShuffle = false;
let favorites = new Set(JSON.parse(localStorage.getItem('alc48_favs') || '[]'));
let activeFilter = 'all', searchQuery = '';
const audio = document.getElementById('masterAudio');

// ===== AUDIO EVENTS =====
audio.addEventListener('play', () => {
  document.getElementById('heroPlayBtn').innerHTML = '&#9646;&#9646;';
  document.getElementById('vStrip').classList.add('playing');
});

audio.addEventListener('pause', () => {
  document.getElementById('heroPlayBtn').innerHTML = '&#9654;';
  document.getElementById('vStrip').classList.remove('playing');
});

audio.addEventListener('ended', nextTrack);

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 1;
  document.getElementById('scrubberFill').style.width = ((cur / dur) * 100).toFixed(2) + '%';
  document.getElementById('timeCur').textContent = formatTime(cur);
  document.getElementById('timeDur').textContent = formatTime(dur);
  updateLyricsSync(cur);
});

audio.addEventListener('error', () => {
  const t = TRACKS[currentTrackIndex];
  if (t && t.cdn_url && audio.src !== t.cdn_url) {
    audio.src = t.cdn_url;
    audio.play().catch(() => {});
  }
});

// ===== LYRICS SYNC ENGINE =====
let wordTimings = [];
let lastSyncWordIndex = -1;

function updateLyricsSync(t) {
  if (!wordTimings.length) return;
  let wi = -1;
  for (let i = 0; i < wordTimings.length; i++) {
    if (t >= wordTimings[i].t) wi = i; else break;
  }
  if (wi === lastSyncWordIndex) return;
  lastSyncWordIndex = wi;

  const scroll = document.getElementById('lyricsScroll');
  const lines = scroll.querySelectorAll('.lyric-line');
  const curLine = wi >= 0 ? wordTimings[wi].lineIdx : -1;
  const curWordInLine = wi >= 0 ? wordTimings[wi].wordIdx : -1;

  lines.forEach((line, li) => {
    line.classList.remove('active');
    const words = line.querySelectorAll('.lyric-word');
    if (li === curLine) {
      line.classList.add('active');
      words.forEach((w, wIdx) => {
        w.classList.remove('sung', 'active-word');
        if (wIdx < curWordInLine) w.classList.add('sung');
        else if (wIdx === curWordInLine) w.classList.add('active-word');
      });
    } else {
      words.forEach(w => w.classList.remove('active-word'));
      if (li < curLine) words.forEach(w => w.classList.add('sung'));
      else words.forEach(w => w.classList.remove('sung'));
    }
  });

  if (curLine >= 0 && lines[curLine]) {
    const el = lines[curLine];
    const top = el.offsetTop - scroll.offsetTop - (scroll.clientHeight / 2) + 30;
    scroll.scrollTo({ top, behavior: 'smooth' });
  }
}

const MASTER_LYRICS = {
  "RIVER": `Forward, go ahead!
Maju terus pantang mundur!
RIVER!
Menyeberanglah, lewati rintangan yang ada
Jangan menyerah, walau arus begitu deras
Masa depan membentang di hadapanmu!
RIVER!`,
  "Heavy Rotation": `I want you!
I need you!
I love you!
Di dalam benakku selalu berputar
Heavy Rotation!
Perasaan yang takkan pernah pudar
Cintaku kepadamu berputar kencang
Selamanya!`,
  "Fortune Cookie yang Mencinta": `Penampilan yang biasa saja
Janganlah kau merasa putus asa
Keberuntungan ada di dalam hatimu
Senyumlah selalu
Fortune Cookie yang mencinta
Janganlah kau menyerah begitu saja
Masa depan tidaklah seburuk itu
Sambutlah hari esok dengan senyuman!`,
  "Pesawat Kertas 365 Hari": `Hidup bagaikan pesawat kertas
Terus terbang melayang tinggi
Menembus angin dan badai di langit luas
Jangan pernah menyerah mengejar impianmu!`,
  "Rapsodi": `Kelingking kita berjanji
Jari manis jadi saksi
Kau dan aku selamanya
Dalam ikatan cinta suci
Mengalir bagai melodi yang indah
Rapsodi cinta kita!`
};

// ===== LRCLIB API + WORD INTERPOLATION KARAOKE ENGINE =====
const LYRICS_CACHE = new Map();

async function fetchLyricsFromLRCLIB(title, artist = "JKT48") {
  // Clean song title (remove prefixes, romanizations or discography numbers)
  const cleanTitle = title.replace(/^\d+[\s_-]*/, '').replace(/[-_]/g, ' ').trim();
  const cacheKey = cleanTitle.toLowerCase();
  if (LYRICS_CACHE.has(cacheKey)) return LYRICS_CACHE.get(cacheKey);

  try {
    // 1. Try exact get
    const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(artist)}`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data && data.syncedLyrics) {
        LYRICS_CACHE.set(cacheKey, data.syncedLyrics);
        return data.syncedLyrics;
      }
    }

    // 2. Try search fallback
    const searchUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle + ' JKT48')}`;
    const sRes = await fetch(searchUrl);
    if (sRes.ok) {
      const sData = await sRes.json();
      if (Array.isArray(sData) && sData.length > 0) {
        const found = sData.find(x => x.syncedLyrics) || sData[0];
        if (found && found.syncedLyrics) {
          LYRICS_CACHE.set(cacheKey, found.syncedLyrics);
          return found.syncedLyrics;
        }
      }
    }
  } catch(e) {
    console.log("LRCLIB note:", e);
  }
  return null;
}

function parseLrcToLines(lrcText) {
  const parsed = [];
  lrcText.trim().split('\n').forEach(line => {
    const m = line.match(/\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/);
    if (m) {
      const min = parseInt(m[1], 10);
      const sec = parseFloat(m[2]);
      const text = m[3].trim();
      if (text) parsed.push({ t: min * 60 + sec, text });
    }
  });
  return parsed;
}

async function loadLyrics(t) {
  const scroll = document.getElementById('lyricsScroll');
  scroll.innerHTML = '<div style="color:rgba(255,255,255,0.4);margin-top:80px;">Menyelaraskan lirik dari database online...</div>';
  wordTimings = [];
  lastSyncWordIndex = -1;

  let rawLrc = await fetchLyricsFromLRCLIB(t.title);
  if (!rawLrc) {
    rawLrc = MASTER_LYRICS[t.title];
  }

  if (!rawLrc) {
    rawLrc = `[00:04.00] ${t.title} - JKT48
[00:14.00] Melangkah maju meraih impian kita
[00:26.00] Jangan menyerah walau badai menghadang
[00:40.00] Terus bernyanyi bersama penuh semangat
[00:56.00] Masa depan cerah menanti di depan mata
[01:12.00] Bersama JKT48 kita bersinar abadi!`;
  }

  if (!rawLrc.includes('[')) {
    const lines = rawLrc.trim().split('\n').filter(l => l.trim().length > 0);
    let time = 4.0;
    let res = '';
    lines.forEach(l => {
      const m = Math.floor(time / 60);
      const s = Math.floor(time % 60);
      res += `[${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.00] ${l.trim()}\n`;
      time += 6.0;
    });
    rawLrc = res;
  }

  const lines = parseLrcToLines(rawLrc);
  scroll.innerHTML = '';

  lines.forEach((lObj, lineIdx) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.onclick = () => { if (audio) audio.currentTime = lObj.t; };

    const words = lObj.text.split(' ');
    // Hitung durasi sampai baris berikutnya untuk timing kata yang presisi
    const nextLineTime = (lines[lineIdx + 1] ? lines[lineIdx + 1].t : lObj.t + 5.0);
    const lineDuration = Math.max(nextLineTime - lObj.t, 2.0);
    const durationPerWord = lineDuration / Math.max(words.length, 1);

    words.forEach((w, wIdx) => {
      const span = document.createElement('span');
      span.className = 'lyric-word';
      span.textContent = w + ' ';
      div.appendChild(span);

      wordTimings.push({
        t: lObj.t + (wIdx * durationPerWord),
        lineIdx,
        wordIdx: wIdx
      });
    });

    scroll.appendChild(div);
  });
}

// ===== PLAY TRACK ENGINE =====
function playTrack(index) {
  if (!TRACKS || !TRACKS.length) return;
  if (index < 0) index = TRACKS.length - 1;
  if (index >= TRACKS.length) index = 0;
  currentTrackIndex = index;
  const t = TRACKS[currentTrackIndex];

  const coverUrl = t.cover || `https://drive.google.com/thumbnail?id=${t.drive_id}&sz=w600-h600`;
  document.getElementById('dynamicBackdrop').style.backgroundImage = `url('${coverUrl}')`;
  document.getElementById('heroCover').src = coverUrl;
  document.getElementById('trackCategory').textContent = t.album;
  document.getElementById('trackTitle').textContent = t.title;
  document.getElementById('trackSub').textContent = `JKT48 \u2022 ${t.album} \u2022 ${t.year}`;

  // Next Track Preview
  const nextIdx = (currentTrackIndex + 1) % TRACKS.length;
  const nextT = TRACKS[nextIdx];
  if (nextT) {
    document.getElementById('nextThumb').src = nextT.cover || `https://drive.google.com/thumbnail?id=${nextT.drive_id}&sz=w600-h600`;
    document.getElementById('nextTitle').textContent = nextT.title;
  }

  // Lyrics Header
  document.getElementById('lyricsThumb').src = coverUrl;
  document.getElementById('lyricsTitle').textContent = t.title;
  document.getElementById('lyricsArtist').textContent = t.album;

  // Active Highlight in cards
  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`track_${t._i}`);
  if (card) card.classList.add('active');

  updateFavoriteButton();
  loadLyrics(t);

  // Dedicated High-Speed Stream API URL from config.js
  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('stream') : 'https://shinezzzz-gokgokgok.hf.space';
  audio.src = `${apiBase}/api/drive/stream/${t.drive_id}`;
  audio.play().catch(err => console.log("Autoplay notice:", err));
}

function togglePlayState() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextTrack() {
  if (isShuffle) {
    const r = Math.floor(Math.random() * TRACKS.length);
    playTrack(r);
  } else {
    playTrack(currentTrackIndex + 1);
  }
}

function prevTrack() {
  playTrack(currentTrackIndex - 1);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
}

function seekTrack(e) {
  const rect = document.getElementById('scrubberTrack').getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pos * audio.duration;
}

function formatTime(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ===== FAVORITES / PLAYLIST =====
function updateFavoriteButton() {
  const btn = document.getElementById('heroLikeBtn');
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (favorites.has(t.id)) {
    btn.innerHTML = '&#10084;';
    btn.classList.add('liked');
  } else {
    btn.innerHTML = '&#9825;';
    btn.classList.remove('liked');
  }
  document.getElementById('favCount').textContent = favorites.size;
}

function toggleFavorite() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (favorites.has(t.id)) favorites.delete(t.id);
  else favorites.add(t.id);
  localStorage.setItem('alc48_favs', JSON.stringify([...favorites]));
  updateFavoriteButton();
  if (activeFilter === 'liked') renderSections();
}

// ===== RENDER SECTIONS & CARDS =====
function renderSections() {
  const container = document.getElementById('sectionContainer');
  container.innerHTML = '';

  ALBUM_MAP.forEach(alb => {
    let filteredSongs = alb.songs;
    if (activeFilter === 'liked') {
      filteredSongs = filteredSongs.filter(s => favorites.has(s.id));
    } else if (activeFilter !== 'all') {
      if (alb.type !== activeFilter) filteredSongs = [];
    }

    if (searchQuery) {
      filteredSongs = filteredSongs.filter(s =>
        s.title.toLowerCase().includes(searchQuery) ||
        s.album.toLowerCase().includes(searchQuery) ||
        s.year.includes(searchQuery)
      );
    }

    if (!filteredSongs.length) return;

    const sec = document.createElement('div');
    sec.className = 'sec-group';
    sec.innerHTML = `
      <div class="sec-header">
        <span class="sec-title">${alb.name}</span>
      </div>
      <div class="card-carousel">
        ${filteredSongs.map(s => `
          <div class="song-card ${s._i === currentTrackIndex ? 'active' : ''}" id="track_${s._i}" onclick="playTrack(${s._i})">
            <div class="card-thumb-wrap">
              <img class="card-thumb" src="${s.cover}" onerror="this.src='../icon.png'" alt="${s.title}" loading="lazy">
              <div class="card-play-float">&#9654;</div>
            </div>
            <div class="card-name">${s.title}</div>
            <div class="card-sub">${s.year} &bull; JKT48</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(sec);
  });
}

function filterCategory(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.fpill').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  renderSections();
}

function onSearchInput() {
  searchQuery = document.getElementById('sq').value.trim().toLowerCase();
  renderSections();
}

// ===== MODAL VIEWS =====
function openLyrics() { document.getElementById('lyricsOverlay').classList.add('open'); }
function closeLyrics() { document.getElementById('lyricsOverlay').classList.remove('open'); }

function openCinema() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (!audio.paused) audio.pause();

  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('stream') : 'https://shinezzzz-gokgokgok.hf.space';
  const videoEl = document.getElementById('cinemaVideo');
  const frameEl = document.getElementById('cinemaFrame');

  if (t.drive_id) {
    videoEl.src = `${apiBase}/api/drive/stream/${t.drive_id}`;
    videoEl.style.display = 'block';
    frameEl.style.display = 'none';
    frameEl.src = 'about:blank';
    videoEl.play().catch(() => {
      videoEl.style.display = 'none';
      frameEl.style.display = 'block';
      frameEl.src = t.preview_url || `https://drive.google.com/file/d/${t.drive_id}/preview`;
    });
  } else {
    frameEl.src = t.preview_url;
    frameEl.style.display = 'block';
    videoEl.style.display = 'none';
  }
  document.getElementById('cinemaModal').classList.add('open');
}

function closeCinema() {
  const videoEl = document.getElementById('cinemaVideo');
  const frameEl = document.getElementById('cinemaFrame');
  if (videoEl) { videoEl.pause(); videoEl.src = ''; }
  if (frameEl) { frameEl.src = 'about:blank'; }
  document.getElementById('cinemaModal').classList.remove('open');
}

function closeCinemaOnBackdrop(e) {
  if (e.target.id === 'cinemaModal') closeCinema();
}

// ===== INIT =====
async function initApp() {
  try {
    const res = await fetch('./jkt48_songs.json');
    if (res.ok) TRACKS = await res.json();
  } catch(e) {}

  if (TRACKS && TRACKS.length > 0) {
    ALBUM_MAP.clear();
    TRACKS.forEach((t, i) => {
      t._i = i;
      if (!ALBUM_MAP.has(t.album)) {
        ALBUM_MAP.set(t.album, { name: t.album, type: t.type, year: t.year, songs: [] });
      }
      ALBUM_MAP.get(t.album).songs.push(t);
    });

    renderSections();
    playTrack(0);
  }
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
