<!DOCTYPE html>
<html lang="id">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800;900&display=swap');

:root {
  --primary: #00f2fe;
  --accent: #ff007f;
  --gold: #ffd700;
  --green: #22c55e;
  --bg-dark: #050811;
  --card-bg: rgba(15, 23, 42, 0.7);
  --border: rgba(255, 255, 255, 0.1);
  --text-main: #ffffff;
  --text-dim: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-dark); color: var(--text-main); display: flex; position: relative; }

/* AMBIENT BACKGROUND GLOW */
#dynamicBackdrop {
  position: fixed;
  inset: -60px;
  background-size: cover;
  background-position: center;
  filter: blur(90px) brightness(0.2) saturate(2);
  z-index: -3;
  transition: background-image 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
  transform: scale(1.2);
  will-change: background-image;
}
.glow-orb-1 { position: fixed; top: -15%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0, 242, 254, 0.15), transparent 70%); z-index: -2; pointer-events: none; }
.glow-orb-2 { position: fixed; bottom: -15%; right: -10%; width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(255, 0, 127, 0.12), transparent 70%); z-index: -2; pointer-events: none; }

/* SIDEBAR */
.sb { width: 84px; background: rgba(10, 15, 29, 0.9); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 6px; gap: 8px; z-index: 100; overflow-y: auto; flex-shrink: 0; backdrop-filter: blur(30px); }
.sb::-webkit-scrollbar { display: none; }
.na { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-dim); font-weight: 700; font-size: 9.5px; background: rgba(255,255,255,0.03); width: 68px; height: 54px; border-radius: 12px; border: 1px solid transparent; text-align: center; gap: 4px; flex-shrink: 0; transition: all .2s; }
.na:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
.na.on { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.2); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
.ni { font-size: 17px; }

/* MAIN CONTAINER */
.mn { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; z-index: 10; }

/* TOPBAR */
.tb { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(25px); flex-shrink: 0; }
.brand-wrap { display: flex; align-items: center; gap: 12px; }
.brand-wrap img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary); }
.brand-title { font-size: 16px; font-weight: 900; letter-spacing: -0.2px; background: linear-gradient(90deg, #fff, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Rajdhani', sans-serif; font-size: 20px; }
.view-tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 14px; border: 1px solid var(--border); }
.vtab { background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 10px; cursor: pointer; transition: all .2s; }
.vtab.on { background: #00f2fe; color: #000; font-weight: 800; box-shadow: 0 2px 10px rgba(0, 242, 254, 0.4); }

/* SCROLLABLE VIEWPORT */
.viewport { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 24px 110px; -webkit-overflow-scrolling: touch; }
.viewport::-webkit-scrollbar { width: 6px; }
.viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 6px; }

/* ====== HERO SECTION: 3D VINYL TURNTABLE DECK ====== */
.deck-section { width: 100%; max-width: 1080px; margin: 0 auto 28px; background: rgba(15, 23, 42, 0.75); border: 1px solid var(--border); border-radius: 28px; padding: 28px; backdrop-filter: blur(40px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: center; }

/* 3D VINYL DISC */
.vinyl-stage { position: relative; width: 280px; height: 280px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
.vinyl-disc { position: absolute; width: 270px; height: 270px; border-radius: 50%; background: radial-gradient(circle, #080808 28%, #1f1f1f 30%, #0d0d0d 45%, #2a2a2a 47%, #080808 65%, #1c1c1c 67%, #000 100%); box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 12px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; animation: spinVinyl 16s linear infinite; animation-play-state: paused; transition: all .4s; }
.vinyl-disc.playing { animation-play-state: running; box-shadow: 0 0 35px rgba(0, 242, 254, 0.3), inset 0 0 12px rgba(255,255,255,0.08); }
@keyframes spinVinyl { 100% { transform: rotate(360deg); } }

.vinyl-center-label { width: 105px; height: 105px; border-radius: 50%; object-fit: cover; border: 4px solid #111; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
.vinyl-center-hole { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #000; border: 2px solid #555; z-index: 5; }

/* VINYL TONEARM */
.tonearm { position: absolute; top: -10px; right: -10px; width: 70px; height: 140px; transform-origin: 55px 15px; transform: rotate(-25deg); transition: transform .8s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 10; }
.tonearm.active { transform: rotate(18deg); }
.arm-base { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #bbb, #333); position: absolute; right: 0; top: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
.arm-rod { width: 4px; height: 110px; background: linear-gradient(to right, #ccc, #888); position: absolute; right: 13px; top: 20px; border-radius: 2px; }
.arm-head { width: 14px; height: 24px; background: #00f2fe; position: absolute; right: 8px; bottom: 0; border-radius: 3px; box-shadow: 0 0 10px #00f2fe; }

/* DECK TRACK INFO & EQUALIZER */
.deck-info { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.deck-badge { align-self: flex-start; background: rgba(0, 242, 254, 0.12); color: var(--primary); border: 1px solid rgba(0, 242, 254, 0.3); font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
.deck-title { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: #fff; line-height: 1.2; }
.deck-album { font-size: 13.5px; color: var(--text-dim); font-weight: 600; }

/* AUDIO SPECTRUM VISUALIZER */
.eq-bars { display: flex; align-items: flex-end; gap: 4px; height: 32px; margin: 4px 0; }
.eq-bar { width: 4px; background: linear-gradient(to top, #00f2fe, #ff007f); border-radius: 4px; height: 6px; transition: height .15s ease; }
.eq-bars.playing .eq-bar:nth-child(1) { animation: eqPulse 0.6s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(2) { animation: eqPulse 0.4s 0.1s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(3) { animation: eqPulse 0.7s 0.2s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(4) { animation: eqPulse 0.5s 0.15s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(5) { animation: eqPulse 0.8s 0.05s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(6) { animation: eqPulse 0.6s 0.25s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(7) { animation: eqPulse 0.45s 0.1s infinite alternate; }
.eq-bars.playing .eq-bar:nth-child(8) { animation: eqPulse 0.75s 0.3s infinite alternate; }
@keyframes eqPulse { 0% { height: 6px; } 100% { height: 30px; } }

/* QUICK DECK CONTROLS */
.deck-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.btn-deck-play { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; border: none; font-weight: 900; font-size: 13.5px; padding: 10px 22px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .2s; }
.btn-deck-play:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4); }
.btn-deck-mv { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; font-weight: 800; font-size: 13px; padding: 10px 18px; border-radius: 12px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px; }
.btn-deck-mv:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

/* ====== DISCOGRAPHY / LIBRARY CARDS ====== */
.library-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.sinput { flex: 1; min-width: 240px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; color: #fff; font-size: 13px; outline: none; }
.sinput:focus { border-color: #00f2fe; box-shadow: 0 0 16px rgba(0, 242, 254, 0.25); }
.sinput::placeholder { color: rgba(255,255,255,0.35); }

.fpill-group { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.fpill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all .2s; white-space: nowrap; }
.fpill:hover { background: rgba(255,255,255,0.1); color: #fff; }
.fpill.on { background: #00f2fe; color: #000; border-color: #00f2fe; font-weight: 900; }

.sec-group { margin-bottom: 30px; }
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sec-title { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.card-carousel { overflow-x: auto; display: flex; gap: 14px; padding-bottom: 8px; scrollbar-width: none; }
.card-carousel::-webkit-scrollbar { display: none; }

.song-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 16px; padding: 12px; width: 164px; flex-shrink: 0; cursor: pointer; transition: all .25s ease; position: relative; }
.song-card:hover { transform: translateY(-5px); border-color: #00f2fe; background: rgba(15, 23, 42, 0.9); box-shadow: 0 12px 28px rgba(0, 242, 254, 0.15); }
.song-card.active { border-color: #00f2fe; background: rgba(0, 242, 254, 0.1); }
.card-thumb-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; background: #111; margin-bottom: 10px; }
.card-thumb { width: 100%; height: 100%; object-fit: cover; }
.card-play-float { position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; background: #00f2fe; color: #000; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; opacity: 0; transform: translateY(8px); transition: all .2s; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
.song-card:hover .card-play-float { opacity: 1; transform: translateY(0); }
.song-card.active .card-play-float { opacity: 1; transform: translateY(0); background: #fff; }
.card-name { font-size: 13.5px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

/* ====== FLOATING BOTTOM PLAYER BAR ====== */
.player-dock { position: fixed; bottom: 0; left: 0; right: 0; height: 84px; background: rgba(10, 15, 29, 0.95); border-top: 1px solid var(--border); backdrop-filter: blur(35px); z-index: 150; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px; }
.dock-left { display: flex; align-items: center; gap: 12px; width: 280px; min-width: 0; }
.dock-cover { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; }
.dock-meta { min-width: 0; flex: 1; }
.dock-title { font-size: 14px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-artist { font-size: 11.5px; color: var(--text-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dock-center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 580px; }
.dock-btns { display: flex; align-items: center; gap: 16px; }
.btn-ctrl { background: none; border: none; color: var(--text-dim); font-size: 17px; cursor: pointer; transition: all .15s; }
.btn-ctrl:hover { color: #fff; transform: scale(1.1); }
.btn-play-dock { width: 40px; height: 40px; border-radius: 50%; background: #00f2fe; color: #000; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 0 16px rgba(0, 242, 254, 0.4); transition: all .2s; }
.btn-play-dock:hover { transform: scale(1.08); background: #fff; }

.dock-progress { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: var(--text-dim); font-weight: 700; }
.seek-track { flex: 1; height: 5px; background: rgba(255,255,255,0.12); border-radius: 6px; cursor: pointer; position: relative; }
.seek-fill { height: 100%; width: 0%; background: #00f2fe; border-radius: 6px; }

.dock-right { display: flex; align-items: center; gap: 10px; width: 280px; justify-content: flex-end; }
.btn-dock-tool { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; font-size: 12px; font-weight: 800; padding: 7px 14px; border-radius: 20px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px; }
.btn-dock-tool:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

/* ====== FULLSCREEN LYRICS VIEW ====== */
.lyrics-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(5, 8, 17, 0.94); backdrop-filter: blur(45px); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .4s cubic-bezier(0.25, 0.8, 0.25, 1); }
.lyrics-overlay.open { transform: translateY(0); }
.lyrics-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.lyrics-close { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lyrics-close:hover { background: #ef4444; }

.lyrics-scroll { flex: 1; overflow-y: auto; padding: 40px 24px 160px; text-align: center; scroll-behavior: smooth; }
.lyric-line { font-size: 24px; font-weight: 800; line-height: 1.8; color: rgba(255,255,255,0.3); margin-bottom: 24px; cursor: pointer; transition: all .3s ease; }
.lyric-line.active { color: #fff; font-size: 28px; text-shadow: 0 0 24px rgba(0, 242, 254, 0.6); transform: scale(1.04); }
.lyric-word { display: inline; transition: all .15s; margin-right: 6px; }
.lyric-word.sung { color: #00f2fe; text-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }
.lyric-word.active-word { color: #fff; text-shadow: 0 0 16px #fff, 0 0 30px #00f2fe; font-size: 30px; }

/* ====== CINEMA POP-UP MODAL ====== */
.cinema-modal { position: fixed; inset: 0; z-index: 220; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.cinema-modal.open { opacity: 1; pointer-events: auto; }
.cinema-box { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
.cinema-close { position: absolute; top: -14px; right: -14px; z-index: 10; background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cinema-close:hover { background: #ef4444; }

@media(max-width: 868px) {
  .sb { display: none; }
  .deck-section { grid-template-columns: 1fr; gap: 20px; text-align: center; }
  .deck-badge { align-self: center; }
  .deck-actions { justify-content: center; }
  .dock-right { display: none; }
  .dock-left { width: auto; flex: 1; }
  .lyrics-line { font-size: 18px; }
  .lyrics-line.active { font-size: 21px; }
}
</style>
</head>

      </div>
      <div class="dock-progress">
        <span id="timeCur">0:00</span>
        <div class="seek-track" id="seekWrap" onclick="seekTrack(event)">
          <div class="seek-fill" id="seekFill"></div>
        </div>
        <span id="timeDur">0:00</span>
      </div>
    </div>

    <div class="dock-right">
      <button class="btn-dock-tool" onclick="openLyrics()">&#127897; Lirik</button>
      <button class="btn-dock-tool" onclick="openCinema()">&#127916; MV Pop</button>
    </div>
  </div>
</div>

<!-- FULLSCREEN LYRICS VIEW -->
<div class="lyrics-overlay" id="lyricsOverlay">
  <div class="lyrics-top">
    <div style="display:flex;align-items:center;gap:12px">
      <img id="lyricsThumb" src="../icon.png" style="width:46px;height:46px;border-radius:10px;object-fit:cover;">
      <div>
        <div id="lyricsTitle" style="font-size:16px;font-weight:900;color:#fff;">RIVER</div>
        <div id="lyricsArtist" style="font-size:12px;color:#00f2fe;font-weight:700;">JKT48</div>
      </div>
    </div>
    <button class="lyrics-close" onclick="closeLyrics()">&#10005;</button>
  </div>
  <div class="lyrics-scroll" id="lyricsScroll">
    <div style="color:rgba(255,255,255,0.4);margin-top:80px;">Memuat lirik lagu...</div>
  </div>
</div>

<!-- CINEMA POP-UP MODAL (16:9 HD DRIVE VIDEO) -->
<div class="cinema-modal" id="cinemaModal" onclick="closeCinemaOnBackdrop(event)">
  <div class="cinema-box">
    <button class="cinema-close" onclick="closeCinema()">&#10005;</button>
    <video id="cinemaVideo" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;display:none;"></video>
    <iframe id="cinemaFrame" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<script>
// ===== STATE & DATA =====
let TRACKS = [];
let ALBUM_MAP = new Map();
let currentTrackIndex = 0;
let favorites = new Set(JSON.parse(localStorage.getItem('alc48_favs') || '[]'));
let activeFilter = 'all', searchQuery = '';
const audio = document.getElementById('masterAudio');

// ===== AUDIO EVENTS =====
audio.addEventListener('play', () => {
  document.getElementById('dockPlayBtn').innerHTML = '&#9646;&#9646;';
  document.getElementById('deckPlayIcon').innerHTML = '&#9646;&#9646;';
  document.getElementById('deckPlayLabel').textContent = 'Jeda Musik';
  document.getElementById('vinylDisc').classList.add('playing');
  document.getElementById('toneArm').classList.add('active');
  document.getElementById('eqBars').classList.add('playing');
});

audio.addEventListener('pause', () => {
  document.getElementById('dockPlayBtn').innerHTML = '&#9654;';
  document.getElementById('deckPlayIcon').innerHTML = '&#9654;';
  document.getElementById('deckPlayLabel').textContent = 'Putar Musik';
  document.getElementById('vinylDisc').classList.remove('playing');
  document.getElementById('toneArm').classList.remove('active');
  document.getElementById('eqBars').classList.remove('playing');
});

audio.addEventListener('ended', nextTrack);

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 1;
  document.getElementById('seekFill').style.width = ((cur / dur) * 100).toFixed(2) + '%';
  document.getElementById('timeCur').textContent = formatTime(cur);
  document.getElementById('timeDur').textContent = formatTime(dur);
  updateLyricsSync(cur);
});

audio.addEventListener('error', () => {
  const t = TRACKS[currentTrackIndex];
  if (t && t.cdn_url && audio.src !== t.cdn_url) {
    audio.src = t.cdn_url;
    audio.play().catch(() => {});
  }
});

// ===== LYRICS SYNC ENGINE =====
let wordTimings = [];
let lastSyncWordIndex = -1;

function updateLyricsSync(t) {
  if (!wordTimings.length) return;
  let wi = -1;
  for (let i = 0; i < wordTimings.length; i++) {
    if (t >= wordTimings[i].t) wi = i; else break;
  }
  if (wi === lastSyncWordIndex) return;
  lastSyncWordIndex = wi;

  const scroll = document.getElementById('lyricsScroll');
  const lines = scroll.querySelectorAll('.lyric-line');
  const curLine = wi >= 0 ? wordTimings[wi].lineIdx : -1;
  const curWordInLine = wi >= 0 ? wordTimings[wi].wordIdx : -1;

  lines.forEach((line, li) => {
    line.classList.remove('active');
    const words = line.querySelectorAll('.lyric-word');
    if (li === curLine) {
      line.classList.add('active');
      words.forEach((w, wIdx) => {
        w.classList.remove('sung', 'active-word');
        if (wIdx < curWordInLine) w.classList.add('sung');
        else if (wIdx === curWordInLine) w.classList.add('active-word');
      });
    } else {
      words.forEach(w => w.classList.remove('active-word'));
      if (li < curLine) words.forEach(w => w.classList.add('sung'));
      else words.forEach(w => w.classList.remove('sung'));
    }
  });

  if (curLine >= 0 && lines[curLine]) {
    const el = lines[curLine];
    const top = el.offsetTop - scroll.offsetTop - (scroll.clientHeight / 2) + 30;
    scroll.scrollTo({ top, behavior: 'smooth' });
  }
}

const MASTER_LYRICS = {
  "RIVER": `Forward, go ahead!
Maju terus pantang mundur!
RIVER!
Menyeberanglah, lewati rintangan yang ada
Jangan menyerah, walau arus begitu deras
Masa depan membentang di hadapanmu!
RIVER!`,
  "Heavy Rotation": `I want you!
I need you!
I love you!
Di dalam benakku selalu berputar
Heavy Rotation!
Perasaan yang takkan pernah pudar
Cintaku kepadamu berputar kencang
Selamanya!`,
  "Fortune Cookie yang Mencinta": `Penampilan yang biasa saja
Janganlah kau merasa putus asa
Keberuntungan ada di dalam hatimu
Senyumlah selalu
Fortune Cookie yang mencinta
Janganlah kau menyerah begitu saja
Masa depan tidaklah seburuk itu
Sambutlah hari esok dengan senyuman!`,
  "Pesawat Kertas 365 Hari": `Hidup bagaikan pesawat kertas
Terus terbang melayang tinggi
Menembus angin dan badai di langit luas
Jangan pernah menyerah mengejar impianmu!`,
  "Rapsodi": `Kelingking kita berjanji
Jari manis jadi saksi
Kau dan aku selamanya
Dalam ikatan cinta suci
Mengalir bagai melodi yang indah
Rapsodi cinta kita!`
};

function generateLyrics(t) {
  let raw = MASTER_LYRICS[t.title] || `[00:04.00] ${t.title} - JKT48
[00:14.00] Melangkah maju meraih impian kita
[00:26.00] Jangan menyerah walau badai menghadang
[00:40.00] Terus bernyanyi bersama penuh semangat
[00:56.00] Masa depan cerah menanti di depan mata
[01:12.00] Bersama JKT48 kita bersinar abadi!`;

  if (!raw.includes('[')) {
    const lines = raw.trim().split('\n').filter(l => l.trim().length > 0);
    let time = 4.0;
    let res = '';
    lines.forEach(l => {
      const m = Math.floor(time / 60);
      const s = Math.floor(time % 60);
      res += `[${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.00] ${l.trim()}\n`;
      time += 6.0;
    });
    raw = res;
  }

  const parsed = [];
  raw.trim().split('\n').forEach(line => {
    const m = line.match(/\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/);
    if (m) {
      const min = parseInt(m[1], 10);
      const sec = parseFloat(m[2]);
      const text = m[3].trim();
      if (text) parsed.push({ t: min * 60 + sec, text });
    }
  });
  return parsed;
}

function loadLyrics(t) {
  const scroll = document.getElementById('lyricsScroll');
  scroll.innerHTML = '';
  wordTimings = [];
  lastSyncWordIndex = -1;

  const lines = generateLyrics(t);
  lines.forEach((lObj, lineIdx) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.onclick = () => { if (audio) audio.currentTime = lObj.t; };

    const words = lObj.text.split(' ');
    const durationPerWord = 5.0 / Math.max(words.length, 1);

    words.forEach((w, wIdx) => {
      const span = document.createElement('span');
      span.className = 'lyric-word';
      span.textContent = w + ' ';
      div.appendChild(span);

      wordTimings.push({
        t: lObj.t + (wIdx * durationPerWord),
        lineIdx,
        wordIdx: wIdx
      });
    });

    scroll.appendChild(div);
  });
}

// ===== PLAY TRACK ENGINE =====
function playTrack(index) {
  if (!TRACKS || !TRACKS.length) return;
  if (index < 0) index = TRACKS.length - 1;
  if (index >= TRACKS.length) index = 0;
  currentTrackIndex = index;
  const t = TRACKS[currentTrackIndex];

  const coverUrl = t.cover || `https://drive.google.com/thumbnail?id=${t.drive_id}&sz=w600-h600`;
  document.getElementById('dynamicBackdrop').style.backgroundImage = `url('${coverUrl}')`;
  document.getElementById('vinylLabel').src = coverUrl;
  document.getElementById('deckTitle').textContent = t.title;
  document.getElementById('deckAlbum').textContent = `JKT48 \u2022 ${t.album} \u2022 ${t.year}`;

  document.getElementById('dockCover').src = coverUrl;
  document.getElementById('dockTitle').textContent = t.title;
  document.getElementById('dockArtist').textContent = `JKT48 \u2022 ${t.year}`;

  document.getElementById('lyricsThumb').src = coverUrl;
  document.getElementById('lyricsTitle').textContent = t.title;
  document.getElementById('lyricsArtist').textContent = t.album;

  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`track_${t._i}`);
  if (card) card.classList.add('active');

  loadLyrics(t);

  // Dedicated High-Speed Stream API URL from config.js
  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('stream') : 'https://shinezzzz-gokgokgok.hf.space';
  audio.src = `${apiBase}/api/drive/stream/${t.drive_id}`;
  audio.play().catch(err => console.log("Autoplay notice:", err));
}

function togglePlayState() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextTrack() { playTrack(currentTrackIndex + 1); }
function prevTrack() { playTrack(currentTrackIndex - 1); }

function seekTrack(e) {
  const rect = document.getElementById('seekWrap').getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pos * audio.duration;
}

function formatTime(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ===== RENDER SECTIONS & CARDS =====
function renderSections() {
  const container = document.getElementById('sectionContainer');
  container.innerHTML = '';

  ALBUM_MAP.forEach(alb => {
    let filteredSongs = alb.songs;
    if (activeFilter === 'liked') {
      filteredSongs = filteredSongs.filter(s => favorites.has(s.id));
    } else if (activeFilter !== 'all') {
      if (alb.type !== activeFilter) filteredSongs = [];
    }

    if (searchQuery) {
      filteredSongs = filteredSongs.filter(s =>
        s.title.toLowerCase().includes(searchQuery) ||
        s.album.toLowerCase().includes(searchQuery) ||
        s.year.includes(searchQuery)
      );
    }

    if (!filteredSongs.length) return;

    const sec = document.createElement('div');
    sec.className = 'sec-group';
    sec.innerHTML = `
      <div class="sec-header">
        <span class="sec-title">${alb.name}</span>
      </div>
      <div class="card-carousel">
        ${filteredSongs.map(s => `
          <div class="song-card ${s._i === currentTrackIndex ? 'active' : ''}" id="track_${s._i}" onclick="playTrack(${s._i})">
            <div class="card-thumb-wrap">
              <img class="card-thumb" src="${s.cover}" onerror="this.src='../icon.png'" alt="${s.title}" loading="lazy">
              <div class="card-play-float">&#9654;</div>
            </div>
            <div class="card-name">${s.title}</div>
            <div class="card-sub">${s.year} &bull; JKT48</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(sec);
  });
}

function filterCategory(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.fpill').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  renderSections();
}

function onSearchInput() {
  searchQuery = document.getElementById('sq').value.trim().toLowerCase();
  renderSections();
}

function switchView(mode) {
  const hero = document.getElementById('heroDeckSection');
  const lib = document.getElementById('librarySection');
  const tabD = document.getElementById('tabDeck');
  const tabL = document.getElementById('tabLibrary');

  if (mode === 'deck') {
    hero.style.display = 'grid';
    tabD.classList.add('on');
    tabL.classList.remove('on');
  } else {
    hero.style.display = 'none';
    tabL.classList.add('on');
    tabD.classList.remove('on');
  }
}

// ===== MODAL VIEWS =====
function openLyrics() { document.getElementById('lyricsOverlay').classList.add('open'); }
function closeLyrics() { document.getElementById('lyricsOverlay').classList.remove('open'); }

function openCinema() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (!audio.paused) audio.pause();

  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('stream') : 'https://shinezzzz-gokgokgok.hf.space';
  const videoEl = document.getElementById('cinemaVideo');
  const frameEl = document.getElementById('cinemaFrame');

  if (t.drive_id) {
    videoEl.src = `${apiBase}/api/drive/stream/${t.drive_id}`;
    videoEl.style.display = 'block';
    frameEl.style.display = 'none';
    frameEl.src = 'about:blank';
    videoEl.play().catch(() => {
      videoEl.style.display = 'none';
      frameEl.style.display = 'block';
      frameEl.src = t.preview_url || `https://drive.google.com/file/d/${t.drive_id}/preview`;
    });
  } else {
    frameEl.src = t.preview_url;
    frameEl.style.display = 'block';
    videoEl.style.display = 'none';
  }
  document.getElementById('cinemaModal').classList.add('open');
}

function closeCinema() {
  const videoEl = document.getElementById('cinemaVideo');
  const frameEl = document.getElementById('cinemaFrame');
  if (videoEl) { videoEl.pause(); videoEl.src = ''; }
  if (frameEl) { frameEl.src = 'about:blank'; }
  document.getElementById('cinemaModal').classList.remove('open');
}

function closeCinemaOnBackdrop(e) {
  if (e.target.id === 'cinemaModal') closeCinema();
}

// ===== INIT =====
async function initApp() {
  try {
    const res = await fetch('./jkt48_songs.json');
    if (res.ok) TRACKS = await res.json();
  } catch(e) {}

  if (TRACKS && TRACKS.length > 0) {
    ALBUM_MAP.clear();
    TRACKS.forEach((t, i) => {
      t._i = i;
      if (!ALBUM_MAP.has(t.album)) {
        ALBUM_MAP.set(t.album, { name: t.album, type: t.type, year: t.year, songs: [] });
      }
      ALBUM_MAP.get(t.album).songs.push(t);
    });

    renderSections();
    playTrack(0);
  }
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
