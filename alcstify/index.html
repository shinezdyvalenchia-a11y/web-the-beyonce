<html lang="id">
<head>
<meta charset="UTF-8">

<title>Alcstify 48 - JKT48 Native Music & Lyrics Player</title>
<link rel="icon" href="../logo.png">
<script src="../config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#030712;color:#fff;display:flex;position:relative}

.vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.22)}
.glows{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.gw{position:absolute;border-radius:50%;opacity:.18}
.ga{width:50vw;height:50vw;top:-15%;left:-15%;background:radial-gradient(circle,#00ff88,transparent 70%)}
.gb{width:40vw;height:40vw;top:-10%;right:-10%;background:radial-gradient(circle,#1db954,transparent 70%)}
.gc{width:45vw;height:45vw;bottom:-15%;left:-10%;background:radial-gradient(circle,#ff007f,transparent 70%)}
.gd{width:40vw;height:40vw;bottom:-10%;right:-10%;background:radial-gradient(circle,#a855f7,transparent 70%);opacity:.12}

/* ====== SIDEBAR ====== */
.sb{width:82px;background:rgba(11,17,33,.94);border-right:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;padding:12px 4px;gap:7px;z-index:100;overflow-y:auto;flex-shrink:0;transition:transform .28s ease}
.sb::-webkit-scrollbar{display:none}
.na{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:700;font-size:9px;background:rgba(255,255,255,.06);width:65px;height:54px;border-radius:13px;border:1px solid rgba(255,255,255,.1);text-align:center;gap:3px;flex-shrink:0;transition:all .15s;letter-spacing:.2px}
.na:hover{background:rgba(255,255,255,.18);transform:scale(1.04)}
.na.on{background:rgba(255,255,255,.92);color:#1a5cff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ni{font-size:16px}
.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;opacity:0;transition:opacity .25s}
.sov.v{display:block;opacity:1}

/* ====== MAIN CONTENT ====== */
.mn{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;z-index:10;min-width:0}
.tb{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(11,17,33,.88);flex-shrink:0;gap:10px}
.mb{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;padding:5px 10px;border-radius:9px;cursor:pointer;flex-shrink:0}
.br{display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.9);padding:5px 14px;border-radius:28px;border:1px solid rgba(0,255,136,.25);min-width:0}
.br img{height:26px;border-radius:50%;flex-shrink:0}
.bt{font-weight:900;font-size:12px;color:#1db954;font-family:'Rajdhani',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc{font-size:11px;color:#00ff88;font-weight:800;flex-shrink:0;white-space:nowrap}

/* ====== SCROLL AREA ====== */
.sa{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 48px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:5px}
.sa::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:5px}

/* ====== SEARCH & FILTER ====== */
.search-wrap{position:sticky;top:0;z-index:40;background:rgba(3,7,18,.94);padding:10px 0 12px;backdrop-filter:blur(14px)}
.search-inner{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sinput{flex:1;min-width:200px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 14px;color:#fff;font-size:12.5px;outline:none;transition:border-color .2s}
.sinput:focus{border-color:#1db954;background:rgba(255,255,255,.1)}
.sinput::placeholder{color:rgba(255,255,255,.4)}
.fpill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:800;padding:7px 12px;border-radius:18px;cursor:pointer;transition:all .18s;white-space:nowrap}
.fpill:hover{background:rgba(255,255,255,.16)}
.fpill.on{background:#1db954;color:#000;border-color:#1db954;box-shadow:0 0 12px rgba(29,185,84,.4)}

/* ====== ALBUM SECTION ====== */
.alb-sec{margin-bottom:24px}
.alb-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.alb-left{display:flex;align-items:center;gap:9px;min-width:0}
.alb-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 10px currentColor}
.alb-name{font-size:14px;font-weight:900;font-family:'Rajdhani',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.alb-meta{font-size:10px;color:rgba(255,255,255,.5);font-weight:700}
.alb-arr{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.alb-arr:hover{background:rgba(29,185,84,.3);border-color:#1db954}

/* ====== CAROUSEL ====== */
.car-wrap{overflow:hidden}
.car-track{display:flex;gap:10px;transition:transform .4s cubic-bezier(.25,.8,.25,1);will-change:transform}
.scard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .22s;flex-shrink:0;width:160px;position:relative}
.scard:hover{transform:translateY(-3px) scale(1.02);border-color:rgba(29,185,84,.5);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.scard.playing{border-color:#1db954;box-shadow:0 0 16px rgba(29,185,84,.5)}
.scard.playing .play-ind{display:flex}
.play-ind{display:none;position:absolute;top:8px;right:8px;background:rgba(29,185,84,.95);color:#000;font-size:10px;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-weight:900}
.scard-thumb-box{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0d1527,#1a263f);overflow:hidden;display:flex;align-items:center;justify-content:center}
.scard-thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.scard:hover .scard-thumb{transform:scale(1.06)}
.scard-album-badge{position:absolute;bottom:4px;left:6px;font-size:8.5px;font-weight:800;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,0.25)}
.scard-info{padding:8px 10px 10px}
.scard-ttl{font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.scard-sub{font-size:9.5px;color:rgba(255,255,255,.45);font-weight:700;margin-top:2px}

/* ====== BOTTOM NATIVE AUDIO PLAYER ====== */
.pbar{flex-shrink:0;background:rgba(8,13,28,.98);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px)}
.seek-wrap{width:100%;height:6px;background:rgba(255,255,255,.1);cursor:pointer;position:relative}
.seek-fill{height:100%;width:0%;background:linear-gradient(90deg,#1db954,#00ffcc);transition:width .1s linear;position:relative}
.seek-handle{position:absolute;right:-6px;top:-4px;width:14px;height:14px;background:#fff;border-radius:50%;box-shadow:0 0 8px rgba(29,185,84,.9);display:none}
.seek-wrap:hover .seek-handle{display:block}
.pinner{display:flex;align-items:center;gap:12px;padding:9px 16px;min-width:0}
.now-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .25s;flex-shrink:0;background:#111}
.now-thumb:hover{transform:scale(1.06)}
.now-info{flex:1;min-width:0}
.now-ttl{font-size:13.5px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rajdhani',sans-serif}
.now-sub{font-size:10px;color:#1db954;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.trow{display:flex;gap:4px;font-size:9.5px;color:rgba(255,255,255,.45);font-weight:700;margin-top:2px}
.lkb{background:none;border:none;font-size:20px;cursor:pointer;color:rgba(255,255,255,.3);transition:all .2s;padding:3px;flex-shrink:0}
.lkb:hover{transform:scale(1.2)}
.lkb.on{color:#ff0055;text-shadow:0 0 12px rgba(255,0,85,.6)}
.ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
.cb:hover{background:rgba(255,255,255,.2);transform:scale(1.08)}
.cpb{width:46px;height:46px;background:linear-gradient(135deg,#1db954,#00d97e);color:#000;font-size:18px;border:none;box-shadow:0 0 18px rgba(29,185,84,.5)}
.cpb:hover{box-shadow:0 0 28px rgba(29,185,84,.9);transform:scale(1.1)}
.mpill{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;overflow:hidden;flex-shrink:0}
.mpb{padding:6px 10px;font-size:9.5px;font-weight:800;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s;white-space:nowrap}
.mpb.on{background:#1db954;color:#000}

/* ====== LYRICS PANEL ====== */
.lyr-panel{position:fixed;inset:0;z-index:200;background:rgba(5,8,20,.98);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.25,.8,.25,1);backdrop-filter:blur(20px)}
.lyr-panel.open{transform:translateY(0)}
.lyr-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.lyr-info{display:flex;align-items:center;gap:12px;min-width:0}
.lyr-cover{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(255,255,255,.15);background:#111}
.lyr-ti{min-width:0}
.lyr-title{font-size:15px;font-weight:900;font-family:'Rajdhani',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr-sub2{font-size:10.5px;color:#1db954;font-weight:700}
.lyr-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lyr-close:hover{background:#ff0055}
.lyr-badge{font-size:9.5px;color:rgba(255,255,255,.4);font-weight:700;padding:4px 18px 6px;flex-shrink:0;text-align:right}
.lyr-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 24px 120px;text-align:center}
.lyr-scroll::-webkit-scrollbar{width:4px}
.lyr-scroll::-webkit-scrollbar-thumb{background:rgba(29,185,84,.4);border-radius:4px}

/* ====== LYRIC LINES & KARAOKE GLOW ====== */
.ll{margin-bottom:20px;line-height:1.6;cursor:pointer;transition:opacity .2s}
.ll:not(.near){opacity:.35}
.ll.near{opacity:.65}
.ll.active-line{opacity:1}
.lw{display:inline;font-size:16.5px;font-weight:700;color:rgba(255,255,255,.4);transition:color .15s,text-shadow .15s,font-weight .15s;margin-right:4px}
.ll.active-line .lw{color:rgba(255,255,255,.7);font-size:17.5px;font-weight:800}
.lw.sung{color:#1db954;font-weight:800;text-shadow:0 0 10px rgba(29,185,84,.55)}
.lw.active-word{
  color:#fff;
  font-weight:900;
  text-shadow:0 0 8px rgba(255,255,255,.9), 0 0 18px rgba(29,185,84,.9), 0 0 35px rgba(29,185,84,.6);
  animation:wglow .25s ease;
}
@keyframes wglow{
  0%{text-shadow:0 0 4px rgba(255,255,255,.3)}
  50%{text-shadow:0 0 14px #fff, 0 0 25px #1db954}
  100%{text-shadow:0 0 8px #fff, 0 0 18px #1db954}
}

/* ====== MV PANEL ====== */
.mv-panel{position:fixed;inset:0;z-index:210;background:#000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.25,.8,.25,1)}
.mv-panel.open{transform:translateY(0)}
.mv-close{position:absolute;top:16px;right:16px;z-index:5;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.mv-close:hover{background:#ff0055}
#mvIframe{width:100%;height:100%;border:none}

@media(max-width:760px){
  .sb{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.5)}
  .sb.open{transform:translateX(0)}
  .mb{display:block}
  .scard{width:138px}
  .bt{display:none}
}
</style>
</head>

// ===== LYRIC TIMINGS =====
let wordTimings = [];
let lastWordIdx = -1;

function syncWords(t) {
  if (!wordTimings.length) return;
  let wi = -1;
  for (let i = 0; i < wordTimings.length; i++) {
    if (t >= wordTimings[i].t) wi = i; else break;
  }
  if (wi === lastWordIdx) return;
  lastWordIdx = wi;

  const scroll = document.getElementById('lyrScroll');
  const lines = scroll.querySelectorAll('.ll');

  const curLine = wi >= 0 ? wordTimings[wi].lineIdx : -1;
  const curWordInLine = wi >= 0 ? wordTimings[wi].wordIdx : -1;

  lines.forEach((line, li) => {
    line.classList.remove('active-line', 'near');
    if (li === curLine) {
      line.classList.add('active-line');
      const words = line.querySelectorAll('.lw');
      words.forEach((w, wIdx) => {
        w.classList.remove('sung', 'active-word');
        if (wIdx < curWordInLine) w.classList.add('sung');
        else if (wIdx === curWordInLine) w.classList.add('active-word');
      });
    } else if (Math.abs(li - curLine) === 1) {
      line.classList.add('near');
      const words = line.querySelectorAll('.lw');
      words.forEach(w => w.classList.remove('active-word'));
      if (li < curLine) words.forEach(w => w.classList.add('sung'));
      else words.forEach(w => w.classList.remove('sung'));
    } else {
      const words = line.querySelectorAll('.lw');
      words.forEach(w => w.classList.remove('active-word'));
      if (li < curLine) words.forEach(w => w.classList.add('sung'));
      else words.forEach(w => w.classList.remove('sung'));
    }
  });

  if (curLine >= 0 && lines[curLine]) {
    const el = lines[curLine];
    const top = el.offsetTop - scroll.offsetTop - (scroll.clientHeight / 2) + 20;
    scroll.scrollTo({ top, behavior: 'smooth' });
  }
}

function generateLyricsForTrack(t) {
  let raw = KNOWN_LYRICS[t.title] || `[00:05.00] ${t.title} - JKT48
[00:15.00] Bernyanyi bersama penuh semangat
[00:25.00] Melangkah maju meraih mimpi kita
[00:38.00] Jangan menyerah walau rintangan menghadang
[00:50.00] Terus berlari menuju masa depan
[01:05.00] Bersama JKT48 kita bersinar!
[01:20.00] Senyum dan tawamu memberi kekuatan
[01:35.00] Mari bernyanyi sekuat tenaga
[01:50.00] Impian kita akan menjadi kenyataan!`;

  if (!raw.includes('[')) {
    const lines = raw.trim().split('\n').filter(l => l.trim().length > 0);
    let time = 5.0;
    let res = '';
    lines.forEach(l => {
      const m = Math.floor(time / 60);
      const s = Math.floor(time % 60);
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      res += `[${mm}:${ss}.00] ${l.trim()}\n`;
      time += 6.5;
    });
    raw = res;
  }

  const parsed = [];
  const lines = raw.trim().split('\n');
  lines.forEach(line => {
    const match = line.match(/\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/);
    if (match) {
      const min = parseInt(match[1], 10);
      const sec = parseFloat(match[2]);
      const text = match[3].trim();
      if (text) parsed.push({ t: min * 60 + sec, text });
    }
  });

  return parsed;
}

function loadLyrics(t) {
  const scroll = document.getElementById('lyrScroll');
  scroll.innerHTML = '';
  wordTimings = [];
  lastWordIdx = -1;

  const lines = generateLyricsForTrack(t);
  if (!lines.length) {
    scroll.innerHTML = '<div style="color:rgba(255,255,255,.4);margin-top:80px;">Lirik sedang disiapkan...</div>';
    return;
  }

  lines.forEach((lObj, lineIdx) => {
    const div = document.createElement('div');
    div.className = 'll';
    div.dataset.t = lObj.t;
    div.onclick = () => seekToTime(lObj.t);

    const words = lObj.text.split(' ');
    const nextLineTime = lines[lineIdx + 1] ? lines[lineIdx + 1].t : lObj.t + 5;
    const lineDur = Math.max(1, nextLineTime - lObj.t);
    const wordDur = lineDur / words.length;

    words.forEach((w, wIdx) => {
      const span = document.createElement('span');
      span.className = 'lw';
      span.textContent = w + ' ';
      div.appendChild(span);

      const wordTime = lObj.t + (wIdx * wordDur);
      wordTimings.push({ t: wordTime, lineIdx, wordIdx: wIdx });
    });

    scroll.appendChild(div);
  });
}

function seekToTime(t) {
  if (audio) {
    audio.currentTime = t;
  }
}

// ===== PLAYBACK ENGINE =====
function playTrack(idx) {
  curIdx = (idx + TRACKS.length) % TRACKS.length;
  const t = TRACKS[curIdx];

  const coverSrc = t.album_art || t.cover || '../skin/FREYA_JAYAWARDANA_MYTH.jpg';
  document.getElementById('nowThumb').src = coverSrc;
  document.getElementById('nowTtl').textContent = t.title;
  document.getElementById('nowSub').textContent = `JKT48 â€¢ ${t.album} â€¢ ${t.year}`;
  
  document.getElementById('lyrCover').src = coverSrc;
  document.getElementById('lyrTitle').textContent = t.title;
  document.getElementById('lyrSub').textContent = `${t.album} (${t.year})`;

  updateLikeBtn();
  loadLyrics(t);

  document.querySelectorAll('.scard').forEach(el => el.classList.remove('playing'));
  const activeEl = document.getElementById(`scard_${curIdx}`);
  if (activeEl) activeEl.classList.add('playing');

  // Direct Audio URL from backend audio streamer
  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('stream') : 'https://ashazeneca-botanalistiktl.hf.space';
  const audioUrl = `${apiBase}/api/music/audio_stream?q=${encodeURIComponent(t.title)}&redirect=true`;

  audio.src = audioUrl;
  audio.play().catch(err => {
    console.log("Audio autoplay note:", err);
  });
}

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextT() { playTrack(curIdx + 1); }
function prevT() { playTrack(curIdx - 1); }

function onSeek(e) {
  const rect = document.getElementById('seekWrap').getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if (audio.duration) {
    audio.currentTime = pos * audio.duration;
  }
}

function fmt(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ===== LIKES & PLAYLIST =====
function updateLikeBtn() {
  const btn = document.getElementById('lkBtn');
  const t = TRACKS[curIdx];
  if (liked.has(t.id)) {
    btn.innerHTML = '&#10084;';
    btn.classList.add('on');
  } else {
    btn.innerHTML = '&#9825;';
    btn.classList.remove('on');
  }
  document.getElementById('lkCnt').textContent = liked.size;
}

function toggleLike() {
  const t = TRACKS[curIdx];
  if (liked.has(t.id)) liked.delete(t.id);
  else liked.add(t.id);
  localStorage.setItem('alc48v2_liked', JSON.stringify([...liked]));
  updateLikeBtn();
  if (filt === 'liked') renderSections();
}

// ===== RENDER ALBUM SECTIONS =====
function renderSections() {
  const container = document.getElementById('albSecs');
  container.innerHTML = '';

  let visibleCount = 0;

  ALB_MAP.forEach(alb => {
    let filteredSongs = alb.songs;

    if (filt === 'liked') {
      filteredSongs = filteredSongs.filter(s => liked.has(s.id));
    } else if (filt !== 'all') {
      if (alb.type !== filt) filteredSongs = [];
    }

    if (q) {
      filteredSongs = filteredSongs.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.album.toLowerCase().includes(q) ||
        s.year.includes(q)
      );
    }

    if (!filteredSongs.length) return;
    visibleCount += filteredSongs.length;

    const sec = document.createElement('div');
    sec.className = 'alb-sec';
    sec.innerHTML = `
      <div class="alb-hdr">
        <div class="alb-left">
          <span class="alb-dot" style="background:${alb.color};color:${alb.color};"></span>
          <span class="alb-name">${alb.name}</span>
        </div>
        <div class="alb-right">
          <span class="alb-meta">${filteredSongs.length} lagu &bull; ${alb.year}</span>
          <button class="alb-arr" onclick="scrollAlbum('${alb.name.replace(/[^a-zA-Z0-9]/g, '_')}', -1)">&lang;</button>
          <button class="alb-arr" onclick="scrollAlbum('${alb.name.replace(/[^a-zA-Z0-9]/g, '_')}', 1)">&rang;</button>
        </div>
      </div>
      <div class="car-wrap" id="car_${alb.name.replace(/[^a-zA-Z0-9]/g, '_')}">
        <div class="car-track">
          ${filteredSongs.map(s => `
            <div class="scard ${s._i === curIdx ? 'playing' : ''}" id="scard_${s._i}" onclick="playTrack(${s._i})">
              <div class="scard-thumb-box">
                <img class="scard-thumb" src="${s.album_art || s.cover}" loading="lazy" alt="${s.title}" onerror="this.src='../skin/FREYA_JAYAWARDANA_MYTH.jpg';">
                <span class="scard-album-badge" style="color:${s.color};">${s.album.split(':')[0]}</span>
              </div>
              <span class="play-ind">&#9654;</span>
              <div class="scard-info">
                <div class="scard-ttl">${s.title}</div>
                <div class="scard-sub">${s.year} &bull; JKT48</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    container.appendChild(sec);
  });

  if (visibleCount === 0) {
    container.innerHTML = '<div style="color:rgba(255,255,255,.4);text-align:center;padding:40px 0;">Tidak ada lagu yang sesuai kriteria.</div>';
  }
}

function scrollAlbum(id, dir) {
  const el = document.getElementById(`car_${id}`);
  if (el) {
    el.scrollBy({ left: dir * 300, behavior: 'smooth' });
  }
}

function setF(f, el) {
  filt = f;
  document.querySelectorAll('.fpill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  renderSections();
}

function doSearch() {
  q = document.getElementById('sq').value.trim().toLowerCase();
  renderSections();
}

// ===== PANELS =====
function openLyr() { document.getElementById('lyrPanel').classList.add('open'); }
function closeLyr() { document.getElementById('lyrPanel').classList.remove('open'); }
function openMv() {
  const t = TRACKS[curIdx];
  const iframe = document.getElementById('mvIframe');
  iframe.src = `https://www.youtube.com/embed/${t.yt_id}?autoplay=1`;
  document.getElementById('mvPanel').classList.add('open');
}
function closeMv() {
  const iframe = document.getElementById('mvIframe');
  iframe.src = 'about:blank';
  document.getElementById('mvPanel').classList.remove('open');
}

function openSb() {
  document.getElementById('sb').classList.add('open');
  document.getElementById('sov').classList.add('v');
}
function closeSb() {
  document.getElementById('sb').classList.remove('open');
  document.getElementById('sov').classList.remove('v');
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
  renderSections();
  updateLikeBtn();
  loadLyrics(TRACKS[0]);
});
</script>
</body>
</html>
