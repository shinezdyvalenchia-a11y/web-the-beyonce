:root {
  --primary: #ffd700;
  --accent: #ff007f;
  --cyan: #00f2fe;
  --bg-dark: #030712;

html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg-dark); color: var(--text-main); display: flex; position: relative; }

/* 8px SUBTLE HARDWARE-ACCELERATED BACKDROP */

  background-position: center;

  z-index: -2;
  opacity: 0.65;
  transform: translateZ(0);

}
.bg-mesh {

  flex-shrink: 0;

}

.na {

.sec-group { margin-bottom: 26px; }
.sec-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 10px; display: block; }

<script>
// ===== STATE & DATA =====
let TRACKS = [];
let ALBUM_MAP = new Map();
let currentTrackIndex = parseInt(localStorage.getItem('alc48_last_track') || '0', 10);
let isShuffle = false;
let isHeroMvActive = false;
let favorites = new Set(JSON.parse(localStorage.getItem('alc48_favs') || '[]'));
let activeFilter = 'all', searchQuery = '';

const media = document.getElementById('coreMedia');

// CACHED DOM ELEMENTS
const domHeroPlayBtn = document.getElementById('heroPlayBtn');
const domLbPlayBtn = document.getElementById('lbPlayBtn');
const domScrubberFill = document.getElementById('scrubberFill');
const domLbScrubFill = document.getElementById('lbScrubFill');
const domTimeCur = document.getElementById('timeCur');
const domTimeDur = document.getElementById('timeDur');
const domLbTimeCur = document.getElementById('lbTimeCur');
const domLbTimeDur = document.getElementById('lbTimeDur');
const domDynamicBg = document.getElementById('dynamicBackdrop');
const domLyricsDynamicBg = document.getElementById('lyricsDynamicBg');
const domHeroCover = document.getElementById('heroCover');
const domTrackCategory = document.getElementById('trackCategory');
const domTrackTitle = document.getElementById('trackTitle');
const domTrackSub = document.getElementById('trackSub');
const domLyricsThumb = document.getElementById('lyricsThumb');
const domLyricsTitle = document.getElementById('lyricsTitle');
const domLyricsArtist = document.getElementById('lyricsArtist');
const domLbThumb = document.getElementById('lbThumb');
const domLbTitle = document.getElementById('lbTitle');
const domLbArtist = document.getElementById('lbArtist');
const domLyricsScroll = document.getElementById('lyricsScroll');
const domMiniLyricsScroll = document.getElementById('miniLyricsScroll');

let lastRenderedSecond = -1;
let domLyricLines = [];
let domMiniLyricLines = [];

function toggleFullscreenMv() {
  if (!isHeroMvActive) {
    toggleHeroMv();
  }
  if (media.requestFullscreen) {
    media.requestFullscreen();
  } else if (media.webkitRequestFullscreen) {
    media.webkitRequestFullscreen();
  } else {
    openCinema();
  }
}

function toggleHeroMv(e) {
  if (e) e.stopPropagation();
  isHeroMvActive = !isHeroMvActive;
  const videoEl = document.getElementById('coreMedia');
  const coverEl = document.getElementById('heroCover');
  const btn = document.getElementById('btnHeroMv');
  const icon = document.getElementById('heroMvIcon');
  const text = document.getElementById('heroMvText');
  if (isHeroMvActive) {
    videoEl.style.display = 'block';
    coverEl.style.display = 'none';
    btn.classList.add('active');
    icon.textContent = '🖼️';
    text.textContent = 'Cover Art';
  } else {
    videoEl.style.display = 'none';
    coverEl.style.display = 'block';
    btn.classList.remove('active');
    icon.textContent = '🎬';
    text.textContent = 'Video MV';
  }
}

media.addEventListener('play', () => {
  domHeroPlayBtn.innerHTML = '&#9646;&#9646;';
  domLbPlayBtn.innerHTML = '&#9646;&#9646;';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});

media.addEventListener('pause', () => {
  domHeroPlayBtn.innerHTML = '&#9654;';
  domLbPlayBtn.innerHTML = '&#9654;';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});

media.addEventListener('ended', nextTrack);

media.addEventListener('timeupdate', () => {
  const cur = media.currentTime || 0;
  const dur = media.duration || 1;
  const percent = ((cur / dur) * 100).toFixed(1) + '%';
  
  domScrubberFill.style.width = percent;
  domLbScrubFill.style.width = percent;
  
  const curSec = Math.floor(cur);
  if (curSec !== lastRenderedSecond) {
    lastRenderedSecond = curSec;
    const curStr = formatTime(cur);
    const durStr = formatTime(dur);
    domTimeCur.textContent = curStr;
    domTimeDur.textContent = durStr;
    domLbTimeCur.textContent = curStr;
    domLbTimeDur.textContent = durStr;
  }
  
  updateLineLyricsSync(cur);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    localStorage.setItem('alc48_last_track', currentTrackIndex);
    localStorage.setItem('alc48_last_time', media.currentTime || 0);
  }
});

let parsedLyricsLines = [];
let activeLineIndex = -1;

function updateLineLyricsSync(t) {
  if (!parsedLyricsLines.length) return;
  const adjTime = t - getSongOffset(TRACKS[currentTrackIndex]);
  let lineIdx = -1;
  for (let i = 0; i < parsedLyricsLines.length; i++) {
    if (adjTime >= parsedLyricsLines[i].t) lineIdx = i; else break;
  }
  if (lineIdx === activeLineIndex) return;
  
  // Fullscreen modal line
  if (activeLineIndex >= 0 && activeLineIndex < domLyricLines.length) {
    domLyricLines[activeLineIndex].classList.remove('active');
  }
  if (lineIdx >= 0 && lineIdx < domLyricLines.length) {
    const el = domLyricLines[lineIdx];
    el.classList.add('active');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Right Lyric Box line
  if (activeLineIndex >= 0 && activeLineIndex < domMiniLyricLines.length) {
    domMiniLyricLines[activeLineIndex].classList.remove('active');
  }
  if (lineIdx >= 0 && lineIdx < domMiniLyricLines.length) {
    const miniEl = domMiniLyricLines[lineIdx];
    miniEl.classList.add('active');
    miniEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  
  activeLineIndex = lineIdx;
}

const LYRICS_CACHE = new Map();

async function fetchLyrics(title, artist = "JKT48") {
  const cleanTitle = title.replace(/^\d+[\s._-]*/, '').replace(/\(.*\)/g, '').replace(/[-_]/g, ' ').trim();
  const cacheKey = cleanTitle.toLowerCase();
  if (LYRICS_CACHE.has(cacheKey)) return LYRICS_CACHE.get(cacheKey);

  // 1. Direct fetch from LRCLIB exact get
  try {
    const res = await fetch(`https://lrclib.net/api/get?artist_name=JKT48&track_name=${encodeURIComponent(cleanTitle)}`);
    if (res.ok) {
      const d = await res.json();
      if (d && d.syncedLyrics && d.syncedLyrics.trim().length > 10) {
        LYRICS_CACHE.set(cacheKey, d.syncedLyrics);
        return d.syncedLyrics;
      }
      if (d && d.plainLyrics && d.plainLyrics.trim().length > 10) {
        const genLrc = convertPlainToLrc(d.plainLyrics);
        LYRICS_CACHE.set(cacheKey, genLrc);
        return genLrc;
      }
    }
  } catch(e) {}

  // 2. Direct search in LRCLIB database
  try {
    const sRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle + ' JKT48')}`);
    if (sRes.ok) {
      const list = await sRes.json();
      if (Array.isArray(list) && list.length > 0) {
        const item = list.find(x => x.syncedLyrics) || list[0];
        if (item && item.syncedLyrics && item.syncedLyrics.trim().length > 10) {
          LYRICS_CACHE.set(cacheKey, item.syncedLyrics);
          return item.syncedLyrics;
        }
        if (item && item.plainLyrics && item.plainLyrics.trim().length > 10) {
          const genLrc = convertPlainToLrc(item.plainLyrics);
          LYRICS_CACHE.set(cacheKey, genLrc);
          return genLrc;
        }
      }
    }
  } catch(e) {}

  // 3. Fallback to API Backend Space Proxy
  try {
    const apiBase = typeof getApiUrl === 'function' ? getApiUrl('music') : 'https://shinezzzz-gokgokgok.hf.space';
    const bRes = await fetch(`${apiBase}/api/lyrics?title=${encodeURIComponent(cleanTitle)}&artist=${encodeURIComponent(artist)}`);
    if (bRes.ok) {
      const bData = await bRes.json();
      if (bData && bData.syncedLyrics && bData.syncedLyrics.trim().length > 10) {
        LYRICS_CACHE.set(cacheKey, bData.syncedLyrics);
        return bData.syncedLyrics;
      }
    }
  } catch(e) {}

  // 4. Default Dynamic Fallback
  return generateFallbackLrc(title);
}

function convertPlainToLrc(plain) {
  const lines = plain.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return "";
  let currentTime = 10.0;
  return lines.map((l) => {
    const min = String(Math.floor(currentTime / 60)).padStart(2, '0');
    const sec = String(Math.floor(currentTime % 60)).padStart(2, '0');
    currentTime += 4.5;
    return `[${min}:${sec}.00] ${l}`;
  }).join('\n');
}

function generateFallbackLrc(title) {
  return `[00:04.00] ♫ ${title} — JKT48 ♫
[00:15.00] Bersama mimpi yang bersinar terang
[00:25.00] Langkah kaki menuju masa depan
[00:38.00] Raih harapan bersama JKT48
[00:52.00] Suara hatimu takkan pernah padam
[01:05.00] Bernyanyi bersama dalam harmoni
[01:20.00] ♫ (Melodi Musik) ♫
[01:45.00] Terus melangkah pantang menyerah
[02:05.00] Menyinari panggung impian kita!`;
}

function parseLrc(raw) {
  const parsed = [];
  raw.trim().split('\n').forEach(line => {
    const m = line.match(/\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/);
    if (m) {
      const min = parseInt(m[1], 10);
      const sec = parseFloat(m[2]);
      const text = m[3].trim();
      if (text) parsed.push({ t: min * 60 + sec, text });
    }
  });
  return parsed;
}

let LYRIC_OFFSETS = JSON.parse(localStorage.getItem('alc48_lyric_offsets') || '{}');

function getSongOffset(t) {
  if (!t) return 0;
  const k = t.title.toLowerCase();
  return (k in LYRIC_OFFSETS) ? parseFloat(LYRIC_OFFSETS[k]) : (parseFloat(t.lyrics_offset || 0) || 0);
}

function adjustOffset(delta) {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  const k = t.title.toLowerCase();
  const nextVal = parseFloat((getSongOffset(t) + delta).toFixed(2));
  LYRIC_OFFSETS[k] = nextVal;
  localStorage.setItem('alc48_lyric_offsets', JSON.stringify(LYRIC_OFFSETS));
  updateOffsetUI(nextVal);
}

function resetOffset() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  delete LYRIC_OFFSETS[t.title.toLowerCase()];
  localStorage.setItem('alc48_lyric_offsets', JSON.stringify(LYRIC_OFFSETS));
  updateOffsetUI(parseFloat(t.lyrics_offset || 0) || 0);
}

function updateOffsetUI(val) {
  const el = document.getElementById('offsetLabel');
  if (el) el.textContent = `Offset: ${(val > 0 ? '+' : '')}${val.toFixed(1)}s`;
}

async function loadLyrics(t) {
  domLyricsScroll.innerHTML = '<div style="color:rgba(255,255,255,0.4);margin-top:80px;">Menyelaraskan lirik lagu...</div>';
  domMiniLyricsScroll.innerHTML = '<div class="mini-lyric-item active">Menyelaraskan lirik...</div>';
  parsedLyricsLines = [];
  domLyricLines = [];
  domMiniLyricLines = [];
  activeLineIndex = -1;
  
  const currentOffset = getSongOffset(t);
  updateOffsetUI(currentOffset);
  
  let raw = await fetchLyrics(t.title);
  if (!raw || raw.trim().length < 5) raw = generateFallbackLrc(t.title);
  parsedLyricsLines = parseLrc(raw);
  domLyricsScroll.innerHTML = '';
  domMiniLyricsScroll.innerHTML = '';
  
  const fragFull = document.createDocumentFragment();
  const fragMini = document.createDocumentFragment();

  parsedLyricsLines.forEach((lObj) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.textContent = lObj.text;
    div.onclick = () => { media.currentTime = Math.max(0, lObj.t + getSongOffset(t)); };
    fragFull.appendChild(div);
    domLyricLines.push(div);

    const miniDiv = document.createElement('div');
    miniDiv.className = 'mini-lyric-item';
    miniDiv.textContent = lObj.text;
    miniDiv.onclick = () => { media.currentTime = Math.max(0, lObj.t + getSongOffset(t)); };
    fragMini.appendChild(miniDiv);
    domMiniLyricLines.push(miniDiv);
  });

  domLyricsScroll.appendChild(fragFull);
  domMiniLyricsScroll.appendChild(fragMini);
}

function playTrack(index, autoPlay = true) {
  if (!TRACKS || !TRACKS.length) return;
  if (index < 0) index = TRACKS.length - 1;
  if (index >= TRACKS.length) index = 0;
  currentTrackIndex = index;
  const t = TRACKS[currentTrackIndex];
  localStorage.setItem('alc48_last_track', currentTrackIndex);
  
  const themeColor = t.color || '#ffd700';
  document.documentElement.style.setProperty('--song-theme', themeColor);
  const coverUrl = t.cover || `https://drive.google.com/thumbnail?id=${t.drive_id}&sz=w600-h600`;
  
  domDynamicBg.style.backgroundImage = `url('${coverUrl}')`;
  domLyricsDynamicBg.style.backgroundImage = `url('${coverUrl}')`;
  domHeroCover.src = coverUrl;
  
  domTrackCategory.textContent = t.album;
  domTrackTitle.textContent = t.title;
  domTrackSub.textContent = `JKT48 • ${t.album} • ${t.year}`;
  
  domLyricsThumb.src = coverUrl;
  domLyricsTitle.textContent = t.title;
  domLyricsArtist.textContent = t.album;
  domLbThumb.src = coverUrl;
  domLbTitle.textContent = t.title;
  domLbArtist.textContent = t.album;

  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`track_${t._i}`);
  if (card) card.classList.add('active');

  updateFavoriteButton();
  loadLyrics(t);
  
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: 'JKT48', album: t.album, artwork: [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }] });
    navigator.mediaSession.setActionHandler('play', () => media.play());
    navigator.mediaSession.setActionHandler('pause', () => media.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
  }

  const apiBase = typeof getApiUrl === 'function' ? getApiUrl('music') : 'https://shinezzzz-gokgokgok.hf.space';
  const proxyStreamUrl = `${apiBase}/api/drive/stream/${t.drive_id}`;
  if (media.src !== proxyStreamUrl) {
    media.src = proxyStreamUrl;
  }
  if (autoPlay) {
    media.play().catch(err => {
      media.src = `https://drive.usercontent.google.com/download?id=${t.drive_id}&export=download&authuser=0`;
      media.play().catch(() => {});
    });
  }
}

function togglePlayState() {
  if (!media.src || media.src === "" || media.src.endsWith("/")) {
    playTrack(currentTrackIndex, true);
    return;
  }
  if (media.paused) media.play().catch(() => {});
  else media.pause();
}

function nextTrack() {
  if (isShuffle) playTrack(Math.floor(Math.random() * TRACKS.length), true);
  else playTrack(currentTrackIndex + 1, true);
}

function prevTrack() {
  playTrack(currentTrackIndex - 1, true);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
}

function seekTrack(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (media.duration) {
    media.currentTime = pos * media.duration;
  }
}

function formatTime(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function updateFavoriteButton() {
  const btn = document.getElementById('heroLikeBtn');
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (favorites.has(t.id)) {
    btn.innerHTML = '&#10084;';
    btn.classList.add('liked');
  } else {
    btn.innerHTML = '&#9825;';
    btn.classList.remove('liked');
  }
  document.getElementById('favCount').textContent = favorites.size;
}

function toggleFavorite() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  if (favorites.has(t.id)) favorites.delete(t.id);
  else favorites.add(t.id);
  localStorage.setItem('alc48_favs', JSON.stringify([...favorites]));
  updateFavoriteButton();
  if (activeFilter === 'liked') renderSections();
}

function renderSections() {
  const container = document.getElementById('sectionContainer');
  container.innerHTML = '';
  ALBUM_MAP.forEach(alb => {
    let filteredSongs = alb.songs;
    if (activeFilter === 'liked') filteredSongs = filteredSongs.filter(s => favorites.has(s.id));
    else if (activeFilter !== 'all') {
      if (alb.type !== activeFilter) filteredSongs = [];
    }
    if (searchQuery) {
      filteredSongs = filteredSongs.filter(s =>
        s.title.toLowerCase().includes(searchQuery) ||
        s.album.toLowerCase().includes(searchQuery) ||
        s.year.includes(searchQuery)
      );
    }
    if (!filteredSongs.length) return;
    const sec = document.createElement('div');
    sec.className = 'sec-group';
    sec.innerHTML = `<span class="sec-title">${alb.name}</span><div class="card-carousel">${filteredSongs.map(s => `<div class="song-card ${s._i === currentTrackIndex ? 'active' : ''}" id="track_${s._i}" onclick="playTrack(${s._i}, true)"><div class="card-thumb-wrap"><img class="card-thumb" src="${s.cover}" onerror="this.src='../icon.png'" alt="${s.title}" loading="lazy"></div><div class="card-name">${s.title}</div><div class="card-sub">${s.year} • JKT48</div></div>`).join('')}</div>`;
    container.appendChild(sec);
  });
}

function filterCategory(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.fpill').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  renderSections();
}

function onSearchInput() { searchQuery = document.getElementById('sq').value.trim().toLowerCase(); renderSections(); }
function openLyrics() { document.getElementById('lyricsOverlay').classList.add('open'); }
function closeLyrics() { document.getElementById('lyricsOverlay').classList.remove('open'); }

function openCinema() {
  const t = TRACKS[currentTrackIndex];
  if (!t) return;
  document.getElementById('cinemaFrame').src = `https://drive.google.com/file/d/${t.drive_id}/preview`;
  document.getElementById('cinemaModal').classList.add('open');
}

function closeCinema() { document.getElementById('cinemaFrame').src = 'about:blank'; document.getElementById('cinemaModal').classList.remove('open'); }
function closeCinemaOnBackdrop(e) { if (e.target.id === 'cinemaModal') closeCinema(); }

async function initApp() {
  try {
    const res = await fetch('./jkt48_songs.json');
    if (res.ok) TRACKS = await res.json();
  } catch(e) {}
  if (TRACKS && TRACKS.length > 0) {
    ALBUM_MAP.clear();
    TRACKS.forEach((t, i) => {
      t._i = i;
      if (!ALBUM_MAP.has(t.album)) ALBUM_MAP.set(t.album, { name: t.album, type: t.type, year: t.year, songs: [] });
      ALBUM_MAP.get(t.album).songs.push(t);
    });
    renderSections();
    const savedIdx = parseInt(localStorage.getItem('alc48_last_track') || '0', 10);
    const validIdx = (savedIdx >= 0 && savedIdx < TRACKS.length) ? savedIdx : 0;
    playTrack(validIdx, false);
    const savedTime = parseFloat(localStorage.getItem('alc48_last_time') || '0');
    if (savedTime > 0) { setTimeout(() => { try { media.currentTime = savedTime; } catch(e) {} }, 300); }
  }
}
window.addEventListener('DOMContentLoaded', initApp);
</script>
