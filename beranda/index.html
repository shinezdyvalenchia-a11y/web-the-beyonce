<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitty Tenacity - Translucent AI Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #2c3e50;
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================
           1. BACKGROUND VIDEO & CAHAYA TIPIS
           ========================================== */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .corner-glows {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .glow { position: absolute; width: 50vw; height: 50vw; max-width: 500px; max-height: 500px; border-radius: 50%; filter: blur(140px); opacity: 0.15; }
        .glow-tl { top: -10%; left: -10%; background: #ff007f; }
        .glow-tr { top: -10%; right: -10%; background: #ff7700; }
        .glow-bl { bottom: -10%; left: -10%; background: #0088ff; }
        .glow-br { bottom: -10%; right: -10%; background: #ffffff; opacity: 0.1; }

        /* ==========================================
           2. SIDEBAR KIRI
           ========================================== */
        .left-sidebar {
            width: 90px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 5px; gap: 12px; z-index: 25;
            overflow-y: auto; flex-shrink: 0;
        }
        .left-sidebar::-webkit-scrollbar { display: none; }

        .side-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 10px;
            background: rgba(255, 255, 255, 0.2); width: 70px; height: 60px; border-radius: 16px;
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.3); text-align: center;
            gap: 4px;
        }
        .side-item:hover { background: rgba(255, 255, 255, 0.4); transform: scale(1.05); }
        .side-item.active { background: rgba(255, 255, 255, 0.85); color: #1a5cff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .side-icon { font-size: 20px; }

        /* ==========================================
           3. MAIN CONTAINER, TOP AREA & INVENTORY
           ========================================== */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            position: relative; height: 100%; overflow: hidden; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 15px 25px; z-index: 20; width: 100%;
        }

        .top-center-container {
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .top-center-logo {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 6px 20px; border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo-main { height: 45px; width: auto; border-radius: 50%; object-fit: contain; }
        .logo-sub { height: 30px; width: auto; border-radius: 50%; object-fit: contain; }
        .brand-text { font-weight: 800; font-size: 18px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        /* INVENTORY UI */
        .inventory-bar {
            display: flex; gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 4px 15px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .inv-item { display: flex; align-items: center; gap: 4px; color: #fff; font-size: 11px; font-weight: 800; }
        .inv-item img { width: 16px; height: 16px; object-fit: contain; }

        .top-right-area {
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-left: auto;
        }
        .profile-card {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 6px 14px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-decoration: none; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .profile-card:hover { background: rgba(255, 255, 255, 0.5); }
        .profile-info { display: flex; flex-direction: column; text-align: right; }
        .profile-name { font-weight: 800; font-size: 13px; color: #fff; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .profile-username { font-weight: 700; font-size: 10px; color: rgba(255,255,255,0.8); }
        
        /* AVATAR DENGAN BORDER SKIN (Foto crop bulat dulu, border menimpa) */
        .avatar-container { position: relative; width: 38px; height: 38px; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .profile-border { position: absolute; top: -4px; left: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; object-fit: contain; z-index: 2;}

        .sub-nav-links {
            display: flex; gap: 6px;
        }
        .sub-nav-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 10px; border-radius: 15px;
            color: #fff; font-size: 11px; font-weight: 700;
            text-decoration: none; transition: 0.2s;
        }
        .sub-nav-btn:hover { background: rgba(255, 255, 255, 0.5); }

        /* ==========================================
           4. CHAT CONTAINER & SKIN BUBBLE
           ========================================== */
        .chat-container {
            flex-grow: 1; overflow-y: auto; 
            padding: 100px 20px 140px 20px;
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message { display: flex; flex-direction: column; max-width: 75%; animation: slideUp 0.3s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.ai { align-self: flex-start; align-items: flex-start; }

        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message.user .msg-header { flex-direction: row-reverse; }
        
        .msg-avatar-wrapper { position: relative; width: 26px; height: 26px; flex-shrink: 0;}
        .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .msg-border { position: absolute; top: -3px; left: -3px; width: calc(100% + 6px); height: calc(100% + 6px); pointer-events: none; z-index: 2; object-fit: contain;}

        .msg-name-time { display: flex; flex-direction: column; }
        .message.user .msg-name-time { align-items: flex-end; }
        .msg-name { font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .msg-time { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.7); }

        .msg-bubble {
            padding: 12px 18px; font-size: 14px; line-height: 1.5; word-break: break-word;
            background: rgba(255, 255, 255, 0.85);
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            color: #2c3e50; font-weight: 700; position: relative;
        }
        .user .msg-bubble { border-radius: 20px 20px 4px 20px; border-right: 4px solid #ff7700; }
        .ai .msg-bubble { border-radius: 20px 20px 20px 4px; border-left: 4px solid #1a5cff; }

        /* ==========================================
           5. INPUT DOCK & MODE SELECTION
           ========================================== */
        .input-dock-wrapper {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            max-width: 800px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 8px; z-index: 30;
        }

        .model-popup-selector {
            display: none; background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 8px 15px; border-radius: 20px; gap: 10px; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: fadeIn 0.2s ease;
        }
        .model-popup-selector.active { display: flex; }
        .model-label { font-size: 12px; font-weight: 800; color: #1a5cff; }
        .model-select {
            background: rgba(255, 255, 255, 0.8); border: none;
            padding: 6px 12px; border-radius: 12px; font-weight: 700;
            color: #333; outline: none; cursor: pointer; font-size: 12px;
            flex-grow: 1;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-dock {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 35px; padding: 6px 6px 6px 20px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .chat-input {
            flex-grow: 1; background: transparent; border: none;
            font-size: 14.5px; font-weight: 700; color: #2c3e50;
            outline: none; padding: 10px 0; min-width: 0;
        }
        .chat-input::placeholder { color: #666; font-weight: 400; }

        .mode-toggle-btn {
            background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 9px 14px; border-radius: 20px; font-weight: 800;
            color: #1a5cff; outline: none; cursor: pointer; font-size: 12px;
            white-space: nowrap; transition: 0.2s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .mode-toggle-btn.tanya-active { background: #1a5cff; color: #fff; }

        .send-btn {
            background: linear-gradient(135deg, #ff7700, #ff007f);
            border: none; color: white; width: 44px; height: 44px;
            border-radius: 50%; flex-shrink: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 4px 10px rgba(255, 119, 0, 0.4);
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }

        @media screen and (max-width: 768px) {
            .left-sidebar { width: 75px; padding: 10px 4px; }
            .side-item { width: 65px; height: 55px; font-size: 9px; }
            .side-icon { font-size: 17px; }
            .top-bar { padding: 10px 15px; }
            .top-center-container { gap: 4px; }
            .top-center-logo { padding: 4px 12px; gap: 8px; }
            .logo-main { height: 35px; }
            .logo-sub { height: 24px; }
            .brand-text { font-size: 14px; }
            .inventory-bar { padding: 3px 10px; gap: 6px; }
            .inv-item { font-size: 9px; }
            .profile-card { padding: 4px 10px; }
            .profile-name { font-size: 11px; }
            .profile-username { font-size: 9px; }
            .avatar-container { width: 30px; height: 30px; }
            .sub-nav-btn { font-size: 10px; padding: 3px 8px; }
            .input-dock-wrapper { left: 10px; right: 10px; bottom: 10px; }
            .input-dock { padding: 5px 5px 5px 15px; }
            .mode-toggle-btn { padding: 8px 10px; font-size: 11px; }
            .send-btn { width: 38px; height: 38px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Video -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="latarglobal.webm" type="video/webm">
    </video>

    <!-- Cahaya Tipis -->
    <div class="corner-glows">
        <div class="glow glow-tl"></div><div class="glow glow-tr"></div>
        <div class="glow glow-bl"></div><div class="glow glow-br"></div>
    </div>

    <!-- SIDEBAR KIRI -->
    <aside class="left-sidebar">
        <a href="#" class="side-item active"><span class="side-icon">💬</span>Beranda</a>
        <a href="../gacha-skin/" class="side-item"><span class="side-icon">🎁</span>Gacha</a>
        <a href="../live-jkt48/" class="side-item"><span class="side-icon">🎤</span>Live JKT</a>
        <a href="../game/" class="side-item"><span class="side-icon">🎮</span>Game</a>
        <a href="../grup/" class="side-item"><span class="side-icon">👥</span>Grup</a>
        <a href="../temen-mabar/" class="side-item"><span class="side-icon">⚔️</span>Mabar</a>
        <a href="../medsos-saver/" class="side-item"><span class="side-icon">📥</span>Saver</a>
        <a href="../koleksi-kartu/" class="side-item"><span class="side-icon">🃏</span>Kartu</a>
        <a href="../bio-member/" class="side-item"><span class="side-icon">📖</span>Bio</a>
        <a href="../link-shortcut/" class="side-item"><span class="side-icon">🔗</span>Shortcut</a>
    </aside>

    <!-- CONTAINER UTAMA -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-center-container">
                <div class="top-center-logo">
                    <img src="../logo.png.png" alt="Beyonce" class="logo-main" onerror="this.src='logo.png.png'">
                    <img src="../kitty.png.png" alt="Kitty" class="logo-sub" onerror="this.src='kitty.png.png'">
                    <span class="brand-text">Kitty Tenacity</span>
                </div>
                <!-- INVENTORY -->
                <div class="inventory-bar" id="inventoryBar">
                    <div class="inv-item"><img src="KRISTAL.PNG" alt="K"> <span id="valKristal">0</span></div>
                    <div class="inv-item"><img src="TBCOIN.PNG" alt="C"> <span id="valTbCoin">0</span></div>
                    <div class="inv-item"><img src="ONCETOKEN.PNG" alt="T"> <span id="valOnceToken">0</span></div>
                    <div class="inv-item"><img src="KRISTAL_OMEGA.PNG" alt="O"> <span id="valKristalOmega">0</span></div>
                </div>
            </div>

            <!-- Kanan Atas -->
            <div class="top-right-area">
                <a href="../profil/" class="profile-card">
                    <div class="profile-info">
                        <span class="profile-name" id="profileName">Loading...</span>
                        <span class="profile-username" id="profileUsername">@loading</span>
                    </div>
                    <div class="avatar-container">
                        <img src="../kitty.png.png" alt="Avatar" class="profile-pic" id="userAvatar">
                        <img src="" alt="" class="profile-border" id="profileBorder" style="display: none;">
                    </div>
                </a>
                <div class="sub-nav-links">
                    <a href="../teman/" class="sub-nav-btn">👥 Teman</a>
                    <a href="../cari-pengguna/" class="sub-nav-btn">🔍 Cari User</a>
                </div>
            </div>
        </header>

        <!-- Area Chat -->
        <div class="chat-container" id="chatContainer"></div>

        <!-- Input Area Dock -->
        <div class="input-dock-wrapper">
            <div class="model-popup-selector" id="modelPopup">
                <span class="model-label">🧠 Pilih Model:</span>
                <select id="modelSelect" class="model-select">
                    <option value="auto" selected>Auto (Random)</option>
                    <option value="claude">Claude</option>
                    <option value="gemini">Gemini</option>
                    <option value="gpt">GPT</option>
                    <option value="ultrakitty">UltraKitty Pro</option>
                </select>
            </div>

            <div class="input-dock">
                <input type="text" id="userInput" class="chat-input" placeholder="Ketik pesan..." autocomplete="off">
                <button type="button" class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleMode()">Chat</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://shinezzzz-gokgokgogkgokgok.hf.space"; 
        let activeMode = "chat"; 
        
        // MENYIMPAN DATA USER UTAMA DARI HASIL /statuschat
        let currentUserData = {
            userId: "",
            username: "User",
            skinKode: "", 
            linkProfil: "../kitty.png.png",
            kristal: 0,
            tbCoin: 0,
            onceToken: 0,
            kristalOmega: 0
        };
        
        let lastMessageId = ""; 

        document.addEventListener("DOMContentLoaded", async () => {
            if (window.location.protocol !== 'file:') {
                if (!getCookie("user_session")) window.location.href = "../"; 
            }
            
            // Urutan Penting: Load status dulu agar 'id' tersimpan, baru load history & poll
            await loadStatusChat();
            await loadHistoryChat();
            setInterval(pollNewChats, 3000);
        });

        // 1. FUNGSI LOAD STATUS (Minta Data via season_key, simpan id & skin ke frontend)
        async function loadStatusChat() {
            try {
                const sessionKey = getCookie("user_session") || "";
                const response = await fetch(`${BACKEND_URL}/statuschat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ season_key: sessionKey })
                });
                const data = await response.json();
                
                if (data.status === "success" || data.profile || data.id) {
                    const p = data.profile || data;
                    
                    // SIMPAN DATA UTAMA UNTUK PATOKAN FRONTEND
                    currentUserData.userId = String(p.id || p.userId || p.telegram_id || "");
                    currentUserData.username = p.username || "User";
                    currentUserData.skinKode = p.skin || p.skinKode || p.skinWeb || p.inventory || ""; 
                    currentUserData.linkProfil = p.linkProfil || p.link_profil || "../kitty.png.png";
                    
                    // SIMPAN & UPDATE INVENTORY
                    currentUserData.kristal = p.kristal || 0;
                    currentUserData.tbCoin = p.tbCoin || 0;
                    currentUserData.onceToken = p.onceToken || 0;
                    currentUserData.kristalOmega = p.kristalOmega || 0;

                    document.getElementById("valKristal").innerText = currentUserData.kristal;
                    document.getElementById("valTbCoin").innerText = currentUserData.tbCoin;
                    document.getElementById("valOnceToken").innerText = currentUserData.onceToken;
                    document.getElementById("valKristalOmega").innerText = currentUserData.kristalOmega;
                    
                    // UPDATE PROFILE HEADER UI
                    document.getElementById("profileName").innerText = currentUserData.username;
                    document.getElementById("profileUsername").innerText = "@" + currentUserData.username;
                    document.getElementById("userAvatar").src = currentUserData.linkProfil;
                    
                    // UPDATE BORDER AVATAR PROFILE
                    if(currentUserData.skinKode) {
                        const borderEl = document.getElementById("profileBorder");
                        const skinUrl = currentUserData.skinKode.includes('/') || currentUserData.skinKode.endsWith('.png') 
                            ? currentUserData.skinKode 
                            : currentUserData.skinKode + ".png";
                        borderEl.src = skinUrl; 
                        borderEl.style.display = "block";
                    }
                }
            } catch (error) {
                console.error("Gagal load status chat:", error);
            }
        }

        // 2. FUNGSI LOAD HISTORY CHAT (Server Kirim 30 Chat Terakhir)
        async function loadHistoryChat() {
            try {
                const response = await fetch(`${BACKEND_URL}/historychat`, { method: 'GET' });
                const data = await response.json();
                
                if(data.history && Array.isArray(data.history)) {
                    document.getElementById("chatContainer").innerHTML = ""; 
                    data.history.forEach(msg => {
                        // Cek apakah ID pengirim sama dengan ID user yang disimpan dari /status
                        const senderId = String(msg.id || msg.senderId || "");
                        const isSelf = senderId === currentUserData.userId && currentUserData.userId !== "";
                        renderChatHTML(msg, isSelf);
                        lastMessageId = msg.msgId || msg.id || lastMessageId;
                    });
                }
            } catch (error) {
                console.error("Gagal load history:", error);
            }
        }

        // 3. FUNGSI POLL NEW CHATS
        async function pollNewChats() {
            if(activeMode === "tanya") return; 
            try {
                const response = await fetch(`${BACKEND_URL}/getnewchats?lastId=${lastMessageId}`, { method: 'GET' });
                const data = await response.json();
                if(data.newChats && data.newChats.length > 0) {
                    data.newChats.forEach(msg => {
                        const senderId = String(msg.id || msg.senderId || "");
                        const isSelf = senderId === currentUserData.userId && currentUserData.userId !== "";
                        renderChatHTML(msg, isSelf);
                        lastMessageId = msg.msgId || msg.id || lastMessageId;
                    });
                }
            } catch (error) { /* Silent fail */ }
        }

        // 4. FUNGSI RENDER CHAT DENGAN MEKANISME SKIN & BORDER
        function renderChatHTML(msgData, isSelf) {
            const chatContainer = document.getElementById("chatContainer");
            const sideClass = isSelf ? "user" : "ai";
            const displayName = isSelf ? "Kamu" : (msgData.username || "User");
            
            const waktuDisplay = msgData.jam || msgData.waktu || getCurrentTime();
            const timeHTML = `<span class="msg-time">${waktuDisplay}</span>`;
            
            // PERSIAPAN MEKANISME SKIN CHAT (Base Skin Ditimpa Teks)
            const skinCode = msgData.skin || "";
            let bgStyle = "";
            if (skinCode) {
                const skinUrl = skinCode.includes('/') || skinCode.endsWith('.png') ? skinCode : `${skinCode}.png`;
                bgStyle = `background-image: url('${skinUrl}'); color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);`;
            }

            // PERSIAPAN MEKANISME BORDER AVATAR (Foto Crop Bulat Dulu, Ditempeli Border)
            let borderHTML = "";
            if (skinCode) {
                const borderUrl = skinCode.includes('/') || skinCode.endsWith('.png') ? skinCode : `${skinCode}.png`;
                borderHTML = `<img src="${borderUrl}" class="msg-border" onerror="this.style.display='none'">`;
            }

            const avatarUrl = msgData.linkProfil || msgData.link_profil || '../kitty.png.png';
            
            const html = `
                <div class="message ${sideClass}">
                    <div class="msg-header">
                        <div class="msg-avatar-wrapper">
                            <img src="${avatarUrl}" class="msg-avatar" onerror="this.src='../kitty.png.png'">
                            ${borderHTML}
                        </div>
                        <div class="msg-name-time">
                            <span class="msg-name">${displayName}</span>${timeHTML}
                        </div>
                    </div>
                    <div class="msg-bubble" style="${bgStyle}">${msgData.chat || msgData.message || ''}</div>
                </div>`;
            
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getCurrentTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
        }

        function toggleMode() {
            const btn = document.getElementById("modeToggleBtn");
            const popup = document.getElementById("modelPopup");
            
            if (activeMode === "chat") {
                activeMode = "tanya";
                btn.innerText = "Tanya AI";
                btn.classList.add("tanya-active");
                popup.classList.add("active");
            } else {
                activeMode = "chat";
                btn.innerText = "Chat";
                btn.classList.remove("tanya-active");
                popup.classList.remove("active");
            }
        }

        function getCookie(name) {
            let nameEQ = name + "="; let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            } return null;
        }

        // 5. FUNGSI KIRIM PESAN GLOBAL / AI
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;
            
            const chatContainer = document.getElementById("chatContainer");
            inputField.value = ""; 

            if (activeMode === "chat") {
                const waktuKirim = getCurrentTime();
                
                // MEKANISME PESAN GLOBAL KE TELEGRAM GROUPS / BACKEND
                const payloadGlobal = {
                    id: currentUserData.userId,
                    chat: messageText,
                    skin: currentUserData.skinKode, 
                    jam: waktuKirim,
                    waktu: waktuKirim,
                    linkProfil: currentUserData.linkProfil,
                    username: currentUserData.username
                };

                // Render lokal di kanan (USER)
                renderChatHTML(payloadGlobal, true);
                
                try {
                    await fetch(`${BACKEND_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadGlobal)
                    });
                } catch(e) {
                    console.error("Gagal mengirim chat global", e);
                }

            } else {
                // MEKANISME CHAT AI (/mode,id,isi chat)
                let selectedModel = document.getElementById("modelSelect").value;
                if (selectedModel === "auto") {
                    const autoChoices = ["claude", "gemini", "gpt"];
                    selectedModel = autoChoices[Math.floor(Math.random() * autoChoices.length)];
                }
                let displayNameModel = selectedModel === 'ultrakitty' ? "UltraKitty Pro" : (selectedModel.charAt(0).toUpperCase() + selectedModel.slice(1));

                // Render chat user sendiri
                const userPayload = { chat: messageText, jam: getCurrentTime(), linkProfil: currentUserData.linkProfil, skin: currentUserData.skinKode };
                renderChatHTML(userPayload, true);

                // Render Bubble AI (Loading)
                const uniqueMsgId = "ai-msg-" + Date.now();
                const aiLoadingHtml = `
                    <div class="message ai" id="${uniqueMsgId}">
                        <div class="msg-header">
                            <div class="msg-avatar-wrapper"><img src="../kitty.png.png" class="msg-avatar"></div>
                            <div class="msg-name-time">
                                <span class="msg-name">${displayNameModel}</span>
                                <span class="msg-time">${getCurrentTime()}</span>
                            </div>
                        </div>
                        <div class="msg-bubble"><em>Memproses...</em></div>
                    </div>`;
                chatContainer.insertAdjacentHTML('beforeend', aiLoadingHtml);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // FORMATTING PESAN WAJIB UNTUK AI: /mode,id,isi chat
                const formattedPayload = `/${selectedModel},${currentUserData.userId},${messageText}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                try {
                    const response = await fetch(`${BACKEND_URL}/chat`, { 
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: formattedPayload, mode: selectedModel, id: currentUserData.userId, chat: messageText }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId); 
                    
                    const data = await response.json();
                    let rawReply = data.reply || data.message || `${currentUserData.userId}, Gagal memproses respon.`;
                    let finalAnswer = rawReply;

                    // Mengupas ID balasan dari format backend jika ada
                    if (rawReply.includes(",")) {
                        const firstCommaIndex = rawReply.indexOf(',');
                        const responseId = rawReply.substring(0, firstCommaIndex).trim();
                        const responseText = rawReply.substring(firstCommaIndex + 1).trim();
                        if (responseId === currentUserData.userId) { finalAnswer = responseText; }
                    }

                    document.getElementById(uniqueMsgId).querySelector('.msg-bubble').innerHTML = finalAnswer.replace(/\n/g, "<br>");
                } catch (error) {
                    const el = document.getElementById(uniqueMsgId).querySelector('.msg-bubble');
                    if (error.name === 'AbortError') { el.innerText = "Waktu habis. Server sibuk."; } 
                    else { el.innerText = "Koneksi terputus ke server utama."; }
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
