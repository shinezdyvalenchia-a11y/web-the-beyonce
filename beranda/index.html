<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitty Tenacity - Translucent AI Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #2c3e50;
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================
           1. BACKGROUND & CAHAYA
           ========================================== */
        .video-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }

        .corner-glows {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .glow { position: absolute; width: 50vw; height: 50vw; max-width: 500px; max-height: 500px; border-radius: 50%; filter: blur(140px); opacity: 0.15; }
        .glow-tl { top: -10%; left: -10%; background: #ff007f; }
        .glow-tr { top: -10%; right: -10%; background: #ff7700; }
        .glow-bl { bottom: -10%; left: -10%; background: #0088ff; }
        .glow-br { bottom: -10%; right: -10%; background: #ffffff; opacity: 0.1; }

        /* ==========================================
           2. SIDEBAR KIRI (TASKBAR)
           ========================================== */
        .left-sidebar {
            width: 90px;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 5px; gap: 12px; z-index: 100;
            overflow-y: auto; flex-shrink: 0;
            transition: transform 0.3s ease, left 0.3s ease;
        }
        .left-sidebar::-webkit-scrollbar { display: none; }

        .side-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 10px;
            background: rgba(255, 255, 255, 0.15); width: 70px; height: 60px; border-radius: 16px;
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.25); text-align: center;
            gap: 4px; flex-shrink: 0;
        }
        .side-item:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.03); }
        .side-item.active { background: rgba(255, 255, 255, 0.85); color: #1a5cff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .side-icon { font-size: 20px; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 90; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ==========================================
           3. MAIN CONTAINER & TOP BAR 
           ========================================== */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            position: relative; height: 100%; overflow: hidden; z-index: 10;
        }

        .top-bar {
            display: flex; flex-direction: column; gap: 15px;
            padding: 15px 25px; z-index: 20; width: 100%;
        }

        .top-bar-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }

        .left-group { display: flex; align-items: center; gap: 15px; }
        
        .sidebar-toggle-btn {
            display: none; background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff; font-size: 18px; padding: 6px 12px;
            border-radius: 12px; cursor: pointer; flex-shrink: 0;
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 6px 18px; border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .logo-main { height: 35px; width: auto; border-radius: 50%; object-fit: contain; }
        .logo-sub { height: 25px; width: auto; border-radius: 50%; object-fit: contain; }
        .brand-text { font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); white-space: nowrap; }

        /* KOTAK PROFIL DIPANJANGKAN (TAPI UKURAN NORMAL) */
        .profile-card {
            display: flex; align-items: center; gap: 18px; /* Jarak dijauhkan biar teks gak nabrak border */
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 5px 20px 5px 25px; /* Padding kiri-kanan ditambah biar memanjang */
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-decoration: none; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s; flex-shrink: 0;
        }
        .profile-card:hover { background: rgba(255, 255, 255, 0.4); }
        .profile-info { display: flex; flex-direction: column; text-align: right; }
        
        /* Font kembali ke ukuran awal biar gak kegedean */
        .profile-name { font-weight: 800; font-size: 14px; color: #fff; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.4); } 
        .profile-username { font-weight: 700; font-size: 11px; color: rgba(255,255,255,0.85); } 
        
        /* Foto Profil Atas dikembalikan ke ukuran semula */
        .avatar-container {
            position: relative;
            width: 40px; height: 40px; 
            min-width: 40px; min-height: 40px;
            flex-shrink: 0;
        }
        .profile-pic {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.8);
        }
        
        /* BORDER ATAS DIKECILKAN agar gak menutupi UI/Kotak Profil */
        .profile-border {
            position: absolute;
            top: 54%; left: 50%; transform: translate(-50%, -50%);
            width: 120%; height: 138%; /* Turun dari 155% ke 138% */
            pointer-events: none; object-fit: contain; z-index: 2;
            mix-blend-mode: multiply;
            filter: contrast(1.15) brightness(1.05);
        }

        .sub-row { margin-top: -5px; flex-wrap: wrap; gap: 10px; }

        .inventory-bar {
            display: flex; gap: 12px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 6px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .inv-item { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 12px; font-weight: 800; }
        .inv-item img { width: 18px; height: 18px; object-fit: contain; }

        .sub-nav-links { display: flex; gap: 8px; flex-shrink: 0; }
        .sub-nav-btn {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px; border-radius: 15px;
            color: #fff; font-size: 11px; font-weight: 800;
            text-decoration: none; transition: 0.2s; white-space: nowrap;
        }
        .sub-nav-btn:hover { background: rgba(255, 255, 255, 0.45); }

        /* ==========================================
           4. CHAT CONTAINER & BUBBLE
           ========================================== */
        .chat-container {
            flex-grow: 1; overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 120px; scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message { display: flex; flex-direction: column; max-width: 80%; animation: slideUp 0.3s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.ai { align-self: flex-start; align-items: flex-start; }

        .msg-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .message.user .msg-header { flex-direction: row-reverse; }
        
        /* FOTO PROFIL CHAT TETAP DIBESARKAN (Sesuai Permintaan) */
        .msg-avatar-wrapper {
            position: relative;
            width: 42px; height: 42px; 
            min-width: 42px; min-height: 42px;
            flex-shrink: 0; 
        }
        .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        /* BORDER CHAT TETAP 155% KARENA UDAH MANTAP */
        .msg-border {
            position: absolute; top: 51%; left: 49%; transform: translate(-50%, -50%);
            width: 135%; height: 120%; pointer-events: none; z-index: 2; object-fit: contain;
            mix-blend-mode: multiply;
            filter: contrast(1.15) brightness(1.05);
        }

        .msg-name-time { display: flex; flex-direction: column; }
        .message.user .msg-name-time { align-items: flex-end; }
        .msg-name { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .msg-time { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.75); }

        .msg-bubble {
            padding: 12px 18px; font-size: 14px; line-height: 1.5; word-break: break-word;
            background: rgba(255, 255, 255, 0.85);
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            color: #2c3e50; font-weight: 700; position: relative;
        }
        .user .msg-bubble { border-radius: 20px 20px 4px 20px; border-right: 4px solid #ff7700; }
        .ai .msg-bubble { border-radius: 20px 20px 20px 4px; border-left: 4px solid #1a5cff; }

        /* ==========================================
           5. INPUT DOCK
           ========================================== */
        .input-dock-wrapper {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            max-width: 800px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 8px; z-index: 30;
        }

        .model-popup-selector {
            display: none; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            padding: 8px 15px; border-radius: 20px; gap: 10px; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: fadeIn 0.2s ease;
        }
        .model-popup-selector.active { display: flex; }
        .model-label { font-size: 12px; font-weight: 800; color: #1a5cff; white-space: nowrap; }
        .model-select {
            background: rgba(255, 255, 255, 0.85); border: none;
            padding: 6px 12px; border-radius: 12px; font-weight: 700;
            color: #333; outline: none; cursor: pointer; font-size: 12px; flex-grow: 1;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-dock {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 35px; padding: 5px 5px 5px 18px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .chat-input {
            flex-grow: 1; background: transparent; border: none;
            font-size: 14px; font-weight: 700; color: #2c3e50;
            outline: none; padding: 8px 0; min-width: 0;
        }
        .chat-input::placeholder { color: #555; font-weight: 600; }

        .mode-toggle-btn {
            background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(255, 255, 255, 0.85);
            padding: 8px 12px; border-radius: 20px; font-weight: 800;
            color: #1a5cff; outline: none; cursor: pointer; font-size: 11px;
            white-space: nowrap; transition: 0.2s;
        }
        .mode-toggle-btn.tanya-active { background: #1a5cff; color: #fff; }

        .send-btn {
            background: linear-gradient(135deg, #ff7700, #ff007f);
            border: none; color: white; width: 40px; height: 40px;
            border-radius: 50%; flex-shrink: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; box-shadow: 0 4px 10px rgba(255, 119, 0, 0.4);
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }

        /* ==========================================
           6. RESPONSIVE / HP CUSTOMIZATION
           ========================================== */
        @media screen and (max-width: 768px) {
            .left-sidebar {
                position: fixed; top: 0; left: 0; height: 100%;
                width: 180px; padding: 25px 10px; gap: 10px;
                transform: translateX(-100%);
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
                align-items: stretch;
            }
            .left-sidebar.open { transform: translateX(0); }
            .side-item { width: 100%; height: 44px; flex-direction: row; justify-content: flex-start; padding: 0 15px; font-size: 12px; border-radius: 12px; }
            .sidebar-toggle-btn { display: block; }

            .top-bar { padding: 10px 12px; gap: 10px; }
            
            .brand-logo { padding: 4px 10px; gap: 6px; border-radius: 20px; }
            .logo-main { height: 26px; } .logo-sub { height: 18px; } .brand-text { font-size: 12px; }

            .profile-card { padding: 6px 15px; gap: 15px; } 
            .profile-name { font-size: 13px; } 
            .profile-username { font-size: 10px; } 
            .avatar-container { width: 38px; height: 38px; min-width: 38px; min-height: 38px; } 

            .inventory-bar { padding: 4px 10px; gap: 8px; overflow-x: auto; max-width: 100%; }
            .inventory-bar::-webkit-scrollbar { display: none; }
            .inv-item { font-size: 10px; } .inv-item img { width: 14px; height: 14px; }
            .sub-nav-btn { font-size: 9px; padding: 4px 8px; }
            
            .chat-container { padding: 10px 10px 120px 10px; }
            .message { max-width: 90%; }
            .input-dock-wrapper { left: 10px; right: 10px; bottom: 10px; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="latarglobal.webm" type="video/webm">
    </video>

    <div class="corner-glows">
        <div class="glow glow-tl"></div><div class="glow glow-tr"></div>
        <div class="glow glow-bl"></div><div class="glow glow-br"></div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="left-sidebar" id="leftSidebar">
        <a href="#" class="side-item active"><span class="side-icon">💬</span>Beranda</a>
        <a href="../gacha-skin/" class="side-item"><span class="side-icon">🎁</span>Gacha</a>
        <a href="../live-jkt48/" class="side-item"><span class="side-icon">🎤</span>Live JKT</a>
        <a href="../game/" class="side-item"><span class="side-icon">🎮</span>Game</a>
        <a href="../grup/" class="side-item"><span class="side-icon">👥</span>Grup</a>
        <a href="../temen-mabar/" class="side-item"><span class="side-icon">⚔️</span>Mabar</a>
        <a href="../medsos-saver/" class="side-item"><span class="side-icon">📥</span>Saver</a>
        <a href="../koleksi-kartu/" class="side-item"><span class="side-icon">🃏</span>Kartu</a>
        <a href="../bio-member/" class="side-item"><span class="side-icon">📖</span>Bio</a>
        <a href="../link-shortcut/" class="side-item"><span class="side-icon">🔗</span>Shortcut</a>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-row">
                <div class="left-group">
                    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
                    <div class="brand-logo">
                        <img src="../logo.png.png" alt="Beyonce" class="logo-main" onerror="this.onerror=null; this.src='../logo.png';">
                        <img src="../kitty.png.png" alt="Kitty" class="logo-sub" onerror="this.onerror=null; this.src='../kitty.png';">
                        <span class="brand-text">Kitty Tenacity</span>
                    </div>
                </div>

                <div class="right-group">
                    <a href="../profil/" class="profile-card">
                        <div class="profile-info">
                            <span class="profile-name" id="profileName">Loading...</span>
                            <span class="profile-username" id="profileUsername">@loading</span>
                        </div>
                        <div class="avatar-container">
                            <img src="../kitty.png.png" alt="Avatar" class="profile-pic" id="userAvatar" onerror="this.onerror=null; this.src='../kitty.png';">
                            <img src="" alt="Border" class="profile-border" id="profileBorder" style="display: none;">
                        </div>
                    </a>
                </div>
            </div>

            <div class="top-bar-row sub-row">
                <div class="inventory-bar" id="inventoryBar">
                    <div class="inv-item"><img src="KRISTAL.PNG" alt="K"> <span id="valKristal">0</span></div>
                    <div class="inv-item"><img src="TBCOIN.PNG" alt="C"> <span id="valTbCoin">0</span></div>
                    <div class="inv-item"><img src="ONCETOKEN.PNG" alt="T"> <span id="valOnceToken">0</span></div>
                    <div class="inv-item"><img src="KRISTAL_OMEGA.PNG" alt="O"> <span id="valKristalOmega">0</span></div>
                </div>

                <div class="sub-nav-links">
                    <a href="../teman/" class="sub-nav-btn">👥 Teman</a>
                    <a href="../cari-pengguna/" class="sub-nav-btn">🔍 Cari User</a>
                </div>
            </div>
        </header>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-dock-wrapper">
            <div class="model-popup-selector" id="modelPopup">
                <span class="model-label">🧠 Pilih Model:</span>
                <select id="modelSelect" class="model-select">
                    <option value="auto" selected>Auto (Random)</option>
                    <option value="claude">Claude</option>
                    <option value="gemini">Gemini</option>
                    <option value="gpt">GPT</option>
                    <option value="ultrakitty">UltraKitty Pro</option>
                </select>
            </div>

            <div class="input-dock">
                <input type="text" id="userInput" class="chat-input" placeholder="Ketik pesan..." autocomplete="off">
                <button type="button" class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleMode()">Chat</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://shinezzzz-gokgokgogkgokgok.hf.space";
        const SKIN_FOLDER_URL = "../skin/"; 
        
        let activeMode = "chat"; 
        let currentUserData = {
            userId: getUserId(),
            username: "User",
            skinBorderCode: "", 
            skinChatCode: "",
            linkProfil: "../kitty.png.png"
        };
        let lastMessageId = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            if (window.location.protocol !== 'file:') {
                if (!getCookie("user_session")) window.location.href = "../"; 
            }
            loadStatusChat();
            loadHistoryChat();
            setInterval(pollNewChats, 3000);
        });

        function toggleSidebar() {
            document.getElementById("leftSidebar").classList.toggle("open");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }

        async function loadStatusChat() {
            try {
                const sessionKey = getCookie("user_session") || currentUserData.userId;
                
                const response = await fetch(`${BACKEND_URL}/statuschat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_cookie: sessionKey, sessionCookie: sessionKey })
                });

                const data = await response.json();
                const profileObj = data.data || data.profile;

                if ((data.status === "success" || response.ok) && profileObj) {
                    const p = profileObj;
                    
                    document.getElementById("valKristal").innerText = p.kristal || 0;
                    document.getElementById("valTbCoin").innerText = p.tbCoin || 0;
                    document.getElementById("valOnceToken").innerText = p.onceToken || 0;
                    document.getElementById("valKristalOmega").innerText = p.kristalOmega || 0;
                    
                    let namaUser = p.nama || p.name || p.username || "User";
                    if (namaUser.toLowerCase() === "belum terdaftar" || namaUser.trim() === "") {
                        namaUser = p.username || "User";
                    }
                    currentUserData.username = namaUser;

                    currentUserData.linkProfil = p.photoProfile || p.linkProfil || "../kitty.png";
                    
                    let rawSkinCode = "";
                    if (p.skin) {
                        rawSkinCode = typeof p.skin === 'string' ? p.skin : (p.skin.border || p.skin.border_skin || "");
                    } else if (p.skins) {
                        rawSkinCode = p.skins.border_skin || p.skins.chat_skin || "";
                    } else if (typeof p.inventory === "string") {
                        rawSkinCode = p.inventory;
                    }

                    if (rawSkinCode) {
                        let baseCode = rawSkinCode.replace(/BORDER_/i, "").replace(/CHAT_/i, "").replace(/\.jpg$/i, '').replace(/\.jpeg$/i, '').replace(/\.png$/i, '');
                        currentUserData.skinBorderCode = "BORDER_" + baseCode;
                        currentUserData.skinChatCode = "CHAT_" + baseCode;
                    }

                    document.getElementById("profileName").innerText = currentUserData.username;
                    document.getElementById("profileUsername").innerText = "@" + (p.username || "user");
                    document.getElementById("userAvatar").src = currentUserData.linkProfil;
                    
                    if(currentUserData.skinBorderCode) {
                        const borderEl = document.getElementById("profileBorder");
                        borderEl.src = SKIN_FOLDER_URL + currentUserData.skinBorderCode + ".png"; 
                        borderEl.onerror = function() {
                            if (!this.src.endsWith('.jpg')) {
                                this.src = SKIN_FOLDER_URL + currentUserData.skinBorderCode + ".jpg";
                            }
                        };
                        borderEl.style.display = "block";
                    }
                }
            } catch (error) {
                console.error("Gagal load status chat:", error);
            }
        }

        async function loadHistoryChat() {
            try {
                const response = await fetch(`${BACKEND_URL}/historychat`, { method: 'GET' });
                const data = await response.json();
                
                if(data.history && Array.isArray(data.history)) {
                    document.getElementById("chatContainer").innerHTML = ""; 
                    data.history.forEach(msg => {
                        renderChatHTML(msg, msg.senderId === currentUserData.userId);
                        lastMessageId = msg.id || lastMessageId;
                    });
                }
            } catch (error) { console.error("Gagal load history:", error); }
        }

        async function pollNewChats() {
            if(activeMode === "tanya") return; 
            try {
                const response = await fetch(`${BACKEND_URL}/getnewchats?lastId=${lastMessageId}`, { method: 'GET' });
                const data = await response.json();
                if(data.newChats && data.newChats.length > 0) {
                    data.newChats.forEach(msg => {
                        renderChatHTML(msg, msg.senderId === currentUserData.userId);
                        lastMessageId = msg.id;
                    });
                }
            } catch (error) {}
        }

        function renderChatHTML(msgData, isSelf) {
            const chatContainer = document.getElementById("chatContainer");
            const sideClass = isSelf ? "user" : "ai";
            
            let displayName = isSelf ? "Kamu" : (msgData.username || "System");
            if (displayName.toLowerCase() === "belum terdaftar") {
                displayName = "User"; 
            }
            
            const timeHTML = `<span class="msg-time">${msgData.waktu || getCurrentTime()}</span>`;
            
            let bgStyle = "";
            let borderHTML = "";
            let rawSkin = msgData.skinChatCode || msgData.skinBorderCode || msgData.skin || "";

            if (rawSkin) {
                let baseCode = rawSkin.replace(/BORDER_/i, "").replace(/CHAT_/i, "").replace(/\.jpg$/i, '').replace(/\.jpeg$/i, '').replace(/\.png$/i, '');
                let chatSkinUrl = SKIN_FOLDER_URL + "CHAT_" + baseCode + ".png"; 
                
                // MENGGUNAKAN SETTINGAN TERBAIK (ANTI-GEPENG) 
               bgStyle = `
    border-style: solid !important;
    border-width: 45px 50px 45px 80px !important; 
    border-image-source: url('${chatSkinUrl}') !important;
    border-image-slice: 70 90 60 130 fill !important; 
    border-image-repeat: stretch !important;
    background: transparent !important; 
    box-shadow: none !important; 
    color: #4a3b32 !important; 
    border-radius: 0 !important;
`;
    
    /* Ruang kosong kiri-kanan pakai padding 50px */
    padding: 10px 50px !important; 
    
    /* Min-width 300px memaksa bubble tetap panjang/lebar */
    min-width: 300px !important; 
    
    min-height: 80px !important; 
    display: flex !important;
    align-items: center !important; 
`;
                
                let borderFallbackPath = SKIN_FOLDER_URL + "BORDER_" + baseCode + ".png";
                let borderFullPath = SKIN_FOLDER_URL + "BORDER_" + baseCode + ".jpg";
                borderHTML = `<img src="${borderFallbackPath}" class="msg-border" onerror="this.src='${borderFullPath}'; this.onerror=null;">`;
            }
            
            const ppSrc = msgData.linkProfil || currentUserData.linkProfil || '../kitty.png';

            const html = `
                <div class="message ${sideClass}">
                    <div class="msg-header">
                        <div class="msg-avatar-wrapper">
                            <img src="${ppSrc}" class="msg-avatar" onerror="this.onerror=null; this.src='../kitty.png';">
                            ${borderHTML}
                        </div>
                        <div class="msg-name-time">
                            <span class="msg-name">${displayName}</span>${timeHTML}
                        </div>
                    </div>
                    <div class="msg-bubble" style="${bgStyle}">${msgData.chat}</div>
                </div>`;
            
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getCurrentTime() {
            const d = new Date(); return d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
        }

        function toggleMode() {
            const btn = document.getElementById("modeToggleBtn");
            const popup = document.getElementById("modelPopup");
            if (activeMode === "chat") {
                activeMode = "tanya"; btn.innerText = "Tanya AI";
                btn.classList.add("tanya-active"); popup.classList.add("active");
            } else {
                activeMode = "chat"; btn.innerText = "Chat";
                btn.classList.remove("tanya-active"); popup.classList.remove("active");
            }
        }

        function getCookie(name) {
            let nameEQ = name + "="; let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            } return null;
        }

        function getUserId() {
            const session = getCookie("user_session");
            return session ? session.substring(0, 10) : Math.floor(1000000000 + Math.random() * 9000000000).toString();
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;
            
            const chatContainer = document.getElementById("chatContainer");
            inputField.value = ""; 

            if (activeMode === "chat") {
                const payloadGlobal = {
                    id: currentUserData.userId,
                    chat: messageText,
                    skin: currentUserData.skinBorderCode, 
                    waktu: getCurrentTime(),
                    linkProfil: currentUserData.linkProfil,
                    username: currentUserData.username
                };
                renderChatHTML(payloadGlobal, true);
                
                try {
                    await fetch(`${BACKEND_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadGlobal)
                    });
                } catch(e) { console.error("Gagal mengirim chat global", e); }
            } else {
                let selectedModel = document.getElementById("modelSelect").value;
                if (selectedModel === "auto") {
                    const autoChoices = ["claude", "gemini", "gpt"];
                    selectedModel = autoChoices[Math.floor(Math.random() * autoChoices.length)];
                }
                let displayNameModel = selectedModel === 'ultrakitty' ? "UltraKitty Pro" : (selectedModel.charAt(0).toUpperCase() + selectedModel.slice(1));
                
                const userPayload = { 
                    chat: messageText, 
                    waktu: getCurrentTime(), 
                    linkProfil: currentUserData.linkProfil, 
                    skin: currentUserData.skinBorderCode 
                };
                renderChatHTML(userPayload, true);

                const uniqueMsgId = "ai-msg-" + Date.now();
                const aiLoadingHtml = `
                    <div class="message ai" id="${uniqueMsgId}">
                        <div class="msg-header">
                            <div class="msg-avatar-wrapper"><img src="../kitty.png" class="msg-avatar" onerror="this.onerror=null; this.src='../kitty.png';"></div>
                            <div class="msg-name-time">
                                <span class="msg-name">${displayNameModel}</span>
                                <span class="msg-time">${getCurrentTime()}</span>
                            </div>
                        </div>
                        <div class="msg-bubble"><em>Memproses...</em></div>
                    </div>`;
                chatContainer.insertAdjacentHTML('beforeend', aiLoadingHtml);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                const formattedPayload = `/${selectedModel} ${currentUserData.userId},${messageText}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                try {
                    const response = await fetch(`${BACKEND_URL}/chat`, { 
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: formattedPayload }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId); 
                    
                    const data = await response.json();
                    let rawReply = data.reply || data.message || `${currentUserData.userId}, Gagal memproses respon.`;
                    let finalAnswer = rawReply;

                    if (rawReply.includes(",")) {
                        const firstCommaIndex = rawReply.indexOf(',');
                        const responseId = rawReply.substring(0, firstCommaIndex).trim();
                        const responseText = rawReply.substring(firstCommaIndex + 1).trim();
                        if (responseId === currentUserData.userId) { finalAnswer = responseText; }
                    }
                    document.getElementById(uniqueMsgId).querySelector('.msg-bubble').innerHTML = finalAnswer.replace(/\n/g, "<br>");
                } catch (error) {
                    const el = document.getElementById(uniqueMsgId).querySelector('.msg-bubble');
                    if (error.name === 'AbortError') { el.innerText = "Waktu habis. Server sibuk."; } 
                    else { el.innerText = "Koneksi terputus ke server utama."; }
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
