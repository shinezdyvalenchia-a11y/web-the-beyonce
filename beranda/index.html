<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kitty Tenacity - Global Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #2c3e50;
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================
           1. BACKGROUND & CAHAYA
           ========================================== */
        .video-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }

        .corner-glows {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .glow { position: absolute; width: 50vw; height: 50vw; max-width: 500px; max-height: 500px; border-radius: 50%; filter: blur(140px); opacity: 0.15; }
        .glow-tl { top: -10%; left: -10%; background: #ff007f; }
        .glow-tr { top: -10%; right: -10%; background: #ff7700; }
        .glow-bl { bottom: -10%; left: -10%; background: #0088ff; }
        .glow-br { bottom: -10%; right: -10%; background: #ffffff; opacity: 0.1; }

        /* ==========================================
           2. SIDEBAR KIRI (TASKBAR)
           ========================================== */
        .left-sidebar {
            width: 90px;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 5px; gap: 12px; z-index: 100;
            overflow-y: auto; flex-shrink: 0;
            transition: transform 0.3s ease, left 0.3s ease;
        }
        .left-sidebar::-webkit-scrollbar { display: none; }

        .side-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 10px;
            background: rgba(255, 255, 255, 0.15); width: 70px; height: 60px; border-radius: 16px;
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.25); text-align: center;
            gap: 4px; flex-shrink: 0;
        }
        .side-item:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.03); }
        .side-item.active { background: rgba(255, 255, 255, 0.85); color: #1a5cff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .side-icon { font-size: 20px; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 90; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ==========================================
           3. MAIN CONTAINER & TOP BAR 
           ========================================== */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            position: relative; height: 100%; overflow: hidden; z-index: 10;
        }

        .top-bar {
            display: flex; flex-direction: column; gap: 12px;
            padding: 15px 25px; z-index: 20; width: 100%;
        }

        .top-bar-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px;
        }

        .left-group { display: flex; align-items: center; gap: 12px; min-width: 0; flex-shrink: 1; }
        .right-group { display: flex; align-items: center; min-width: 0; flex-shrink: 0; }
        
        .sidebar-toggle-btn {
            display: none; background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff; font-size: 18px; padding: 6px 12px;
            border-radius: 12px; cursor: pointer; flex-shrink: 0;
        }

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 6px 16px; border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .logo-main { height: 35px; width: auto; border-radius: 50%; object-fit: contain; }
        .logo-sub { height: 25px; width: auto; border-radius: 50%; object-fit: contain; }
        .brand-text { font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); white-space: nowrap; }

        .profile-card {
            display: flex; align-items: center; gap: 12px; 
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 5px 16px 5px 18px; 
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-decoration: none; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s; flex-shrink: 0; min-width: 0;
        }
        .profile-card:hover { background: rgba(255, 255, 255, 0.4); }
        .profile-info { display: flex; flex-direction: column; text-align: right; min-width: 0; }
        
        .profile-name { font-weight: 800; font-size: 14px; color: #fff; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; } 
        .profile-username { font-weight: 700; font-size: 11px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; } 
        
        .avatar-container {
            position: relative;
            width: 38px; height: 38px; 
            min-width: 38px; min-height: 38px;
            flex-shrink: 0;
        }
        .profile-pic {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.8);
            background: #fff;
        }
        
        .profile-border {
            position: absolute;
            top: 54%; left: 50%; transform: translate(-50%, -50%);
            width: 120%; height: 138%; 
            pointer-events: none; object-fit: contain; z-index: 2;
            mix-blend-mode: multiply;
            filter: contrast(1.15) brightness(1.05);
        }

        .sub-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }

        .inventory-bar {
            display: flex; gap: 12px; align-items: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 6px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .inv-item { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 12px; font-weight: 800; }
        .inv-item img { width: 18px; height: 18px; object-fit: contain; }

        .sub-nav-links { display: flex; gap: 8px; flex-shrink: 0; }
        .sub-nav-btn {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px; border-radius: 15px;
            color: #fff; font-size: 11px; font-weight: 800;
            text-decoration: none; transition: 0.2s; white-space: nowrap;
        }
        .sub-nav-btn:hover { background: rgba(255, 255, 255, 0.45); }

        /* ==========================================
           4. CHAT CONTAINER & BUBBLE
           ========================================== */
        .chat-container {
            flex-grow: 1; overflow-y: auto; 
            padding: 15px 25px 100px 25px; display: flex; flex-direction: column; gap: 14px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.ai { align-self: flex-start; align-items: flex-start; }

        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message.user .msg-header { flex-direction: row-reverse; }
        
        .msg-avatar-wrapper {
            position: relative;
            width: 38px; height: 38px; 
            min-width: 38px; min-height: 38px;
            flex-shrink: 0; 
        }
        .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; }
        
        .msg-border {
            position: absolute; top: 51%; left: 49%; transform: translate(-50%, -50%);
            width: 135%; height: 120%; pointer-events: none; z-index: 2; object-fit: contain;
            mix-blend-mode: multiply;
            filter: contrast(1.15) brightness(1.05);
        }

        .msg-name-time { display: flex; flex-direction: column; }
        .message.user .msg-name-time { align-items: flex-end; }
        .msg-name { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .msg-time { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.75); }

        .msg-bubble {
            font-size: 14px; line-height: 1.5; word-break: break-word;
            font-weight: 700; position: relative;
        }

        /* ==========================================
           5. INPUT DOCK (BERSIH & LAPANG)
           ========================================== */
        .input-dock-wrapper {
            position: absolute; bottom: 15px; left: 20px; right: 20px;
            max-width: 800px; margin: 0 auto;
            display: flex; flex-direction: column; z-index: 30;
        }

        .input-dock {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 40px; padding: 6px 6px 6px 20px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            width: 100%;
        }

        .chat-input {
            flex-grow: 1; background: transparent; border: none;
            font-size: 15px; font-weight: 700; color: #2c3e50;
            outline: none; padding: 8px 0; min-width: 0;
        }
        .chat-input::placeholder { color: #555; font-weight: 600; }

        .send-btn {
            background: linear-gradient(135deg, #ff7700, #ff007f);
            border: none; color: white; width: 42px; height: 42px;
            border-radius: 50%; flex-shrink: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 4px 12px rgba(255, 119, 0, 0.4);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.2, 1);
        }
        .send-btn:hover { transform: scale(1.08); }
        .send-btn:active { transform: scale(0.95); }

        /* ==========================================
           6. RESPONSIVE / HP ANTI-TABRAKAN KHUSUS
           ========================================== */
        @media screen and (max-width: 768px) {
            .left-sidebar {
                position: fixed; top: 0; left: 0; height: 100%;
                width: 180px; padding: 25px 10px; gap: 10px;
                transform: translateX(-100%);
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
                align-items: stretch;
            }
            .left-sidebar.open { transform: translateX(0); }
            .side-item { width: 100%; height: 44px; flex-direction: row; justify-content: flex-start; padding: 0 15px; font-size: 12px; border-radius: 12px; }
            .sidebar-toggle-btn { display: block; }

            .top-bar { padding: 10px 12px; gap: 8px; }
            
            .top-bar-row { gap: 6px; }
            .left-group { gap: 6px; }
            
            .brand-logo { padding: 4px 10px; gap: 6px; border-radius: 20px; max-width: 150px; }
            .logo-main { height: 24px; } 
            .logo-sub { height: 18px; } 
            .brand-text { font-size: 11px; }

            .profile-card { 
                padding: 4px 10px 4px 12px; 
                gap: 8px; 
                border-radius: 25px; 
                max-width: 170px;
            } 
            .profile-name { font-size: 12px; max-width: 95px; } 
            .profile-username { font-size: 9px; max-width: 95px; } 
            .avatar-container { width: 32px; height: 32px; min-width: 32px; min-height: 32px; } 

            .sub-row { gap: 6px; justify-content: space-between; }
            .inventory-bar { 
                padding: 4px 8px; 
                gap: 7px; 
                border-radius: 15px; 
                max-width: 60%;
                overflow-x: auto;
            }
            .inv-item { font-size: 10px; gap: 3px; } 
            .inv-item img { width: 13px; height: 13px; }
            
            .sub-nav-links { gap: 5px; }
            .sub-nav-btn { font-size: 10px; padding: 4px 8px; border-radius: 12px; }
            
            .chat-container { padding: 10px 10px 90px 10px; gap: 10px; }
            .message { max-width: 92%; }
            .input-dock-wrapper { left: 10px; right: 10px; bottom: 10px; }
            .input-dock { padding: 4px 4px 4px 14px; }
            .chat-input { font-size: 14px; }
            .send-btn { width: 38px; height: 38px; font-size: 14px; }
        }

        @media screen and (max-width: 380px) {
            .brand-text { display: none; }
            .profile-name { max-width: 80px; }
            .profile-username { max-width: 80px; }
            .inventory-bar { padding: 3px 6px; gap: 5px; }
            .sub-nav-btn { font-size: 9px; padding: 3px 6px; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="latarglobal.webm" type="video/webm">
    </video>

    <div class="corner-glows">
        <div class="glow glow-tl"></div><div class="glow glow-tr"></div>
        <div class="glow glow-bl"></div><div class="glow glow-br"></div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="left-sidebar" id="leftSidebar">
        <a href="#" class="side-item active"><span class="side-icon">💬</span>Beranda</a>
        <a href="../profil/" class="side-item"><span class="side-icon">👤</span>Profil</a>
        <a href="../gacha-skin/" class="side-item"><span class="side-icon">🎁</span>Gacha</a>
        <a href="../live-jkt48/" class="side-item"><span class="side-icon">🎤</span>Live JKT</a>
        <a href="../game/" class="side-item"><span class="side-icon">🎮</span>Game</a>
        <a href="../grup/" class="side-item"><span class="side-icon">👥</span>Grup</a>
        <a href="../temen-mabar/" class="side-item"><span class="side-icon">⚔️</span>Mabar</a>
        <a href="../medsos-saver/" class="side-item"><span class="side-icon">📥</span>Saver</a>
        <a href="../koleksi-kartu/" class="side-item"><span class="side-icon">🃏</span>Kartu</a>
        <a href="../bio-member/" class="side-item"><span class="side-icon">📖</span>Bio</a>
        <a href="../link-shortcut/" class="side-item"><span class="side-icon">🔗</span>Shortcut</a>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-row">
                <div class="left-group">
                    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
                    <div class="brand-logo">
                        <img src="../logo.png.png" alt="Beyonce" class="logo-main" onerror="this.onerror=null; this.src='../logo.png';">
                        <img src="../kitty.png.png" alt="Kitty" class="logo-sub" onerror="this.onerror=null; this.src='../kitty.png';">
                        <span class="brand-text">Kitty Tenacity</span>
                    </div>
                </div>

                <div class="right-group">
                    <a href="../profil/" class="profile-card">
                        <div class="profile-info">
                            <span class="profile-name" id="profileName">Loading...</span>
                            <span class="profile-username" id="profileUsername">@loading</span>
                        </div>
                        <div class="avatar-container">
                            <img src="https://i.ibb.co.com/Y4JdtfGH/download.png" alt="Avatar" class="profile-pic" id="userAvatar" onerror="this.onerror=null; this.src='../kitty.png.png';">
                            <img src="" alt="Border" class="profile-border" id="profileBorder" style="display: none;">
                        </div>
                    </a>
                </div>
            </div>

            <div class="top-bar-row sub-row">
                <div class="inventory-bar" id="inventoryBar">
                    <div class="inv-item"><img src="KRISTAL.PNG" alt="K"> <span id="valKristal">0</span></div>
                    <div class="inv-item"><img src="TBCOIN.PNG" alt="C"> <span id="valTbCoin">0</span></div>
                    <div class="inv-item"><img src="ONCETOKEN.PNG" alt="T"> <span id="valOnceToken">0</span></div>
                    <div class="inv-item"><img src="KRISTAL_OMEGA.PNG" alt="O"> <span id="valKristalOmega">0</span></div>
                </div>

                <div class="sub-nav-links">
                    <a href="../teman/" class="sub-nav-btn">👥 Teman</a>
                    <a href="../cari-pengguna/" class="sub-nav-btn">🔍 Cari User</a>
                </div>
            </div>
        </header>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-dock-wrapper">
            <div class="input-dock">
                <input type="text" id="userInput" class="chat-input" placeholder="Ketik pesan..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()" title="Kirim Pesan">➤</button>
            </div>
        </div>
    </main>

    <script>
        const PRIMARY_URL = (window.location.origin && window.location.origin.startsWith("http") && !window.location.origin.includes("file:")) 
            ? window.location.origin 
            : "https://shinezzzz-gokgokgogkgokgok.hf.space";
        const FALLBACK_URL = "https://shinezzzz-gokgokgogkgokgok.hf.space";
        const SKIN_FOLDER_URL = "../skin/"; 
        const DEFAULT_TEMPLATE_PP = "https://i.ibb.co.com/Y4JdtfGH/download.png";
        
        let currentUserData = {
            userId: getUserId(),
            username: "User",
            skinBorderCode: "", 
            skinChatCode: "",
            linkProfil: DEFAULT_TEMPLATE_PP
        };
        let lastMessageId = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            loadStatusChat();
            loadHistoryChat();
            setInterval(pollNewChats, 3000);
        });

        function toggleSidebar() {
            document.getElementById("leftSidebar").classList.toggle("open");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }

        async function loadStatusChat() {
            try {
                const sessionKey = getCookie("user_session") || getCookie("session_key") || getCookie("sessionCookie") || localStorage.getItem("user_session") || localStorage.getItem("session_key") || sessionStorage.getItem("user_session") || "demo_user";
                
                let response;
                try {
                    response = await fetch(`${PRIMARY_URL}/statuschat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_cookie: sessionKey, sessionCookie: sessionKey, session_key: sessionKey })
                    });
                } catch(e) {
                    response = await fetch(`${FALLBACK_URL}/statuschat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_cookie: sessionKey, sessionCookie: sessionKey, session_key: sessionKey })
                    });
                }

                const data = await response.json();
                const profileObj = data.data || data.profile;

                if ((data.status === "success" || response.ok) && profileObj) {
                    const p = profileObj;
                    
                    document.getElementById("valKristal").innerText = p.kristal || 0;
                    document.getElementById("valTbCoin").innerText = p.tbCoin || 0;
                    document.getElementById("valOnceToken").innerText = p.onceToken || 0;
                    document.getElementById("valKristalOmega").innerText = p.kristalOmega || 0;
                    
                    let namaUser = p.nama || p.name || p.username || "User";
                    if (namaUser.toLowerCase() === "belum terdaftar" || namaUser.trim() === "") {
                        namaUser = p.username || "User";
                    }
                    currentUserData.username = namaUser;

                    // Fallback Pintar PP: Jika kosong, pakai template OS default (ImgBB / download.png)
                    let userPhoto = p.photoProfile || p.linkProfil || "";
                    if (!userPhoto || userPhoto.trim() === "" || userPhoto.toLowerCase() === "none") {
                        userPhoto = DEFAULT_TEMPLATE_PP;
                    }
                    currentUserData.linkProfil = userPhoto;
                    
                    let rawSkinCode = "";
                    if (p.skin) {
                        rawSkinCode = typeof p.skin === 'string' ? p.skin : (p.skin.border || p.skin.border_skin || "");
                    } else if (p.skins) {
                        rawSkinCode = p.skins.border_skin || p.skins.chat_skin || "";
                    } else if (typeof p.inventory === "string") {
                        rawSkinCode = p.inventory;
                    }

                    if (rawSkinCode) {
                        let baseCode = rawSkinCode.replace(/BORDER_/i, "").replace(/CHAT_/i, "").replace(/\.jpg$/i, '').replace(/\.jpeg$/i, '').replace(/\.png$/i, '');
                        currentUserData.skinBorderCode = "BORDER_" + baseCode;
                        currentUserData.skinChatCode = "CHAT_" + baseCode;
                    }

                    let cleanUsername = (p.username || currentUserData.userId || "user");
                    if (cleanUsername.includes("@")) cleanUsername = cleanUsername.split("@")[0];
                    document.getElementById("profileName").innerText = currentUserData.username;
                    document.getElementById("profileUsername").innerText = "@" + cleanUsername;
                    
                    const avatarImg = document.getElementById("userAvatar");
                    avatarImg.src = currentUserData.linkProfil;
                    avatarImg.onerror = function() { this.src = "../kitty.png.png"; };
                    
                    if(currentUserData.skinBorderCode) {
                        const borderEl = document.getElementById("profileBorder");
                        borderEl.src = SKIN_FOLDER_URL + currentUserData.skinBorderCode + ".png"; 
                        borderEl.onerror = function() {
                            if (!this.src.endsWith('.jpg')) {
                                this.src = SKIN_FOLDER_URL + currentUserData.skinBorderCode + ".jpg";
                            }
                        };
                        borderEl.style.display = "block";
                    }
                }
            } catch (error) {
                console.error("Gagal load status chat:", error);
            }
        }

        async function loadHistoryChat() {
            try {
                let response;
                try {
                    response = await fetch(`${PRIMARY_URL}/historychat`, { method: 'GET' });
                } catch(e) {
                    response = await fetch(`${FALLBACK_URL}/historychat`, { method: 'GET' });
                }
                const data = await response.json();
                
                if(data.history && Array.isArray(data.history)) {
                    document.getElementById("chatContainer").innerHTML = ""; 
                    data.history.forEach(msg => {
                        renderChatHTML(msg, msg.senderId === currentUserData.userId);
                        lastMessageId = msg.id || lastMessageId;
                    });
                }
            } catch (error) { console.error("Gagal load history:", error); }
        }

        async function pollNewChats() {
            try {
                let response;
                try {
                    response = await fetch(`${PRIMARY_URL}/getnewchats?lastId=${lastMessageId}`, { method: 'GET' });
                } catch(e) {
                    response = await fetch(`${FALLBACK_URL}/getnewchats?lastId=${lastMessageId}`, { method: 'GET' });
                }
                const data = await response.json();
                if(data.newChats && data.newChats.length > 0) {
                    data.newChats.forEach(msg => {
                        renderChatHTML(msg, msg.senderId === currentUserData.userId);
                        lastMessageId = msg.id;
                    });
                }
            } catch (error) {}
        }

        function renderChatHTML(msgData, isSelf) {
            const chatContainer = document.getElementById("chatContainer");
            const sideClass = isSelf ? "user" : "ai";
            
            let displayName = isSelf ? "Kamu" : (msgData.username || "System");
            if (displayName.toLowerCase() === "belum terdaftar") {
                displayName = "User"; 
            }
            
            const timeHTML = `<span class="msg-time">${msgData.waktu || getCurrentTime()}</span>`;
            
            let bgStyle = "";
            let borderHTML = "";
            let rawSkin = msgData.skinChatCode || msgData.skinBorderCode || msgData.skin || "";

            if (rawSkin) {
                let baseCode = rawSkin.replace(/BORDER_/i, "").replace(/CHAT_/i, "").replace(/\.jpg$/i, '').replace(/\.jpeg$/i, '').replace(/\.png$/i, '');
                let chatSkinUrl = SKIN_FOLDER_URL + "CHAT_" + baseCode + ".png"; 
                
                bgStyle = `
                    border-style: solid !important;
                    border-width: 45px 50px 45px 80px !important; 
                    border-image-source: url('${chatSkinUrl}') !important;
                    border-image-slice: 70 90 60 130 fill !important; 
                    border-image-repeat: stretch !important;
                    background: transparent !important; 
                    box-shadow: none !important; 
                    color: #4a3b32 !important; 
                    border-radius: 0 !important; 
                    padding: 5px 25px !important; 
                    min-width: 160px !important; 
                    min-height: 80px !important; 
                    width: fit-content !important; 
                    max-width: 100% !important; 
                    display: flex !important;
                    align-items: center !important; 
                    word-break: break-word !important;
                `;
                
                let borderFallbackPath = SKIN_FOLDER_URL + "BORDER_" + baseCode + ".png";
                let borderFullPath = SKIN_FOLDER_URL + "BORDER_" + baseCode + ".jpg";
                borderHTML = `<img src="${borderFallbackPath}" class="msg-border" onerror="this.src='${borderFullPath}'; this.onerror=null;">`;
            } else {
                if (isSelf) {
                    bgStyle = `
                        background: rgba(255, 255, 255, 0.85);
                        border-radius: 20px 20px 4px 20px; 
                        border-right: 4px solid #ff7700;
                        padding: 10px 16px;
                        backdrop-filter: blur(12px); 
                        -webkit-backdrop-filter: blur(12px);
                        border: 1px solid rgba(255, 255, 255, 0.7);
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                        color: #2c3e50;
                    `;
                } else {
                    bgStyle = `
                        background: rgba(255, 255, 255, 0.85);
                        border-radius: 20px 20px 20px 4px; 
                        border-left: 4px solid #1a5cff;
                        padding: 10px 16px;
                        backdrop-filter: blur(12px); 
                        -webkit-backdrop-filter: blur(12px);
                        border: 1px solid rgba(255, 255, 255, 0.7);
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                        color: #2c3e50;
                    `;
                }
            }
            
            let ppSrc = msgData.linkProfil || (isSelf ? currentUserData.linkProfil : DEFAULT_TEMPLATE_PP);
            if (!ppSrc || ppSrc.trim() === "" || ppSrc.toLowerCase() === "none") {
                ppSrc = DEFAULT_TEMPLATE_PP;
            }

            const html = `
                <div class="message ${sideClass}">
                    <div class="msg-header">
                        <div class="msg-avatar-wrapper">
                            <img src="${ppSrc}" class="msg-avatar" onerror="this.onerror=null; this.src='../kitty.png.png';">
                            ${borderHTML}
                        </div>
                        <div class="msg-name-time">
                            <span class="msg-name">${displayName}</span>${timeHTML}
                        </div>
                    </div>
                    <div class="msg-bubble" style="${bgStyle}">${msgData.chat}</div>
                </div>`;
            
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getCurrentTime() {
            const d = new Date(); return d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
        }

        function getCookie(name) {
            let nameEQ = name + "="; let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            } return null;
        }

        function getUserId() {
            // Return FULL session key — jangan dipotong! Potongan 10 karakter menyebabkan backend membuat baris user kosong baru
            return getCookie("user_session") || getCookie("session_key") || getCookie("sessionCookie") || localStorage.getItem("user_session") || localStorage.getItem("session_key") || "demo_user";
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;
            
            inputField.value = ""; 

            const payloadGlobal = {
                id: currentUserData.userId,
                chat: messageText,
                skin: currentUserData.skinBorderCode, 
                waktu: getCurrentTime(),
                linkProfil: currentUserData.linkProfil,
                username: currentUserData.username
            };
            renderChatHTML(payloadGlobal, true);
            
            try {
                await fetch(`${PRIMARY_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadGlobal)
                });
            } catch(e) {
                try {
                    await fetch(`${FALLBACK_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadGlobal)
                    });
                } catch(e2) {
                    console.error("Gagal mengirim chat global", e2);
                }
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
