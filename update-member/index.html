    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030712;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .video-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
            filter: brightness(0.6);
            transform: translateZ(0);
            will-change: transform;
            contain: strict;
        }

        .corner-glows {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden; contain: strict;
        }
        .glow { position: absolute; width: 50vw; height: 50vw; max-width: 450px; max-height: 450px; border-radius: 50%; opacity: 0.2; pointer-events: none; }
        .glow-tl { top: -10%; left: -10%; background: radial-gradient(circle, #ff007f 0%, transparent 70%); }
        .glow-tr { top: -10%; right: -10%; background: radial-gradient(circle, #ff7700 0%, transparent 70%); }
        .glow-bl { bottom: -10%; left: -10%; background: radial-gradient(circle, #0088ff 0%, transparent 70%); }
        .glow-br { bottom: -10%; right: -10%; background: radial-gradient(circle, #9d4edd 0%, transparent 70%); opacity: 0.15; }

        .left-sidebar {
            width: 90px;
            background: rgba(11, 17, 33, 0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 5px; gap: 12px; z-index: 100;
            overflow-y: auto; flex-shrink: 0;
            transform: translateZ(0); will-change: transform;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.25s ease-out;
        }
        .left-sidebar::-webkit-scrollbar { display: none; }

        .side-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 10px;
            background: rgba(255, 255, 255, 0.1); width: 70px; height: 60px; border-radius: 16px;
            transition: transform 0.15s ease, background 0.15s ease; border: 1px solid rgba(255, 255, 255, 0.18); text-align: center;
            gap: 4px; flex-shrink: 0; contain: content;
        }
        .side-item:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.03); }
        .side-item.active { background: rgba(255, 255, 255, 0.9); color: #1a5cff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .side-icon { font-size: 20px; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 90; opacity: 0; transition: opacity 0.25s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            position: relative; height: 100%; overflow: hidden; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; z-index: 20; width: 100%;
        }

        .left-group { display: flex; align-items: center; gap: 12px; }
        .sidebar-toggle-btn {
            display: none; background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff; font-size: 18px; padding: 6px 12px;
            border-radius: 12px; cursor: pointer; flex-shrink: 0;

        .brand-logo {
            display: flex; align-items: center; gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 6px 16px; border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);

        .logo-main { height: 35px; width: auto; border-radius: 50%; }
        .brand-text { font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }

        .sub-nav-container {
            display: flex; gap: 10px; padding: 0 25px 12px 25px; overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .sub-nav-container::-webkit-scrollbar { display: none; }
        .pill-tab {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; padding: 8px 18px; border-radius: 20px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease; white-space: nowrap;
        }
        .pill-tab:hover { background: rgba(255, 255, 255, 0.25); }
        .pill-tab.active { background: #fff; color: #1a5cff; border-color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .stage-container {
            flex-grow: 1; overflow-y: auto; padding: 10px 25px 30px 25px;
            display: flex; flex-direction: column; gap: 20px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            will-change: scroll-position;
        }
        .stage-container::-webkit-scrollbar { width: 6px; }
        .stage-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

        .glass-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px; padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            contain: content;
        }
        .card-title { font-size: 18px; font-weight: 800; color: #ffd700; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-family: 'Cinzel', serif; }

        /* FEED GRID & CARDS */
        .feed-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;
        }
        .feed-item-card {
            background: rgba(6, 10, 20, 0.85); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px; padding: 18px; display: flex; flex-direction: column;
            gap: 12px; transition: transform 0.15s ease, border-color 0.15s ease;
            contain: content;
            content-visibility: auto;
            contain-intrinsic-size: 380px;
        }
        .feed-item-card:hover { border-color: #00d4ff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,212,255,0.15); }

        .feed-header { display: flex; justify-content: space-between; align-items: center; }
        .feed-member-info { display: flex; align-items: center; gap: 10px; }
        .feed-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ffd700; object-fit: cover; }
        .feed-member-name { font-size: 14px; font-weight: 800; color: #fff; }
        .feed-meta { font-size: 11px; color: rgba(255,255,255,0.6); }

        .platform-badge {
            font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 12px; text-transform: uppercase;
        }
        .badge-instagram { background: rgba(255,0,127,0.25); border: 1px solid #ff007f; color: #ff007f; }
        .badge-x { background: rgba(0,212,255,0.25); border: 1px solid #00d4ff; color: #00d4ff; }
        .badge-tiktok { background: rgba(255,119,0,0.25); border: 1px solid #ff7700; color: #ff7700; }
        .badge-showroom { background: rgba(0,255,136,0.25); border: 1px solid #00ff88; color: #00ff88; }

        .feed-caption { font-size: 13px; color: #fff; line-height: 1.5; }
        .feed-media-img { width: 100%; max-height: 300px; border-radius: 14px; object-fit: cover; background: #111; }

        .feed-action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: auto; }

        @media screen and (max-width: 768px) {
            .left-sidebar {
                position: fixed; top: 0; left: 0; height: 100%;
                width: 180px; padding: 25px 10px; gap: 10px;
                transform: translateX(-100%);

            .left-sidebar.open { transform: translateX(0); }
            .side-item { width: 100%; height: 44px; flex-direction: row; justify-content: flex-start; padding: 0 15px; font-size: 12px; border-radius: 12px; }
            .sidebar-toggle-btn { display: block; }
            .top-bar { padding: 10px 15px; }
            .sub-nav-container { padding: 0 15px 10px 15px; }
            .stage-container { padding: 10px 15px 20px 15px; }
            .feed-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                    <input type="text" id="feedSearch" placeholder="🔍 Cari oshi..." oninput="filterFeeds()" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); border-radius: 14px; padding: 8px 16px; color: #fff; font-size: 12px; outline: none; width: 200px;">
                </div>

    <script>
        function toggleSidebar() {

        let feedsData = [];
        let currentPlatform = "ALL";

        const FALLBACK_FEEDS = [

                original_link: "https://twitter.com/Freya_JKT48",
                hd_download_url: "https://i.ibb.co.com/Y4JdtfGH/download.png",
                media_url: "https://i.ibb.co.com/Y4JdtfGH/download.png"
            },
            {

                caption: "Dance challenge lagu baru! 🍕 Yuk ikutan dance bareng!",

                hd_download_url: "https://i.ibb.co.com/Y4JdtfGH/download.png",

            },
            {
                member_name: "Fiony Alveria",
                platform: "Instagram",
                post_type: "Post",
                caption: "Photoshoot edisi musim panas 🌸 Terima kasih buat yang udah hadir kemarin!",
                username: "@jkt48.fiony",
                timestamp: "2 jam yang lalu",
                original_link: "https://instagram.com/jkt48.fiony",
                hd_download_url: "https://i.ibb.co.com/Y4JdtfGH/download.png",
                media_url: "https://i.ibb.co.com/Y4JdtfGH/download.png"
            },
            {
                member_name: "Kathrina Irene",
                platform: "Showroom",
                post_type: "Live Stream",
                caption: "Kathrina Irene sedang Live di Showroom! Yuk tonton sekarang!",
                username: "Kathrina_JKT48",
                timestamp: "3 jam yang lalu",
                original_link: "https://www.showroom-live.com/r/JKT48_Kathrina",
                hd_download_url: "https://i.ibb.co.com/Y4JdtfGH/download.png",
                media_url: "https://i.ibb.co.com/Y4JdtfGH/download.png"
            }
        ];

        async function loadFeedsFromBot() {
            const botUrl = getApiUrl("notifier") + "/load";
            try {
                const res = await fetch(botUrl, { cache: "no-store" });
                if (!res.ok) throw new Error("Bot offline");
                const data = await res.json();
                feedsData = (data && data.updates && data.updates.length) ? data.updates : FALLBACK_FEEDS;
                document.getElementById("botStatusText").innerText = "🟢 Terhubung ke Dedicated Bot Telegram (Iddiletele)";
            } catch (err) {
                console.log("Using cached / fallback feeds:", err);
                feedsData = FALLBACK_FEEDS;
                document.getElementById("botStatusText").innerText = "🟢 Live Feed Aktif (Sync via Bot Cache)";
            }
            renderFeeds();
        }

        function renderFeeds() {
            const grid = document.getElementById("feedGrid");
            grid.innerHTML = "";
            const search = document.getElementById("feedSearch").value.toLowerCase();

            const filtered = feedsData.filter(item => {
                const matchPlatform = (currentPlatform === "ALL" || item.platform.toLowerCase() === currentPlatform.toLowerCase());
                const matchSearch = item.member_name.toLowerCase().includes(search) || item.caption.toLowerCase().includes(search);
                return matchPlatform && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: rgba(255,255,255,0.6);">Belum ada update untuk platform/member ini.</div>`;
                return;
            }

            filtered.forEach(item => {
                const badgeClass = `badge-${item.platform.toLowerCase()}`;
                const card = document.createElement("div");
                card.className = "feed-item-card";
                card.innerHTML = `
                    <div class="feed-header">
                        <div class="feed-member-info">
                            <img src="${item.media_url || 'https://i.ibb.co.com/Y4JdtfGH/download.png'}" class="feed-avatar" alt="${item.member_name}">
                            <div>
                                <div class="feed-member-name">${item.member_name}</div>
                                <div class="feed-meta">${item.username} • ${item.timestamp}</div>
                            </div>
                        </div>
                        <span class="platform-badge ${badgeClass}">${item.platform} ${item.post_type}</span>
                    </div>

                    <div class="feed-caption">"${item.caption}"</div>

                    <img src="${item.media_url || 'https://i.ibb.co.com/Y4JdtfGH/download.png'}" class="feed-media-img" alt="Media Preview">

                    <div class="feed-action-bar">
                        <a href="${item.hd_download_url || item.media_url}" target="_blank" class="pill-tab" style="padding: 5px 14px; font-size: 11px; background: linear-gradient(135deg, #1a5cff, #00d4ff); text-decoration: none;">💎 Download HD</a>
                        <a href="${item.original_link}" target="_blank" style="font-size: 11px; color: #ffd700; font-weight: 800; text-decoration: none;">👉 Lihat di ${item.platform}</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPlatform(platform, btnEl) {
            document.querySelectorAll('.sub-nav-container .pill-tab').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            currentPlatform = platform;
            renderFeeds();
        }

        function filterFeeds() {
            renderFeeds();
        }

        loadFeedsFromBot();
    </script>
</body>
